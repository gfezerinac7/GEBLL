      await batch.commit();
      toast(cancel ? "Event cancelled" : "Event restored");
    });
  },
  "event-delete": (el) => {
    const e = eventById(el.dataset.id);
    confirmRun(`Delete ${eventTitle(e)} on ${e.date}? Responses stay in the log.`, async () => {
      const batch = writeBatch(db);
      batch.delete(doc(db, "events", e.id));
      log(batch, "Deleted event", { label: `${eventTitle(e)} · ${e.date}` });
      await batch.commit();
      S.eventId = null; toast("Event deleted");
    });
  },
  "event-delete-series": (el) => {
    const e = eventById(el.dataset.id);
    const list = S.events.filter((x) => x.seriesId === e.seriesId && x.date >= e.date);
    confirmRun(`Delete ${plural(list.length, "event")} (this one and the following in the series)?`, async () => {
      const batch = writeBatch(db);
      list.forEach((x) => batch.delete(doc(db, "events", x.id)));
      log(batch, "Deleted events in series", { label: `${eventTitle(e)} · from ${e.date} (${list.length})` });
      await batch.commit();
      S.eventId = null; toast(`${plural(list.length, "event")} deleted`);
    });
  },
  respond: async (el) => {
    const e = eventById(el.dataset.event), m = memberById(el.dataset.member), r = el.dataset.r;
    if (!e || !m) return;
    if (isClosed(e) && !canManageTeam(e.teamId)) { toast("Responses are closed for this event.", "error"); return; }
    if (r === "late") { reasonModal(e, m, r); return; }
    await saveResponse(e, m, r);
    toast(`${m.firstName}: ${RESPONSES[r][0]}`);
  },
  "respond-for": (el) => respondForModal(eventById(el.dataset.event), memberById(el.dataset.member)),
  validate: async (el) => {
    const e = eventById(el.dataset.event), mid = el.dataset.member, v = el.dataset.v;
    const current = attOf(e.id, mid)?.validated;
    await saveValidation(e, [mid], current === v ? null : v);
  },
  "validate-going": async (el) => {
    const e = eventById(el.dataset.id);
    const ids = eventRoster(e).filter((m) => attOf(e.id, m.id)?.response === "yes" && !attOf(e.id, m.id)?.validated).map((m) => m.id);
    if (!ids.length) { toast("No unvalidated “Going” players."); return; }
    await saveValidation(e, ids, "present");
    toast(`${plural(ids.length, "player")} marked present`);
  },
  "absence-new": () => absenceModal(),
  "absence-delete": (el) => confirmRun("Remove this unavailability?", async () => {
    const batch = writeBatch(db);
    batch.delete(doc(db, "absences", el.dataset.id));
    log(batch, "Removed unavailability", { label: el.dataset.id });
    await batch.commit();
  }),
  "venue-new": () => venueModal(null),
  "venue-edit": (el) => venueModal(venueById(el.dataset.id)),
  "venue-delete": (el) => confirmRun("Delete this venue? Events keep their data but show no venue.", async () => {
    const batch = writeBatch(db);
    batch.delete(doc(db, "venues", el.dataset.id));
    log(batch, "Deleted venue", { label: venueById(el.dataset.id)?.name || "" });
    await batch.commit();
    closeModal();
  })
});


/* =========================================================
   CALL-UPS & ANNOUNCEMENTS (v-0.3)
   ========================================================= */
const CALLUP_MAX = 12;
// team players by jersey number first, then players from other teams by name
function callUpOrder(e) {
  const key = (m) => (m.playerTeamId === e.teamId && hasNum(m.number) ? Number(m.number) : m.playerTeamId === e.teamId ? 900 : 1000);
  return (a, b) => key(a) - key(b) || fullName(a).localeCompare(fullName(b));
}
function callUpBadge(e) {
  const n = (e.callUpIds || []).length;
  if (callUpPublished(e)) return `<div class="small" style="margin-top:4px"><span class="badge ok">Call-up · ${n}</span></div>`;
  if (canManageTeam(e.teamId)) return `<div class="small" style="margin-top:4px"><span class="badge ${n ? "warn" : ""}">${n ? `Call-up draft · ${n}` : "No call-up yet"}</span></div>`;
  return "";
}
function callUpSection(e, manage) {
  const ids = e.callUpIds || [];
  const published = callUpPublished(e);
  const chips = ids.map(memberById).filter(Boolean).sort(callUpOrder(e))
    .map((m) => `<span class="chip">${hasNum(m.number) && m.playerTeamId === e.teamId ? `<b>#${esc(m.number)}</b> ` : ""}${esc(fullName(m))}${m.playerTeamId !== e.teamId && teamById(m.playerTeamId) ? ` <span class="muted">(${esc(teamById(m.playerTeamId).name)})</span>` : ""}</span>`).join("");
  let html = `<div class="section-title spread"><span>Call-up</span>${manage && !isPast(e) ? `<button class="btn primary sm" data-act="callup-edit" data-id="${e.id}">${ids.length ? "Edit call-up" : "Select players"}</button>` : ""}</div>`;
  if (manage) {
    html += `<div class="card stack" style="gap:8px">
      <div class="spread"><div>${published ? `<span class="badge ok">Published</span> <span class="small muted">${esc(fmtDateTime(e.callUpPublishedAt))} · ${esc(e.callUpByName || "")}</span>` : ids.length ? `<span class="badge warn">Draft</span> <span class="small muted">Only coaches can see it</span>` : `<span class="muted small">No players selected yet.</span>`}</div>
        <span class="small ${ids.length > CALLUP_MAX ? "bad-text" : "muted"}">${ids.length}/${CALLUP_MAX}</span></div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${!isPast(e) && ids.length ? `<div class="row">${published ? `<button class="btn sm" data-act="callup-unpublish" data-id="${e.id}">Unpublish</button>` : `<button class="btn primary sm" data-act="callup-publish" data-id="${e.id}">Publish call-up</button>`}</div>` : ""}
    </div>`;
  } else if (published) {
    html += `<div class="card"><div class="chips">${chips}</div></div>`;
  } else {
    html += `<div class="card empty">The call-up has not been published yet.</div>`;
  }
  return html;
}
function callUpModal(e) {
  const t = teamById(e.teamId);
  const selected = new Set(e.callUpIds || []);
  const byNum = (a, b) => Number(hasNum(a.number) ? a.number : 999) - Number(hasNum(b.number) ? b.number : 999) || fullName(a).localeCompare(fullName(b));
  const teamPlayers = rosterOf(e.teamId).sort(byNum);
  const others = S.members.filter((m) => roles(m).player && m.playerTeamId !== e.teamId).sort((a, b) => fullName(a).localeCompare(fullName(b)));
  const row = (m) => {
    const a = attOf(e.id, m.id), ab = absenceFor(m.id, e.date);
    const r = a?.response ? RESPONSES[a.response] : null;
    return `<label class="pick"><input type="checkbox" name="cu_${m.id}" ${selected.has(m.id) ? "checked" : ""}>
      <span class="num ${hasNum(m.number) && m.playerTeamId === e.teamId ? "" : "none"}">${hasNum(m.number) && m.playerTeamId === e.teamId ? esc(m.number) : "–"}</span>
      <span class="main"><span class="title">${esc(fullName(m))}</span>
        <span class="small muted">${[m.pos1, m.pos2].filter(Boolean).join(" / ")}${m.playerTeamId !== e.teamId && teamById(m.playerTeamId) ? ` · ${esc(teamById(m.playerTeamId).name)}` : ""}</span></span>
      ${ab ? `<span class="badge warn">Unavailable</span>` : r ? `<span class="badge ${r[1]}">${r[0]}</span>` : ""}</label>`;
  };
  openModal({
    title: `Call-up · ${eventTitle(e)}`,
    body: `<div class="small muted">${esc(t?.name || "")} · ${esc(fmtDay(e.date, { weekday: "short", day: "numeric", month: "short" }))} ${esc(e.startTime || "")}</div>
      <div class="spread"><b id="cu-count">${selected.size} selected</b><span class="small muted">Max ${CALLUP_MAX} players</span></div>
      <div class="list">${teamPlayers.length ? teamPlayers.map(row).join("") : `<div class="item muted">No players on ${esc(t?.name || "this team")}.</div>`}</div>
      ${others.length ? `<details class="others"><summary>Players from other teams (${others.length})</summary><div class="list" style="margin-top:8px">${others.map(row).join("")}</div></details>` : ""}
      <label class="check"><input type="checkbox" name="publish" ${callUpPublished(e) ? "checked" : ""}> Publish now (players and parents can see it)</label>`,
    submitLabel: "Save call-up",
    onSubmit: async (d) => {
      const ids = S.members.filter((m) => d[`cu_${m.id}`]).map((m) => m.id);
      if (d.publish && !ids.length) throw new Error("Select at least one player before publishing.");
      if (ids.length > CALLUP_MAX && !window.confirm(`${ids.length} players selected (max ${CALLUP_MAX}). Save anyway?`)) return false;
      await saveCallUp(e, ids, !!d.publish);
      toast(d.publish ? "Call-up published" : "Call-up saved as draft");
    }
  });
  const root = $("#modal-root");
  root.querySelectorAll('input[name^="cu_"]').forEach((cb) => cb.addEventListener("change", () => {
    const n = root.querySelectorAll('input[name^="cu_"]:checked').length;
    const el = $("#cu-count"); if (el) { el.textContent = `${n} selected`; el.classList.toggle("bad-text", n > CALLUP_MAX); }
  }));
}
async function saveCallUp(e, ids, publish) {
  const batch = writeBatch(db);
  const data = { callUpIds: ids, callUpPublished: publish, callUpBy: S.user.uid, callUpByName: S.me.name || "", callUpUpdatedAt: serverTimestamp(), updatedAt: serverTimestamp() };
  if (publish && !callUpPublished(e)) data.callUpPublishedAt = serverTimestamp();
  batch.update(doc(db, "events", e.id), data);
  if (publish) {
    queuePush(batch, { title: "Call-up published", body: `${eventTitle(e)} · ${fmtDay(e.date, { weekday: "short", day: "numeric", month: "short" })} ${e.startTime || ""}`,
      memberIds: ids, tag: `callup_${e.id}`, reason: "callup" });
  }
  log(batch, publish ? "Published call-up" : "Saved call-up draft", { label: `${eventTitle(e)} · ${e.date} · ${ids.length} players` });
  await batch.commit();
}

/* ---------- announcements ---------- */
function seenKey() { return `bbapp_seen_news_${S.user?.uid || ""}`; }
function lastSeenNews() { try { return Number(localStorage.getItem(seenKey()) || 0); } catch (_) { return 0; } }
function markNewsSeen() { try { localStorage.setItem(seenKey(), String(Date.now())); } catch (_) {} }
function relevantNews() {
  const mine = myTeamIds();
  return S.announcements
    .filter((a) => isAdmin() || !(a.teamIds || []).length || (a.teamIds || []).some((t) => mine.includes(t)) || a.createdBy === S.user.uid)
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (tsMillis(b.createdAt) || Date.now()) - (tsMillis(a.createdAt) || Date.now()));
}
const canEditNews = (a) => isAdmin() || (isCoach() && (a.teamIds || []).length > 0 && (a.teamIds || []).every((t) => coachOf().includes(t)));
function newsItem(a, full = false) {
  const isNew = tsMillis(a.createdAt) > lastSeenNews() && a.createdBy !== S.user.uid;
  const aud = (a.teamIds || []).length ? (a.teamIds || []).map((t) => teamById(t)?.name).filter(Boolean).join(", ") : "Whole club";
  const body = full || (a.body || "").length <= 220 ? a.body || "" : `${a.body.slice(0, 220)}…`;
  return `<div class="card news ${a.pinned ? "pinned" : ""}">
    <div class="spread" style="align-items:flex-start"><div class="title" style="font-weight:700">${a.pinned ? "📌 " : ""}${esc(a.title)} ${isNew ? `<span class="badge accent">New</span>` : ""}</div>
      ${full && canEditNews(a) ? `<button class="btn sm" data-act="news-edit" data-id="${a.id}">Edit</button>` : ""}</div>
    <div class="news-body">${esc(body)}</div>
    <div class="small muted" style="margin-top:6px">${esc(aud)} · ${esc(a.createdByName || "")} · ${esc(fmtDateTime(a.createdAt))}${a.public ? " · 🌐 Public" : ""}</div>
  </div>`;
}
function homeNewsSection() {
  const list = relevantNews();
  const canPost = isStaff();
  if (!list.length && !canPost) return "";
  let html = `<div class="section-title spread"><span>Announcements</span><button class="btn ghost sm" data-act="tab" data-tab="news">${list.length ? "See all ›" : "Open ›"}</button></div>`;
  html += list.length ? `<div class="stack">${list.slice(0, 2).map((a) => newsItem(a)).join("")}</div>` : `<div class="card empty">No announcements yet.</div>`;
  return html;
}
function viewNews() {
  const list = relevantNews();
  const html = `<button class="btn ghost sm" data-act="tab" data-tab="home">‹ Home</button>
    <div class="spread" style="margin-top:6px"><h2>Announcements</h2>${isStaff() ? `<button class="btn primary sm" data-act="news-new">+ New</button>` : ""}</div>
    <div class="stack" style="margin-top:12px">${list.length ? list.map((a) => newsItem(a, true)).join("") : `<div class="card empty">No announcements yet.</div>`}</div>`;
  setTimeout(markNewsSeen, 1500);
  return html;
}
function newsModal(a) {
  const season = activeSeason();
  const teams = S.teams.filter((t) => (isAdmin() || coachOf().includes(t.id)) && (!season || t.seasonId === season.id || (a?.teamIds || []).includes(t.id)));
  const club = a ? !(a.teamIds || []).length : isAdmin();
  openModal({
    title: a ? "Edit announcement" : "New announcement",
    body: `<label class="f">Title<input type="text" name="title" maxlength="80" value="${esc(a?.title || "")}" required></label>
      <label class="f">Message<textarea name="body" rows="5" maxlength="2000">${esc(a?.body || "")}</textarea></label>
      <div class="f" style="font-size:13px;color:var(--muted);font-weight:600">Who can see it</div>
      <div class="card" style="padding:6px 12px">
        ${isAdmin() ? `<label class="check" style="padding:6px 0"><input type="checkbox" name="club" id="news-club" ${club ? "checked" : ""}> Whole club</label>` : ""}
        <div id="news-teams" ${club && isAdmin() ? "hidden" : ""}>${teams.map((t) => `<label class="check" style="padding:6px 0"><input type="checkbox" name="team_${t.id}" ${(a?.teamIds || []).includes(t.id) || (!a && !isAdmin() && teams.length === 1) ? "checked" : ""}> ${esc(t.name)}</label>`).join("")}</div>
      </div>
      <label class="check"><input type="checkbox" name="pinned" ${a?.pinned ? "checked" : ""}> Pin to the top</label>
      <label class="check"><input type="checkbox" name="public" ${a?.public ? "checked" : ""}> Show on the public website</label>
      <p class="small muted" style="margin:0">Public announcements can be read by anyone on the club website.</p>`,
    danger: a ? `<button type="button" class="btn danger" data-act="news-delete" data-id="${a.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      if (!d.title?.trim()) throw new Error("Title is required.");
      const teamIds = isAdmin() && d.club ? [] : teams.filter((t) => d[`team_${t.id}`]).map((t) => t.id);
      if (!(isAdmin() && d.club) && !teamIds.length) throw new Error("Choose at least one team.");
      const data = { title: d.title.trim(), body: (d.body || "").trim(), teamIds, pinned: !!d.pinned, public: !!d.public, updatedAt: serverTimestamp() };
      const batch = writeBatch(db);
      const ref = a ? doc(db, "announcements", a.id) : doc(collection(db, "announcements"));
      if (a) batch.update(ref, data);
      else {
        batch.set(ref, { ...data, createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp() });
        queuePush(batch, { title: `📣 ${data.title}`, body: (data.body || "").slice(0, 140) || clubName(),
          teamIds: data.teamIds, everyone: !data.teamIds.length, tag: `news_${ref.id}`, reason: "announcement" });
      }
      log(batch, a ? "Edited announcement" : "Posted announcement", { label: data.title });
      await batch.commit();
      toast(a ? "Announcement saved" : "Announcement posted");
    }
  });
  $("#news-club")?.addEventListener("change", (ev) => { const box = $("#news-teams"); if (box) box.hidden = ev.target.checked; });
}

/* =========================================================
   TOURNAMENT & STANDINGS (v-0.4) + STATISTICS (v-0.5)
   ========================================================= */
const US = "us";
const STAT_DEFS = [
  { k: "pts", l: "PTS", n: "Points" },
  { k: "pf", l: "PF", n: "Fouls" },
  { k: "fg2m", l: "2P", n: "2-pointers made" },
  { k: "fg3m", l: "3P", n: "3-pointers made" },
  { k: "ftm", l: "FT", n: "Free throws made" },
  { k: "reb", l: "REB", n: "Rebounds" },
  { k: "ast", l: "AST", n: "Assists" },
  { k: "stl", l: "STL", n: "Steals" },
  { k: "blk", l: "BLK", n: "Blocks" },
  { k: "tov", l: "TO", n: "Turnovers" },
  { k: "min", l: "MIN", n: "Minutes" }
];
const statsOn = () => S.statSettings?.enabled || { pts: true, pf: true };
const enabledStats = () => STAT_DEFS.filter((d) => statsOn()[d.k]);
const autoPoints = () => ["fg2m", "fg3m", "ftm"].every((k) => statsOn()[k]);
const statKey = (eid, mid) => `${eid}_${mid}`;
const statsOf = (eid, mid) => S.gameStats[statKey(eid, mid)];

const tournamentById = (id) => byId(S.tournaments, id);
const tournamentsFor = (teamId) => S.tournaments.filter((x) => x.teamId === teamId);
function entryName(tr, key) {
  const e = (tr.entries || []).find((x) => x.key === key);
  return e ? e.name : key === US ? teamById(tr.teamId)?.name || "Us" : "?";
}
function tournamentGames(tr) {
  const list = S.tournamentGames.filter((g) => g.tournamentId === tr.id).map((g) => ({ ...g, fromEvent: false }));
  S.events.filter((e) => e.tournamentId === tr.id && e.type === "game" && hasResult(e) && e.status !== "cancelled").forEach((e) => {
    const away = e.homeAway === "away";
    list.push({
      id: `ev_${e.id}`, tournamentId: tr.id, date: e.date, fromEvent: true, eventId: e.id,
      homeKey: away ? e.opponentKey || "?" : US, awayKey: away ? US : e.opponentKey || "?",
      homeScore: away ? e.scoreAgainst : e.scoreFor, awayScore: away ? e.scoreFor : e.scoreAgainst
    });
  });
  return list.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
}
function standingsRows(tr) {
  const rows = new Map();
  (tr.entries || []).forEach((e) => rows.set(e.key, { key: e.key, name: e.name, isUs: e.key === US, gp: 0, w: 0, l: 0, pf: 0, pa: 0, pts: 0 }));
  const win = Number(tr.pointsWin ?? 2), loss = Number(tr.pointsLoss ?? 1), noShow = Number(tr.pointsForfeit ?? 0);
  tournamentGames(tr).forEach((g) => {
    if (!hasNum(g.homeScore) || !hasNum(g.awayScore)) return;
    const h = rows.get(g.homeKey), a = rows.get(g.awayKey);
    if (!h || !a) return;
    const hs = Number(g.homeScore), as = Number(g.awayScore);
    h.gp++; a.gp++; h.pf += hs; h.pa += as; a.pf += as; a.pa += hs;
    if (hs > as) { h.w++; a.l++; h.pts += win; a.pts += g.forfeitBy === g.awayKey ? noShow : loss; }
    else if (as > hs) { a.w++; h.l++; a.pts += win; h.pts += g.forfeitBy === g.homeKey ? noShow : loss; }
    else { h.pts += win; a.pts += win; } // a draw is not possible in basketball, but keep the data sane
  });
  return [...rows.values()].sort((x, y) => y.pts - x.pts || (y.pf - y.pa) - (x.pf - x.pa) || y.pf - x.pf || x.name.localeCompare(y.name));
}

/* ---------- team detail with sub-tabs ---------- */
function viewTeamDetail(t) {
  const manage = canManageTeam(t.id);
  const season = seasonById(t.seasonId);
  const tabs = [["roster", "Roster"], ["schedule", "Schedule"], ["standings", "Standings"], ["stats", "Stats"]];
  const tab = tabs.some(([k]) => k === S.teamTab) ? S.teamTab : "roster";
  let html = `<button class="btn ghost sm" data-act="team-back">‹ Teams</button>
    <div class="spread" style="margin-top:6px"><div><h2>${esc(t.name)}</h2>
      <div class="muted small">${[t.category, t.gender, season?.name].filter(Boolean).map(esc).join(" · ")}</div></div>
      ${isAdmin() ? `<button class="btn sm" data-act="team-edit" data-id="${t.id}">Edit</button>` : ""}</div>
    <div class="seg" style="margin:12px 0">${tabs.map(([k, l]) => `<button data-act="team-tab" data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;

  if (tab === "roster") {
    const roster = rosterOf(t.id), coaches = coachesOf(t.id);
    const invites = S.invites.filter((i) => i.teamId === t.id && inviteIsOpen(i));
    html += `<div class="section-title spread"><span>Coaches (${coaches.length})</span>${isAdmin() ? `<button class="btn sm" data-act="coach-add" data-team="${t.id}">+ Add coach</button>` : ""}</div>
      ${coaches.length ? `<div class="list">${coaches.map((m) => memberItem(m)).join("")}</div>` : `<div class="card empty">No coach assigned.</div>`}
      <div class="section-title spread"><span>Roster (${roster.length})</span>${manage ? `<button class="btn primary sm" data-act="roster-add" data-team="${t.id}">+ Add player</button>` : ""}</div>
      ${roster.length ? `<div class="list">${roster.map((m) => memberItem(m, { showNumberFor: t.id })).join("")}</div>` : `<div class="card empty">No players on this team yet.</div>`}`;
    if (manage) {
      html += `<div class="section-title">Open invites (${invites.length})</div>`;
      html += invites.length ? inviteList(invites) : `<div class="card empty">No open invites. Open a player to invite them or their parents.</div>`;
    }
    if (isAdmin()) html += `<div style="margin-top:20px"><button class="btn danger block" data-act="team-delete" data-id="${t.id}">Delete team</button></div>`;
    return html;
  }
  if (tab === "schedule") {
    const now = Date.now();
    const evs = S.events.filter((e) => e.teamId === t.id);
    const up = evs.filter((e) => eventEnd(e).getTime() >= now).sort((a, b) => eventStart(a) - eventStart(b));
    const past = evs.filter((e) => eventEnd(e).getTime() < now).sort((a, b) => eventStart(b) - eventStart(a)).slice(0, 15);
    html += `<div class="section-title spread"><span>Upcoming (${up.length})</span>${manage ? `<button class="btn primary sm" data-act="event-new">+ New event</button>` : ""}</div>`;
    html += up.length ? `<div class="stack">${up.map((e) => eventCard(e, { showTeam: false })).join("")}</div>` : `<div class="card empty">No upcoming events.</div>`;
    html += `<div class="section-title">Past</div>`;
    html += past.length ? `<div class="stack">${past.map((e) => eventCard(e, { showTeam: false })).join("")}</div>` : `<div class="card empty">Nothing played yet.</div>`;
    return html;
  }
  if (tab === "standings") return html + standingsView(t);
  return html + teamStatsView(t);
}

function standingsView(t) {
  const list = tournamentsFor(t.id);
  if (!list.length) {
    return `<div class="card empty">No tournament for this team yet.${isAdmin() ? " Create one in <b>Admin → Tournaments</b>." : ""}</div>`;
  }
  const tr = byId(list, S.tournamentId) || list[0];
  S.tournamentId = tr.id;
  const rows = standingsRows(tr);
  const games = tournamentGames(tr);
  const manage = canManageTeam(t.id);
  let html = list.length > 1 ? `<select data-change="tournament" style="margin-bottom:12px">${list.map((x) => `<option value="${x.id}" ${x.id === tr.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : "";
  html += `<div class="spread"><h3>${esc(tr.name)}</h3>${isAdmin() ? `<button class="btn sm" data-act="tournament-edit" data-id="${tr.id}">Edit</button>` : ""}</div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>#</th><th class="l">Team</th><th>GP</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>+/-</th><th>PTS</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${r.isUs ? "us" : ""}">
        <td>${i + 1}</td><td class="l">${esc(r.name)}</td><td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td>
        <td>${r.pf}</td><td>${r.pa}</td><td>${r.pf - r.pa > 0 ? "+" : ""}${r.pf - r.pa}</td><td><b>${r.pts}</b></td></tr>`).join("")}</tbody>
    </table></div>
    <div class="small muted" style="margin-top:6px">${tr.pointsWin ?? 2} points per win · ${tr.pointsLoss ?? 1} per loss · ${tr.pointsForfeit ?? 0} for a no-show. Tie-break: point difference, then points scored.</div>

    <div class="section-title spread"><span>Games (${games.length})</span>${manage ? `<button class="btn primary sm" data-act="tgame-new" data-id="${tr.id}">+ Add result</button>` : ""}</div>`;
  html += games.length ? `<div class="list">${games.map((g) => `
    <div class="item ${g.fromEvent ? "tap" : ""}" ${g.fromEvent ? `data-act="event-open" data-id="${g.eventId}"` : ""}>
      <div class="main"><div class="title">${esc(entryName(tr, g.homeKey))} ${hasNum(g.homeScore) ? g.homeScore : "–"} – ${hasNum(g.awayScore) ? g.awayScore : "–"} ${esc(entryName(tr, g.awayKey))}</div>
        <div class="small muted">${esc(g.date || "")}${g.fromEvent ? " · our game" : ""}</div></div>
      ${manage && !g.fromEvent ? `<button class="btn sm" data-act="tgame-edit" data-id="${g.id}">Edit</button>` : ""}</div>`).join("")}</div>`
    : `<div class="card empty">No results yet. Our games appear here automatically once the result is entered.</div>`;
  if (manage) html += `<div class="notice" style="margin-top:12px">Add the results of the other teams' games too, otherwise the table is incomplete.</div>`;
  return html;
}

function tournamentModal(tr) {
  const teams = S.teams.filter((t) => isAdmin() || coachOf().includes(t.id));
  if (!teams.length) { toast("Create a team first.", "error"); return; }
  const entries = (tr?.entries || []).filter((e) => e.key !== US);
  const rows = (list) => list.map((e, i) => `<div class="row" data-entry="${i}"><input type="text" name="entry_${i}" value="${esc(e.name)}" placeholder="Team name" style="flex:1"></div>`).join("");
  openModal({
    title: tr ? "Edit tournament" : "New tournament",
    body: `<label class="f">Name<input type="text" name="name" value="${esc(tr?.name || "")}" placeholder="U16 League 2026/27" required></label>
      <label class="f">Our team<select name="teamId">${teams.map((t) => `<option value="${t.id}" ${tr?.teamId === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
      <div class="f" style="font-size:13px;color:var(--muted);font-weight:600">Other teams in the tournament</div>
      <div id="entry-list" class="stack" style="gap:8px">${rows(entries.length ? entries : [{ name: "" }, { name: "" }])}</div>
      <button type="button" class="btn sm" data-act="entry-add">+ Add team</button>
      <div class="grid2"><label class="f">Points per win<input type="number" name="pointsWin" min="0" max="5" value="${tr?.pointsWin ?? 2}"></label>
        <label class="f">Points per loss<input type="number" name="pointsLoss" min="0" max="5" value="${tr?.pointsLoss ?? 1}"></label></div>`,
    danger: tr ? `<button type="button" class="btn danger" data-act="tournament-delete" data-id="${tr.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      if (!d.name?.trim()) throw new Error("Name is required.");
      const names = Object.keys(d).filter((k) => k.startsWith("entry_")).map((k) => (d[k] || "").trim()).filter(Boolean);
      if (!names.length) throw new Error("Add at least one other team.");
      const old = tr?.entries || [];
      const list = [{ key: US, name: teamById(d.teamId)?.name || "Us" }];
      names.forEach((n, i) => {
        const prev = old.find((e) => e.name === n && e.key !== US);
        list.push({ key: prev?.key || `t${i}${Math.random().toString(36).slice(2, 6)}`, name: n });
      });
      const data = { name: d.name.trim(), teamId: d.teamId, seasonId: teamById(d.teamId)?.seasonId || "", entries: list,
        pointsWin: Number(d.pointsWin) || 0, pointsLoss: Number(d.pointsLoss) || 0, pointsForfeit: 0, updatedAt: serverTimestamp() };
      const batch = writeBatch(db);
      const ref = tr ? doc(db, "tournaments", tr.id) : doc(collection(db, "tournaments"));
      if (tr) batch.update(ref, data); else batch.set(ref, { ...data, createdBy: S.user.uid, createdAt: serverTimestamp() });
      log(batch, tr ? "Edited tournament" : "Created tournament", { label: data.name });
      await batch.commit();
      S.tournamentId = ref.id;
      toast("Tournament saved");
    }
  });
}
function tgameModal(tr, g) {

  });
}

      <tbody>${players.map((m) => { const st = rowStats(m); return `<tr><td class="l">${hasNum(m.number) ? `#${esc(m.number)} ` : ""}${esc(fullName(m))}</td>${stats.map((s) => `<td>${Number(st[s.k] || 0)}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`;

    <div class="table-wrap"><table class="tbl box"><thead><tr><th class="l">Player</th>${stats.map((s) => `<th title="${esc(s.n)}">${s.l}</th>`).join("")}</tr></thead>
      <tbody>${players.map((m) => { const st = rowStats(m); return `<tr><td class="l">${hasNum(m.number) ? `#${esc(m.number)} ` : ""}${esc(fullName(m))}</td>
        ${stats.map((s) => `<td>${s.k === "pts" && auto ? `<span class="calc" data-pts="${m.id}">${Number(st.pts || 0)}</span>`
          : `<input type="number" inputmode="numeric" min="0" max="199" name="st_${m.id}_${s.k}" value="${hasNum(st[s.k]) ? Number(st[s.k]) : ""}" data-member="${m.id}" data-stat="${s.k}">`}</td>`).join("")}</tr>`; }).join("")}</tbody></table></div>
    <div class="spread"><span class="small muted">${auto ? "Points are calculated from 2P, 3P and FT." : "Only the statistics switched on in Admin are shown."}</span>
      <button class="btn primary sm" type="submit">Save box score</button></div></form>`;
  return html;
}
function teamStatsView(t) {
  const stats = enabledStats();
  const rows = rosterOf(t.id).map((m) => {
    const list = Object.values(S.gameStats).filter((s) => s.memberId === m.id && s.teamId === t.id);
    const totals = {}; stats.forEach((s) => (totals[s.k] = 0));
    let gp = 0;
    list.forEach((s) => {
      const any = stats.some((d) => Number(s.stats?.[d.k] || 0) > 0);
      if (any) gp++;
      stats.forEach((d) => (totals[d.k] += Number(s.stats?.[d.k] || 0)));
    });
    return { m, gp, totals };
  }).filter((r) => r.gp > 0 || rosterOf(t.id).length <= 30);
  const avg = S.statMode === "avg";
  const val = (r, k) => avg ? (r.gp ? (r.totals[k] / r.gp).toFixed(1) : "0.0") : r.totals[k];
  const sorted = [...rows].sort((a, b) => (b.totals.pts || 0) - (a.totals.pts || 0));
  const leader = sorted[0];
  let html = `<div class="seg" style="margin-bottom:12px"><button data-act="stat-mode" data-mode="total" class="${avg ? "" : "on"}">Totals</button><button data-act="stat-mode" data-mode="avg" class="${avg ? "on" : ""}">Per game</button></div>`;
  if (!sorted.length || !sorted.some((r) => r.gp)) {
    return html + `<div class="card empty">No statistics yet. A coach enters them in the box score of each game.</div>`;
  }
  if (leader && leader.gp) html += `<div class="card stat" style="margin-bottom:12px"><div class="label">Top scorer</div><div class="big">${esc(fullName(leader.m))}</div>
    <div class="small muted">${leader.totals.pts} points in ${plural(leader.gp, "game")} · ${(leader.totals.pts / leader.gp).toFixed(1)} per game</div></div>`;
  html += `<div class="table-wrap"><table class="tbl"><thead><tr><th class="l">Player</th><th>GP</th><th title="Points per game">PPG</th>${stats.map((s) => `<th>${s.l}</th>`).join("")}</tr></thead>
    <tbody>${sorted.map((r) => `<tr><td class="l">${hasNum(r.m.number) ? `#${esc(r.m.number)} ` : ""}${esc(fullName(r.m))}</td><td>${r.gp}</td>
      <td><b>${r.gp ? (r.totals.pts / r.gp).toFixed(1) : "0.0"}</b></td>${stats.map((s) => `<td>${val(r, s.k)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return html;
}
function statSettingsModal() {
  const on = statsOn();
  openModal({
    title: "Statistics",
    body: `<p class="small muted" style="margin:0">Switch on only what you really track. You can add more later without losing anything.</p>
      <div class="card" style="padding:6px 12px">${STAT_DEFS.map((d) => `<label class="check" style="padding:8px 0"><input type="checkbox" name="st_${d.k}" ${on[d.k] ? "checked" : ""}> <b style="min-width:42px;display:inline-block">${d.l}</b> ${d.n}</label>`).join("")}</div>
      <p class="small muted" style="margin:0">With 2P, 3P and FT switched on, points are calculated automatically.</p>`,
    onSubmit: async (d) => {
      const enabled = {};
      STAT_DEFS.forEach((x) => { if (d[`st_${x.k}`]) enabled[x.k] = true; });
      if (!Object.keys(enabled).length) throw new Error("Keep at least one statistic on.");
      const batch = writeBatch(db);
      batch.set(doc(db, "settings", "stats"), { enabled, updatedAt: serverTimestamp(), updatedBy: S.user.uid }, { merge: true });
      log(batch, "Changed statistics settings", { label: Object.keys(enabled).join(", ") });
      await batch.commit();
      toast("Statistics updated");
    }
  });
}

Object.assign(FORMS, {
  async boxscore(d, form) {
    const e = eventById(d.eventId);
    if (!e || !canManageTeam(e.teamId)) throw new Error("You can't edit this box score.");
    const auto = autoPoints();
    const byMember = {};
    form.querySelectorAll("input[data-member]").forEach((el) => {
      const mid = el.dataset.member, k = el.dataset.stat;
      byMember[mid] = byMember[mid] || {};
      byMember[mid][k] = el.value === "" ? 0 : Number(el.value);
    });
    const batch = writeBatch(db);
    let n = 0;
    Object.entries(byMember).forEach(([mid, stats]) => {
      if (auto) stats.pts = 2 * (stats.fg2m || 0) + 3 * (stats.fg3m || 0) + (stats.ftm || 0);
      const before = statsOf(e.id, mid)?.stats || {};
      const changed = Object.keys(stats).some((k) => Number(before[k] || 0) !== Number(stats[k] || 0));
      if (!changed) return;
      n++;
      batch.set(doc(db, "gameStats", statKey(e.id, mid)), { eventId: e.id, memberId: mid, teamId: e.teamId, stats,
        updatedBy: S.user.uid, updatedByName: S.me.name || "", updatedAt: serverTimestamp() }, { merge: true });
    });
    if (!n) { toast("Nothing changed."); return; }
    log(batch, "Saved box score", { label: `${eventTitle(e)} · ${e.date} · ${plural(n, "player")}` });
    await batch.commit();
    toast(`Box score saved (${n})`);
  }
});

Object.assign(ACTIONS, {
  "team-tab": (el) => { S.teamTab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  "stat-mode": (el) => { S.statMode = el.dataset.mode; render(); },
  "tournament-new": () => tournamentModal(null),

const DEFAULT_VOLUNTEER_ROLES = ["Scorer", "Clock", "24 seconds", "Speaker", "Cafeteria"];
const volunteerRoles = () => (S.settings?.volunteerRoles?.length ? S.settings.volunteerRoles : DEFAULT_VOLUNTEER_ROLES);
const isHomeGame = (e) => e.type === "game" && e.homeAway !== "away";
const volunteersOf = (eid) => S.volunteers.filter((v) => v.eventId === eid);
function volunteerNeeds(e) {
  const needs = e.volunteerNeeds && Object.keys(e.volunteerNeeds).length ? e.volunteerNeeds : null;
  if (needs) return needs;
  const d = {}; volunteerRoles().forEach((r) => (d[r] = 1));
  return d;
}
function openSpots(e) {
  const needs = volunteerNeeds(e), taken = volunteersOf(e.id);
  return Object.entries(needs).reduce((n, [role, count]) => n + Math.max(0, Number(count) - taken.filter((v) => v.role === role).length), 0);
}
function volunteerSection(e, manage) {
  if (!isHomeGame(e) || e.status === "cancelled") return "";
  const needs = volunteerNeeds(e);
  const taken = volunteersOf(e.id);
  const past = isPast(e);
  let html = `<div class="section-title spread"><span>Volunteers (table officials)</span>${manage && !past ? `<button class="btn sm" data-act="vol-needs" data-id="${e.id}">Set needs</button>` : ""}</div>
    <div class="list">${Object.entries(needs).filter(([, n]) => Number(n) > 0).map(([role, count]) => {
      const list = taken.filter((v) => v.role === role);
      const mine = list.find((v) => v.uid === S.user.uid);
      const free = Math.max(0, Number(count) - list.length);
      return `<div class="item"><div class="main">
          <div class="title">${esc(role)} <span class="badge ${free ? "warn" : "ok"}">${list.length}/${count}</span></div>
          <div class="small muted">${list.length ? list.map((v) => esc(v.name)).join(", ") : "Nobody signed up yet"}</div></div>
        ${past ? "" : mine ? `<button class="btn sm danger" data-act="vol-leave" data-id="${mine.id}">Cancel</button>`
          : free ? `<button class="btn sm primary" data-act="vol-join" data-event="${e.id}" data-role="${esc(role)}">I'll do it</button>` : ""}</div>`;
    }).join("")}</div>`;
  if (manage && taken.length && !past) {
    html += `<div class="small muted" style="margin-top:6px">Tap a name to remove it:</div><div class="chips" style="margin-top:6px">${taken.map((v) => `<button class="chip as-btn" data-act="vol-remove" data-id="${v.id}">${esc(v.name)} ✕</button>`).join("")}</div>`;
  }
  return html;
}

/* ---------- club fees ---------- */
const feeById = (id) => byId(S.fees, id);
const feeKey = (feeId, memberId) => `${feeId}_${memberId}`;
function feeTeamIds(f) { return Object.keys(f.teamAmounts || {}).length ? Object.keys(f.teamAmounts) : (f.teamIds || []); }
function feeAmount(f, m) {
  const perTeam = f.teamAmounts?.[m?.playerTeamId];
  return Number(hasNum(perTeam) ? perTeam : (f.amount ?? 0));
}
function feeMembers(f) {
  const ids = feeTeamIds(f);
  return sortMembers(S.members.filter((m) => roles(m).player && (!ids.length || ids.includes(m.playerTeamId))));
}
function paymentFor(feeId, memberId) {
  const key = feeKey(feeId, memberId);
  return byId(S.feePayments, key) || S.myPayments[key] || null;
}
const feePaid = (feeId, memberId) => paymentFor(feeId, memberId)?.status === "paid";
function feeMoney(f, m) {
  const cur = f.currency || "DKK";
  if (m) return `${feeAmount(f, m)} ${cur}`;
  const vals = [...new Set(feeTeamIds(f).map((t) => Number(f.teamAmounts?.[t] ?? f.amount ?? 0)))].sort((a, b) => a - b);
  if (!vals.length) return `${f.amount ?? 0} ${cur}`;
  return vals.length === 1 ? `${vals[0]} ${cur}` : `${vals[0]}–${vals[vals.length - 1]} ${cur}`;
}
function feeTotals(f) {
  const members = feeMembers(f);
  let total = 0, collected = 0, paid = 0;
  members.forEach((m) => { const a = feeAmount(f, m); total += a; if (feePaid(f.id, m.id)) { collected += a; paid++; } });
  return { members, total, collected, paid };
}

// players and parents read only their own payment docs
let feeFetch = new Set();
async function loadMyPayments() {
  if (isStaff() || !isActive()) return;
  const mine = linkedMembers().filter((m) => roles(m).player);
  for (const f of S.fees) {
    for (const m of mine) {
      const ids = feeTeamIds(f);
      if (!ids.length || ids.includes(m.playerTeamId)) {
        const key = feeKey(f.id, m.id);
        if (feeFetch.has(key)) continue;
        feeFetch.add(key);
        try {
          const snap = await getDoc(doc(db, "feePayments", key));
          if (snap.exists()) { S.myPayments[key] = { id: key, ...snap.data() }; render(); }
        } catch (_) { /* not allowed / offline */ }
      }
    }
  }
}
function homeFeeSection() {
  const mine = linkedMembers().filter((m) => roles(m).player);
  if (!mine.length || !S.fees.length) return "";

  S.fees.forEach((f) => mine.forEach((m) => {
    const ids = feeTeamIds(f);

function viewFee(f) {

  const groups = ids.length ? ids : [...new Set(members.map((m) => m.playerTeamId))];

  });
  return html;
}

const PUB_DAYS = 200;
const PUB_SITE_FIELDS = ["tagline", "about", "email", "phone", "address", "facebook", "instagram", "heroImage"];
let pubTimer = null, pubRunning = false, pubAgain = false;
function schedulePublish() {
  if (!isStaff()) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(publishSync, 1200);
}
function canon(v) {
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === "object") { const o = {}; Object.keys(v).sort().forEach((k) => (o[k] = canon(v[k]))); return o; }
  return v === undefined ? null : v;
}
function sameData(cur, want) {
  if (!cur) return false;
  const { id, updatedAt, ...rest } = cur;
  const pick = {};
  Object.keys(want).forEach((k) => (pick[k] = rest[k]));
  return JSON.stringify(canon(pick)) === JSON.stringify(canon(want)) && Object.keys(rest).every((k) => k in want);
}
const siteUrl = (file) => new URL(file, location.href).href;
const currentSeasonId = () => activeSeason()?.id || "";

function publicEventData(e) {
  const t = teamById(e.teamId), v = venueById(e.venueId), game = e.type === "game";
  return {
    teamId: e.teamId || "", teamName: t?.name || "", category: t?.category || "", type: game ? "game" : "practice",
    title: game ? "" : (e.title || ""), opponent: game ? (e.opponent || "") : "", homeAway: game ? (e.homeAway === "away" ? "away" : "home") : "",
    date: e.date || "", startTime: e.startTime || "", endTime: e.endTime || "",
    venueName: v ? (v.name || "") : (e.location || ""), venueAddress: v ? (v.address || "") : "",
    status: e.status === "cancelled" ? "cancelled" : "scheduled",
    scoreFor: game && hasResult(e) ? Number(e.scoreFor) : null, scoreAgainst: game && hasResult(e) ? Number(e.scoreAgainst) : null
  };
}
function publicStandingData(tr) {
  const t = teamById(tr.teamId);
  const games = tournamentGames(tr).filter((g) => hasNum(g.homeScore) && hasNum(g.awayScore)).slice(0, 12)
    .map((g) => ({ date: g.date || "", home: entryName(tr, g.homeKey), away: entryName(tr, g.awayKey), homeScore: Number(g.homeScore), awayScore: Number(g.awayScore) }));
  return {
    teamId: tr.teamId || "", teamName: t?.name || "", current: !!t && t.seasonId === currentSeasonId(), name: tr.name || "",
    rows: standingsRows(tr).map((r) => ({ name: r.name, isUs: !!r.isUs, gp: r.gp, w: r.w, l: r.l, pf: r.pf, pa: r.pa, pts: r.pts })), games
  };
}
function publicNewsData(a) {
  const ids = a.teamIds || [];
  return { title: a.title || "", body: a.body || "", pinned: !!a.pinned, teamIds: ids,
    teamNames: ids.map((id) => teamById(id)?.name).filter(Boolean), createdAt: tsMillis(a.createdAt) };
}
function publicTeamData(t) {
  return { name: t.name || "", category: t.category || "", gender: t.gender || "", current: t.seasonId === currentSeasonId() };
}

// Compare what should be public with what is public, and queue only the differences.
function pubDiff(ops, coll, current, desired, mayDelete) {
  const cur = new Map(current.map((x) => [x.id, x]));
  desired.forEach((data, id) => { if (!sameData(cur.get(id), data)) ops.push(["set", coll, id, data]); });
  current.forEach((x) => { if (!desired.has(x.id) && mayDelete(x)) ops.push(["delete", coll, x.id]); });
}
async function publishSync() {
  if (!isStaff() || !S.user) return;
  if (pubRunning) { pubAgain = true; return; }
  const L = S.loaded, ops = [];
  if (L.events && L.teams && L.venues && L["public events"]) {
    const from = isoDaysAgo(PUB_DAYS - 2);
    const want = new Map();
    S.events.filter((e) => canManageTeam(e.teamId) && e.date >= from).forEach((e) => want.set(e.id, publicEventData(e)));
    pubDiff(ops, "public_events", S.pubEvents.filter((x) => (x.date || "") >= from), want, (x) => canManageTeam(x.teamId));
  }
  if (L.tournaments && L["tournament results"] && L.events && L.teams && L.seasons && L["public standings"]) {
    const want = new Map();
    S.tournaments.filter((tr) => canManageTeam(tr.teamId)).forEach((tr) => want.set(tr.id, publicStandingData(tr)));
    pubDiff(ops, "public_standings", S.pubStandings, want, (x) => canManageTeam(x.teamId));
  }
  if (L.announcements && L.teams && L["public news"]) {
    const list = S.announcements;
    const oldest = list.length >= 100 ? Math.min(...list.map((a) => tsMillis(a.createdAt) || Infinity)) : 0;
    const want = new Map();
    list.filter((a) => a.public === true && tsMillis(a.createdAt) > 0 && canEditNews(a)).forEach((a) => want.set(a.id, publicNewsData(a)));
    pubDiff(ops, "public_news", S.pubNews, want,
      (x) => (x.createdAt || 0) >= oldest && (isAdmin() || ((x.teamIds || []).length > 0 && (x.teamIds || []).every((t) => coachOf().includes(t)))));
  }
  if (isAdmin() && L.teams && L.seasons && L["public teams"]) {
    const want = new Map();
    S.teams.forEach((t) => want.set(t.id, publicTeamData(t)));
    pubDiff(ops, "public_teams", S.pubTeams, want, () => true);
  }
  if (isAdmin() && L["public site"] && S.settings) {
    const cur = S.pubSite || {};
    const want = { clubName: clubName(), appName: appName(), appUrl: siteUrl("./") };
    PUB_SITE_FIELDS.forEach((k) => (want[k] = cur[k] ?? ""));
    want.sponsors = cur.sponsors || [];
    if (!S.pubSite || !sameData(S.pubSite, want)) ops.push(["set", "public_site", "main", want]);
  }
  if (!ops.length) { if (S.pubStatus?.state !== "ok") { S.pubStatus = { state: "ok", at: Date.now(), n: 0 }; render(); } return; }
  pubRunning = true;
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const batch = writeBatch(db);
      ops.slice(i, i + 400).forEach(([kind, coll, id, data]) => {
        if (kind === "set") batch.set(doc(db, coll, id), { ...data, updatedAt: serverTimestamp() });
        else batch.delete(doc(db, coll, id));
      });
      await batch.commit();
    }
    S.pubStatus = { state: "ok", at: Date.now(), n: ops.length };
  } catch (err) {
    console.warn("[public website sync]", err.code, err.message);
    S.pubStatus = { state: "error", at: Date.now(), msg: errMsg(err) };
  } finally {
    pubRunning = false;
    render();
    if (pubAgain) { pubAgain = false; schedulePublish(); }
  }
}

function websiteSection() {
  const st = S.pubStatus;
  const status = !S.loaded["public site"] && (S.failedLists || []).some((n) => n.startsWith("public"))
    ? `<span class="badge bad">Rules missing</span>`
    : st?.state === "error" ? `<span class="badge bad">Sync failed</span>`
    : st?.state === "ok" ? `<span class="badge ok">Up to date</span>` : `<span class="badge">Checking…</span>`;
  const site = S.pubSite || {};
  return `<div class="section-title spread"><span>Public website</span><button class="btn sm" data-act="website-edit">Edit texts</button></div>
    <div class="card stack" style="gap:8px">
      <div class="spread"><div style="font-weight:600">Club website ${status}</div>
        <a class="btn sm" href="${esc(siteUrl("web.html"))}" target="_blank" rel="noopener">Open ›</a></div>
      <div class="small muted" style="word-break:break-all">${esc(siteUrl("web.html"))}</div>
      ${st?.state === "error" ? `<div class="small" style="color:var(--bad)">${esc(st.msg)}</div>` : ""}
      <div class="small muted">Shows practices, games, results and standings, plus announcements marked <b>Show on the public website</b>. Member names, attendance, stats and fees are never published. It updates automatically when a coach or admin has the app open.</div>
      <div class="small muted">${site.tagline ? `Tagline: ${esc(site.tagline)} · ` : ""}${plural((site.sponsors || []).length, "sponsor")}</div>
    </div>`;
}
function websiteModal() {
  const s = S.pubSite || {};
  const sponsors = (s.sponsors || []).map((x) => [x.name, x.url, x.logo].filter((v, i) => v || i === 0).join(" | ")).join("\n");
  openModal({
    title: "Public website",
    body: `<label class="f">Tagline<input type="text" name="tagline" maxlength="140" value="${esc(s.tagline || "")}" placeholder="We bring people together through basketball."></label>
      <label class="f">About the club<textarea name="about" rows="5" maxlength="3000">${esc(s.about || "")}</textarea></label>
      <div class="grid2"><label class="f">Contact email<input type="email" name="email" value="${esc(s.email || "")}"></label>
        <label class="f">Phone<input type="tel" name="phone" value="${esc(s.phone || "")}"></label></div>
      <label class="f">Address<input type="text" name="address" value="${esc(s.address || "")}"></label>
      <div class="grid2"><label class="f">Facebook link<input type="url" name="facebook" value="${esc(s.facebook || "")}" placeholder="https://facebook.com/…"></label>
        <label class="f">Instagram link<input type="url" name="instagram" value="${esc(s.instagram || "")}" placeholder="https://instagram.com/…"></label></div>
      <label class="f">Header photo (image link, optional)<input type="url" name="heroImage" value="${esc(s.heroImage || "")}" placeholder="https://…/team.jpg"></label>
      <label class="f">Sponsors (one per line: Name | website | logo link)<textarea name="sponsors" rows="4" placeholder="Vestjysk Bank | https://www.vestjyskbank.dk | https://…/logo.png">${esc(sponsors)}</textarea></label>
      <p class="small muted" style="margin:0">Everything on this form is public. Don't add private phone numbers or addresses.</p>`,
    onSubmit: async (d) => {
      const url = (v) => { v = String(v || "").trim(); if (v && !/^https:\/\//i.test(v)) throw new Error(`Links must start with https:// (${v.slice(0, 40)})`); return v; };
      const sponsors = String(d.sponsors || "").split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((p) => p[0])
        .slice(0, 30).map(([name, link, logo]) => ({ name: name.slice(0, 80), url: url(link), logo: url(logo) }));
      const data = { clubName: clubName(), appName: appName(), appUrl: siteUrl("./"),
        tagline: (d.tagline || "").trim(), about: (d.about || "").trim(), email: (d.email || "").trim(), phone: (d.phone || "").trim(),
        address: (d.address || "").trim(), facebook: url(d.facebook), instagram: url(d.instagram), heroImage: url(d.heroImage),
        sponsors, updatedAt: serverTimestamp() };
      const batch = writeBatch(db);
      batch.set(doc(db, "public_site", "main"), data);
      log(batch, "Edited public website", { label: data.tagline || clubName() });
      await batch.commit();
      toast("Website saved");
    }
  });
}
Object.assign(ACTIONS, { "website-edit": () => websiteModal() });

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el); } catch (err) { console.warn(err); toast(errMsg(err), "error"); }
});
document.addEventListener("input", (e) => {
  if (e.target.closest && e.target.closest("#app form[data-form]")) e.target.dataset.dirty = "1";
  if (e.target.dataset?.input === "member-search") { S.memberSearch = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset?.change === "season-filter") { S.seasonFilter = e.target.value; render(); }
  if (e.target.dataset?.change === "cal-team") { S.calTeam = e.target.value; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.modal) closeModal(); });

render();
</script>
