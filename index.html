        ${a?.respondedAt ? `<div class="small muted">Updated ${esc(fmtDateTime(a.respondedAt))} by ${esc(a.respondedByName || "")}</div>` : ""}</div>`;
    }).join("")}</div>`;
  }

  // past games: players/parents only see the result, coaches still validate attendance
  if (manage || !(e.type === "game" && isPast(e))) {
  html += `<div class="section-title spread"><span>${callUpPublished(e) ? "Called-up players" : "Players"} (${c.total})</span>
      ${manage && !cancelled ? `<button class="btn sm" data-act="validate-going" data-id="${e.id}">Going → Present</button>` : ""}</div>
    ${cancelled ? "" : `<div class="counts big-counts"><span class="c ok">✓ Going ${c.yes}</span><span class="c warn">~ Maybe ${c.maybe}</span><span class="c warn">⏱ Late ${c.late}</span><span class="c bad">✕ No ${c.no}</span><span class="c">? No reply ${c.none}</span></div>`}`;
  if (roster.length) {
    html += `<div class="list">${roster.map((m) => {
      const a = attOf(e.id, m.id);
      const ab = absenceFor(m.id, e.date);
      const r = a?.response ? RESPONSES[a.response] : null;
      return `<div class="item" style="align-items:flex-start">
        <div class="num ${hasNum(m.number) && m.playerTeamId === e.teamId ? "" : "none"}">${hasNum(m.number) && m.playerTeamId === e.teamId ? esc(m.number) : "–"}</div>
        <div class="main">
          <div class="spread"><div class="title">${esc(fullName(m))}</div>
            <span class="badge ${r ? r[1] : ""}">${r ? r[0] : "No reply"}</span></div>
          ${ab ? `<div class="small"><span class="badge warn">Unavailable · ${esc(ABSENCE_TYPES[ab.type] || "")}</span>${ab.note ? ` <span class="muted">${esc(ab.note)}</span>` : ""}</div>` : ""}
          ${a?.reason ? `<div class="small muted">“${esc(a.reason)}”</div>` : ""}
          ${a?.respondedAt ? `<div class="small muted">${esc(fmtDateTime(a.respondedAt))} · ${esc(a.respondedByName || "")}</div>` : ""}
          ${manage && !cancelled ? `<div class="edit-label"><span>Response</span><button type="button" class="linkbtn" data-act="respond-for" data-event="${e.id}" data-member="${m.id}">✎ ${a?.reason ? "Edit note" : "Add note"}</button></div>${respButtons(e, m, true)}` : ""}
          ${manage && !cancelled ? `<div class="edit-label"><span>Coach check</span></div><div class="valid">${Object.entries(VALIDATIONS).map(([k, [label, cls]]) =>
            `<button type="button" class="${a?.validated === k ? `on ${cls}` : ""}" data-act="validate" data-event="${e.id}" data-member="${m.id}" data-v="${k}">${label}</button>`).join("")}</div>`
            : a?.validated ? `<div class="small">Coach: <span class="badge ${VALIDATIONS[a.validated][1]}">${VALIDATIONS[a.validated][0]}</span></div>` : ""}
        </div></div>`;
    }).join("")}</div>`;
  } else html += `<div class="card empty">No players on ${esc(t?.name || "this team")} yet.</div>`;

  }

  if (e.type === "game" && hasStarted(e) && !cancelled && enabledStats().length) html += boxScoreSection(e, manage);
  html += volunteerSection(e, manage);
  html += refereeSection(e, manage);

  if (manage) {
    html += `<div class="section-title">Attendance log</div>`;
    html += S.eventLog.length ? `<div class="list">${S.eventLog.map((l) => {
      const m = memberById(l.memberId);
      const val = l.action === "validation" ? (VALIDATIONS[l.value]?.[0] || "cleared") : (RESPONSES[l.value]?.[0] || l.value);
      return `<div class="item"><div class="main"><div class="small"><b>${esc(l.byName || "?")}</b> ${l.action === "validation" ? "validated" : "answered"} <b>${esc(m ? fullName(m) : "?")}</b> → ${esc(val)}${l.reason ? ` · “${esc(l.reason)}”` : ""}</div>
        <div class="small muted">${esc(fmtDateTime(l.at))}</div></div></div>`;
    }).join("")}</div>` : `<div class="card empty">No changes yet.</div>`;
    html += `<div class="stack" style="margin-top:20px">
      <button class="btn block" data-act="event-cancel" data-id="${e.id}">${cancelled ? "Restore event" : "Cancel event"}</button>
      <button class="btn danger block" data-act="event-delete" data-id="${e.id}">Delete event</button>
      ${e.seriesId ? `<button class="btn danger block" data-act="event-delete-series" data-id="${e.id}">Delete this and following in series</button>` : ""}
    </div>`;
  }
  return html;
}

/* Home: next events + unavailability */
function homeCalendarSection() {
  const ids = myTeamIds();
  const next = visibleEvents("all").upcoming.filter(isMyEvent).slice(0, 4);
  const linked = linkedMembers().filter((m) => roles(m).player);
  const today = todayISO();
  const abs = S.absences.filter((a) => a.to >= today && (linked.some((m) => m.id === a.memberId) || (isStaff() && canManageTeam(a.teamId))))
    .sort((a, b) => a.from.localeCompare(b.from));
  let html = "";
  if (ids.length || next.length) {
    html += `<div class="section-title spread"><span>Next events</span><button class="btn ghost sm" data-act="tab" data-tab="calendar">See all ›</button></div>`;
    html += next.length ? `<div class="stack">${next.map((e) => eventCard(e)).join("")}</div>` : `<div class="card empty">No upcoming events.</div>`;
  }
  if (linked.length || isStaff()) {
    html += `<div class="section-title spread"><span>Unavailability</span><button class="btn sm" data-act="absence-new">+ Report</button></div>`;
    html += abs.length ? `<div class="list">${abs.map((a) => {
      const m = memberById(a.memberId);
      const canEdit = linked.some((x) => x.id === a.memberId) || canManageTeam(a.teamId);
      return `<div class="item"><div class="main"><div class="title">${esc(m ? fullName(m) : "?")} <span class="badge warn">${esc(ABSENCE_TYPES[a.type] || a.type)}</span></div>
        <div class="small muted">${esc(fmtDay(a.from, { day: "numeric", month: "short" }))} → ${esc(fmtDay(a.to, { day: "numeric", month: "short" }))}${a.note ? ` · ${esc(a.note)}` : ""}</div></div>
        ${canEdit ? `<button class="btn sm danger" data-act="absence-delete" data-id="${a.id}">Remove</button>` : ""}</div>`;
    }).join("")}</div>` : `<div class="card empty">Nobody marked unavailable.</div>`;
  }
  return html;
}

/* ---------- modals ---------- */
function eventModal(e) {
  const manageable = S.teams.filter((t) => canManageTeam(t.id) && (!activeSeason() || t.seasonId === activeSeason().id || t.id === e?.teamId));
  if (!manageable.length) { toast("Create a team first.", "error"); return; }
  const type = e?.type || "practice";
  const defTeam = e?.teamId || (S.calTeam !== "mine" && S.calTeam !== "all" && canManageTeam(S.calTeam) ? S.calTeam : manageable[0].id);
  const closeH = e ? Math.round((tsMillis(e.startsAt) - tsMillis(e.closesAt)) / 36e5) : 2;
  const defVenue = e ? e.venueId : (type === "game" ? homeVenue()?.id : null);
  openModal({
    title: e ? "Edit event" : "New event",
    body: `<div class="grid2">
        <label class="f">Type<select name="type" id="ev-type"><option value="practice" ${type === "practice" ? "selected" : ""}>Practice</option><option value="game" ${type === "game" ? "selected" : ""}>Game</option></select></label>
        <label class="f">Team<select name="teamId">${manageable.map((t) => `<option value="${t.id}" ${defTeam === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label></div>
      <div class="subsection" data-ev="game" ${type === "game" ? "" : "hidden"}>
        ${(() => { const trs = tournamentsFor(defTeam); return trs.length ? `<label class="f">Counts for<select name="tournamentId" id="ev-tournament"><option value="">No tournament</option>${trs.map((x) => `<option value="${x.id}" ${e?.tournamentId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="f">Opponent from the tournament<select name="opponentKey" id="ev-opp-key"><option value="">Type the name below</option>${trs.flatMap((x) => (x.entries || []).filter((en) => en.key !== US).map((en) => `<option value="${x.id}|${en.key}" ${e?.tournamentId === x.id && e?.opponentKey === en.key ? "selected" : ""}>${esc(en.name)}</option>`)).join("")}</select></label>` : ""; })()}
        <div class="grid2"><label class="f">Opponent<input type="text" name="opponent" id="ev-opponent" value="${esc(e?.opponent || "")}"></label>
          <label class="f">Home / away<select name="homeAway"><option value="home" ${e?.homeAway !== "away" ? "selected" : ""}>Home</option><option value="away" ${e?.homeAway === "away" ? "selected" : ""}>Away</option></select></label></div>
        <label class="f">Meet time<input type="time" name="meetTime" value="${esc(e?.meetTime || "")}"></label>
      </div>
      <div class="subsection" data-ev="practice" ${type === "practice" ? "" : "hidden"}>
        <label class="f">Title (optional)<input type="text" name="title" value="${esc(e?.title || "")}" placeholder="Practice"></label>
      </div>
      <label class="f">Date<input type="date" name="date" id="ev-date" value="${esc(e?.date || todayISO())}" required></label>
      <div class="grid2"><label class="f">Start<input type="time" name="startTime" value="${esc(e?.startTime || "18:00")}" required></label>
        <label class="f">End<input type="time" name="endTime" value="${esc(e?.endTime || "19:30")}"></label></div>
      <label class="f">Venue<select name="venueId" id="ev-venue">
        ${S.venues.map((v) => `<option value="${v.id}" ${defVenue === v.id ? "selected" : ""}>${esc(v.name)}${v.isHome ? " (Home)" : ""}</option>`).join("")}
        <option value="" ${e && !e.venueId ? "selected" : ""}>Other location…</option></select></label>
      <label class="f" data-ev="location" ${S.venues.length && (!e || e.venueId) ? "hidden" : ""}>Location<input type="text" name="location" value="${esc(e?.location || "")}" placeholder="Address or hall name"></label>
      <label class="f">Responses close<select name="closeHours">${CLOSE_OPTIONS.map(([h, l]) => `<option value="${h}" ${closeH === h ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">Notes<textarea name="notes" rows="2">${esc(e?.notes || "")}</textarea></label>
      ${e ? (e.seriesId ? `<label class="check"><input type="checkbox" name="applySeries"> Apply time, venue and notes to the following events in this series</label>` : "") : `
      <label class="check"><input type="checkbox" name="repeat" id="ev-repeat"> Repeat every week</label>
      <div class="subsection" data-ev="repeat" hidden>
        <div class="weekdays">${WEEKDAYS.map(([v, l]) => `<label class="wd"><input type="checkbox" name="wd_${v}"><span>${l}</span></label>`).join("")}</div>
        <label class="f">Until<input type="date" name="until" value="${esc(activeSeason()?.endDate || "")}"></label>
      </div>`}`,
    onSubmit: async (d) => {
      const team = teamById(d.teamId);
      if (!d.date || !d.startTime) throw new Error("Date and start time are required.");
      if (d.endTime && d.endTime <= d.startTime) throw new Error("End time must be after start time.");
      if (d.type === "game" && !d.opponent?.trim()) throw new Error("Enter the opponent.");
      if (!d.venueId && !d.location?.trim()) throw new Error("Choose a venue or enter a location.");
      const closeHours = Number(d.closeHours) || 0;
      let tournamentId = null, opponentKey = null;
      if (d.type === "game" && d.opponentKey) {
        const [tid, key] = String(d.opponentKey).split("|");
        tournamentId = tid; opponentKey = key;
      } else if (d.type === "game" && d.tournamentId) tournamentId = d.tournamentId;
      const base = {
        tournamentId, opponentKey,
        type: d.type, teamId: d.teamId, seasonId: team?.seasonId || "", title: d.type === "practice" ? (d.title || "").trim() : "",
        opponent: d.type === "game" ? d.opponent.trim() : "", homeAway: d.type === "game" ? d.homeAway : "", meetTime: d.type === "game" ? (d.meetTime || "") : "",
        startTime: d.startTime, endTime: d.endTime || "", venueId: d.venueId || null, location: d.venueId ? "" : (d.location || "").trim(),
        notes: (d.notes || "").trim(), updatedAt: serverTimestamp()
      };
      const timing = (date) => {
        const start = new Date(`${date}T${d.startTime}`);
        return { date, startsAt: Timestamp.fromDate(start), closesAt: Timestamp.fromMillis(start.getTime() - closeHours * 36e5) };
      };
      const batch = writeBatch(db);
      if (e) {
        batch.update(doc(db, "events", e.id), { ...base, ...timing(d.date) });
        if (e.date !== d.date || e.startTime !== d.startTime || (e.venueId || null) !== (d.venueId || null)) {
          queuePush(batch, { title: "Event changed",
            body: `${eventTitle({ ...e, ...base })} · now ${fmtDay(d.date, { weekday: "short", day: "numeric", month: "short" })} ${d.startTime}`,
            teamIds: [d.teamId], tag: `moved_${e.id}`, reason: "event-changed" });
        }
        let n = 1;
        if (d.applySeries && e.seriesId) {
          S.events.filter((x) => x.seriesId === e.seriesId && x.id !== e.id && x.date > e.date).forEach((x) => {
            const { type, teamId, seasonId, title, opponent, homeAway, meetTime, date, ...shared } = { ...base, date: x.date };
            batch.update(doc(db, "events", x.id), { ...shared, ...timing(x.date) });
            n++;
          });
        }
        log(batch, "Edited event", { label: `${eventTitle({ ...e, ...base })} · ${d.date}${n > 1 ? ` (+${n - 1} in series)` : ""}` });
        await batch.commit();
        toast(n > 1 ? `${n} events updated` : "Event saved");
        return;
      }
      let dates = [d.date];
      let seriesId = null;
      if (d.repeat) {
        const days = WEEKDAYS.map(([v]) => v).filter((v) => d[`wd_${v}`]);
        if (!days.length) days.push(String(new Date(`${d.date}T12:00`).getDay()));
        if (!d.until || d.until < d.date) throw new Error("Choose an “Until” date after the start date.");
        dates = [];
        const cur = new Date(`${d.date}T12:00`), end = new Date(`${d.until}T12:00`);
        while (cur <= end) { if (days.includes(String(cur.getDay()))) dates.push(localISO(cur)); cur.setDate(cur.getDate() + 1); }
        if (!dates.length) throw new Error("No dates match those weekdays.");
        if (dates.length > 200) throw new Error("That is more than 200 events. Choose an earlier “Until” date.");
        seriesId = doc(collection(db, "events")).id;
      }
      dates.forEach((date) => {
        batch.set(doc(collection(db, "events")), { ...base, ...timing(date), seriesId, status: "scheduled",
          createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp() });
      });
      log(batch, dates.length > 1 ? "Created recurring events" : "Created event", { label: `${eventTitle(base)} · ${team?.name} · ${dates[0]}${dates.length > 1 ? ` (${dates.length} events)` : ""}` });
      await batch.commit();
      toast(dates.length > 1 ? `${dates.length} events created` : "Event created");
    }
  });
  const root = $("#modal-root");
  const show = (k, on) => { const el = root.querySelector(`[data-ev="${k}"]`); if (el) el.hidden = !on; };
  $("#ev-type")?.addEventListener("change", (ev) => {
    show("game", ev.target.value === "game"); show("practice", ev.target.value === "practice");
    // new games start at the home venue (can still be changed)
    if (!e && ev.target.value === "game" && homeVenue()) { $("#ev-venue").value = homeVenue().id; show("location", false); }
  });
  $("#ev-venue")?.addEventListener("change", (ev) => show("location", !ev.target.value));
  $("#ev-opp-key")?.addEventListener("change", (ev) => {
    const label = ev.target.selectedOptions[0]?.textContent || "";
    const [tid] = String(ev.target.value || "").split("|");
    if (ev.target.value) { $("#ev-opponent").value = label; const t = $("#ev-tournament"); if (t) t.value = tid; }
  });
  $("#ev-repeat")?.addEventListener("change", (ev) => {
    show("repeat", ev.target.checked);
    if (ev.target.checked) {
      const wd = String(new Date(`${$("#ev-date").value}T12:00`).getDay());
      const any = root.querySelectorAll('.weekdays input:checked').length;
      if (!any) { const box = root.querySelector(`input[name="wd_${wd}"]`); if (box) box.checked = true; }
    }
  });
}

async function saveResponse(e, m, response, reason = "") {
  const batch = writeBatch(db);
  batch.set(doc(db, "attendance", attKey(e.id, m.id)), {
    eventId: e.id, memberId: m.id, teamId: e.teamId,
    response, reason: reason.trim(), respondedBy: S.user.uid, respondedByName: S.me.name || "", respondedAt: serverTimestamp()
  }, { merge: true });

const CALLUP_MAX = 12;

function callUpModal(e) {

  const roster = rosterOf(e.teamId);

        <span class="small muted">${[m.pos1, m.pos2].filter(Boolean).join(" / ")}${m.playerTeamId !== e.teamId && teamById(m.playerTeamId) ? ` · ${esc(teamById(m.playerTeamId).name)}` : ""}</span></span>
      ${ab ? `<span class="badge warn">Unavailable</span>` : r ? `<span class="badge ${r[1]}">${r[0]}</span>` : off ? `<span class="badge">No answer</span>` : ""}</label>`;
  };
  openModal({
    title: `Call-up · ${eventTitle(e)}`,
    body: `<div class="small muted">${esc(t?.name || "")} · ${esc(fmtDay(e.date, { weekday: "short", day: "numeric", month: "short" }))} ${esc(e.startTime || "")}</div>
      <div class="spread"><b id="cu-count">${selected.size} selected</b><span class="small muted">Max ${CALLUP_MAX} players</span></div>
      <p class="small muted" style="margin:0">Showing players who answered <b>Going</b> or <b>Maybe</b>.${hidden ? ` ${plural(hidden, "player")} hidden (no answer / late / can't go).` : ""}</p>
      <div class="list">${teamPlayers.length ? teamPlayers.map(row).join("") : `<div class="item muted">${roster.length ? "Nobody has answered Going or Maybe yet." : `No players on ${esc(t?.name || "this team")}.`}</div>`}</div>
      ${others.length ? `<details class="others"><summary>Players from other teams (${others.length})</summary><div class="list" style="margin-top:8px">${others.map(row).join("")}</div></details>` : ""}
      <label class="check"><input type="checkbox" name="publish" ${callUpPublished(e) ? "checked" : ""}> Publish now (players and parents can see it)</label>`,
    submitLabel: "Save call-up",
    onSubmit: async (d) => {
      const ids = S.members.filter((m) => d[`cu_${m.id}`]).map((m) => m.id);
      if (d.publish && !ids.length) throw new Error("Select at least one player before publishing.");
      if (ids.length > CALLUP_MAX && !window.confirm(`${ids.length} players selected (max ${CALLUP_MAX}). Save anyway?`)) return false;
      await saveCallUp(e, ids, !!d.publish);
      toast(d.publish ? "Call-up published" : "Call-up saved as draft");
    }
  });
  const root = $("#modal-root");
  root.querySelectorAll('input[name^="cu_"]').forEach((cb) => cb.addEventListener("change", () => {
    const n = root.querySelectorAll('input[name^="cu_"]:checked').length;
    const el = $("#cu-count"); if (el) { el.textContent = `${n} selected`; el.classList.toggle("bad-text", n > CALLUP_MAX); }
  }));
}
async function saveCallUp(e, ids, publish) {
  const batch = writeBatch(db);
  const data = { callUpIds: ids, callUpPublished: publish, callUpBy: S.user.uid, callUpByName: S.me.name || "", callUpUpdatedAt: serverTimestamp(), updatedAt: serverTimestamp() };
  if (publish && !callUpPublished(e)) data.callUpPublishedAt = serverTimestamp();

/* =========================================================
   PLAYING TIME / ROTATION (v-0.22) — coaches only
   events.rotation = { periods: 4|2, len: seconds per period,
     q: [ { PG: { c: [cut seconds from period start], p: [memberId | ""] }, SG…, C } ] }
   p has one more entry than c: p[i] plays from c[i-1] (or 0) until c[i] (or len).
   ========================================================= */
const ROT_POS = ["PG", "SG", "SF", "PF", "C"];
const ROT_SNAP = 15;
const ROT_COLORS = ["#ef7a4f", "#5b9eea", "#7bb86f", "#9b4fb8", "#d94d77", "#4fa39a", "#f2a93b", "#5f6abf", "#f5c84c", "#3fa7c9", "#a0785a", "#8ab83c", "#c0587e", "#2e8b57", "#e26d5c", "#7f8c9d"];
let rotDrag = null;
function fmtClock(sec) { sec = Math.max(0, Math.round(Number(sec) || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function parseClock(v) {
  const m = String(v || "").trim().match(/^(\d{1,2})(?:[:.,](\d{1,2}))?$/);
  if (!m || Number(m[2] || 0) > 59) return NaN;
  return Number(m[1]) * 60 + Number(m[2] || 0);
}
function textOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.72 ? "#1d2330" : "#ffffff";
}
const perLabel = (r, q) => r.periods === 2 ? `${q === 0 ? "1st" : "2nd"} Half` : `${["1st", "2nd", "3rd", "4th"][q]} Quarter`;
const perShort = (r, q) => r.periods === 2 ? `H${q + 1}` : `Q${q + 1}`;
function mergeRow(row) {
  const c = [], p = [row.p[0] || ""];
  row.c.forEach((t, i) => { const id = row.p[i + 1] || ""; if (id === p[p.length - 1]) return; c.push(t); p.push(id); });
  return { c, p };
}
function normRot(src) {
  const periods = [2, 4].includes(Number(src?.periods)) ? Number(src.periods) : 4;
  const len = Math.min(1200, Math.max(120, Math.round(Number(src?.len) || 600)));
  const q = [];
  for (let k = 0; k < periods; k++) {
    const Q = (Array.isArray(src?.q) ? src.q[k] : null) || {}, o = {};
    ROT_POS.forEach((pos) => {
      const row = Q[pos] || {};
      const rawC = Array.isArray(row.c) ? row.c.map(Number) : [], rawP = Array.isArray(row.p) ? row.p : [];
      const c = [], p = [typeof rawP[0] === "string" ? rawP[0] : ""];
      rawC.forEach((t, i) => {
        t = Math.round(t);
        if (!Number.isFinite(t) || t <= 0 || t >= len || (c.length && t <= c[c.length - 1])) return;
        c.push(t); p.push(typeof rawP[i + 1] === "string" ? rawP[i + 1] : "");
      });
      o[pos] = mergeRow({ c, p });
    });
    q.push(o);
  }
  return { periods, len, q };
}
function rotSegs(row, len) { const b = [0, ...row.c, len]; return row.p.map((id, i) => ({ i, id, s: b[i], e: b[i + 1] })); }
function rotPool(e, r) {
  let ids = (e.callUpIds || []).filter((id) => memberById(id));
  if (!ids.length) ids = rosterOf(e.teamId).filter((m) => ["yes", "maybe", "late"].includes(attOf(e.id, m.id)?.response)).map((m) => m.id);
  if (!ids.length) ids = rosterOf(e.teamId).map((m) => m.id);
  const list = ids.map(memberById).filter(Boolean).sort(callUpOrder(e)).map((m) => m.id);
  const extra = [];
  if (r) r.q.forEach((Q) => ROT_POS.forEach((pos) => Q[pos].p.forEach((id) => { if (id && !list.includes(id) && !extra.includes(id)) extra.push(id); })));
  const all = [...list, ...extra];
  const firsts = {};
  all.forEach((id) => { const f = memberById(id)?.firstName || "?"; firsts[f] = (firsts[f] || 0) + 1; });
  const nameOf = (id) => {
    if (!id) return "";
    const m = memberById(id); if (!m) return "Removed player";
    return firsts[m.firstName] > 1 && m.lastName ? `${m.firstName} ${m.lastName[0]}.` : (m.firstName || fullName(m));
  };
  const colorOf = (id) => ROT_COLORS[Math.max(0, all.indexOf(id)) % ROT_COLORS.length];
  return { list, extra, all, nameOf, colorOf };
}
function newRotation(e) {

      onSubmit: async (d) => {

        if (!(min >= 2 && min <= 20)) throw new Error("Minutes must be between 2 and 20.");
        if (periods === r.periods && min * 60 === r.len) return;

  "rot-delete": () => confirmRun("Delete the playing-time plan for this game?", async () => {
    const e = eventById(S.rot.eventId), batch = writeBatch(db);

// drag the line between two boxes to move a substitution
document.addEventListener("pointerdown", (ev) => {
  const h = ev.target.closest && ev.target.closest(".rh");
  if (!h || !S.rot) return;
  const q = Number(h.dataset.q), pos = h.dataset.pos, i = Number(h.dataset.i), r = S.rot.d, row = r.q[q][pos];
  const lo = (i > 0 ? row.c[i - 1] : 0) + ROT_SNAP, hi = (i < row.c.length - 1 ? row.c[i + 1] : r.len) - ROT_SNAP;
  rotDrag = { q, pos, i, lo, hi, h, rect: h.parentElement.getBoundingClientRect(), t: row.c[i], t0: row.c[i], last: Date.now(),
    a: document.getElementById(`rs-${q}-${pos}-${i}`), b: document.getElementById(`rs-${q}-${pos}-${i + 1}`) };
  h.classList.add("on");
  try { h.setPointerCapture(ev.pointerId); } catch (_) {}
  ev.preventDefault();
});
document.addEventListener("pointermove", (ev) => {
  const D = rotDrag; if (!D) return;
  const L = S.rot.d.len;
  let t = ((ev.clientX - D.rect.left) / D.rect.width) * L;
  t = Math.round(t / ROT_SNAP) * ROT_SNAP;
  t = Math.max(D.lo, Math.min(D.hi, t));
  D.last = Date.now();
  if (t === D.t) return;
  D.t = t;
  const row = S.rot.d.q[D.q][D.pos], start = D.i > 0 ? row.c[D.i - 1] : 0, end = D.i < row.c.length - 1 ? row.c[D.i + 1] : L;
  D.h.style.left = `${(t / L) * 100}%`;
  D.h.querySelector(".tip").textContent = fmtClock(L - t);
  if (D.a) D.a.style.width = `${((t - start) / L) * 100}%`;
  if (D.b) { D.b.style.left = `${(t / L) * 100}%`; D.b.style.width = `${((end - t) / L) * 100}%`; }
});
function rotDragEnd() {
  const D = rotDrag; if (!D) return;
  rotDrag = null;
  if (D.t !== D.t0 && S.rot) { rotPush(); S.rot.d.q[D.q][D.pos].c[D.i] = D.t; }
  render();
}
document.addEventListener("pointerup", rotDragEnd);
document.addEventListener("pointercancel", rotDragEnd);

   TOURNAMENT & STANDINGS (v-0.4) + STATISTICS (v-0.5)
   ========================================================= */
const US = "us";
const STAT_DEFS = [
  { k: "pts", l: "PTS", n: "Points" },
  { k: "pf", l: "PF", n: "Fouls" },
  { k: "fg2m", l: "2P", n: "2-pointers made" },
  { k: "fg3m", l: "3P", n: "3-pointers made" },
  { k: "ftm", l: "FT", n: "Free throws made" },
  { k: "reb", l: "REB", n: "Rebounds" },
  { k: "ast", l: "AST", n: "Assists" },
  { k: "stl", l: "STL", n: "Steals" },
  { k: "blk", l: "BLK", n: "Blocks" },
  { k: "tov", l: "TO", n: "Turnovers" },
  { k: "min", l: "MIN", n: "Minutes" }
];
const statsOn = () => S.statSettings?.enabled || { pts: true, pf: true };
const enabledStats = () => STAT_DEFS.filter((d) => statsOn()[d.k]);
const autoPoints = () => ["fg2m", "fg3m", "ftm"].every((k) => statsOn()[k]);
const statKey = (eid, mid) => `${eid}_${mid}`;
const statsOf = (eid, mid) => S.gameStats[statKey(eid, mid)];

const tournamentById = (id) => byId(S.tournaments, id);
const tournamentsFor = (teamId) => S.tournaments.filter((x) => x.teamId === teamId);
function entryName(tr, key) {
  const e = (tr.entries || []).find((x) => x.key === key);
  return e ? e.name : key === US ? teamById(tr.teamId)?.name || "Us" : "?";
}
function tournamentGames(tr) {
  const list = S.tournamentGames.filter((g) => g.tournamentId === tr.id).map((g) => ({ ...g, fromEvent: false }));
  S.events.filter((e) => e.tournamentId === tr.id && e.type === "game" && hasResult(e) && e.status !== "cancelled").forEach((e) => {
    const away = e.homeAway === "away";
    list.push({
      id: `ev_${e.id}`, tournamentId: tr.id, date: e.date, fromEvent: true, eventId: e.id,
      homeKey: away ? e.opponentKey || "?" : US, awayKey: away ? US : e.opponentKey || "?",
      homeScore: away ? e.scoreAgainst : e.scoreFor, awayScore: away ? e.scoreFor : e.scoreAgainst
    });
  });
  return list.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
}
function standingsRows(tr) {
  const rows = new Map();
  (tr.entries || []).forEach((e) => rows.set(e.key, { key: e.key, name: e.name, isUs: e.key === US, gp: 0, w: 0, l: 0, pf: 0, pa: 0, pts: 0 }));
  const win = Number(tr.pointsWin ?? 2), loss = Number(tr.pointsLoss ?? 1), noShow = Number(tr.pointsForfeit ?? 0);
  tournamentGames(tr).forEach((g) => {
    if (!hasNum(g.homeScore) || !hasNum(g.awayScore)) return;
    const h = rows.get(g.homeKey), a = rows.get(g.awayKey);
    if (!h || !a) return;
    const hs = Number(g.homeScore), as = Number(g.awayScore);
    h.gp++; a.gp++; h.pf += hs; h.pa += as; a.pf += as; a.pa += hs;
    if (hs > as) { h.w++; a.l++; h.pts += win; a.pts += g.forfeitBy === g.awayKey ? noShow : loss; }
    else if (as > hs) { a.w++; h.l++; a.pts += win; h.pts += g.forfeitBy === g.homeKey ? noShow : loss; }
    else { h.pts += win; a.pts += win; } // a draw is not possible in basketball, but keep the data sane
  });
  return [...rows.values()].sort((x, y) => y.pts - x.pts || (y.pf - y.pa) - (x.pf - x.pa) || y.pf - x.pf || x.name.localeCompare(y.name));
}

function teamStatsView(t) {
  const stats = enabledStats();
  const rows = rosterOf(t.id).map((m) => {
    const list = Object.values(S.gameStats).filter((s) => s.memberId === m.id && s.teamId === t.id);
    const totals = {}; stats.forEach((s) => (totals[s.k] = 0));
    let gp = 0;
    list.forEach((s) => {
      const any = stats.some((d) => Number(s.stats?.[d.k] || 0) > 0);
      if (any) gp++;
      stats.forEach((d) => (totals[d.k] += Number(s.stats?.[d.k] || 0)));
    });
    return { m, gp, totals };
  }).filter((r) => r.gp > 0 || rosterOf(t.id).length <= 30);
  const avg = S.statMode === "avg";
  const val = (r, k) => avg ? (r.gp ? (r.totals[k] / r.gp).toFixed(1) : "0.0") : r.totals[k];
  const sorted = [...rows].sort((a, b) => (b.totals.pts || 0) - (a.totals.pts || 0));
  const leader = sorted[0];
  let html = `<div class="seg" style="margin-bottom:12px"><button data-act="stat-mode" data-mode="total" class="${avg ? "" : "on"}">Totals</button><button data-act="stat-mode" data-mode="avg" class="${avg ? "on" : ""}">Per game</button></div>`;
  if (!sorted.length || !sorted.some((r) => r.gp)) {
    return html + `<div class="card empty">No statistics yet. A coach enters them in the box score of each game.</div>`;
  }
  if (leader && leader.gp) html += `<div class="card stat" style="margin-bottom:12px"><div class="label">Top scorer</div><div class="big">${esc(fullName(leader.m))}</div>
    <div class="small muted">${leader.totals.pts} points in ${plural(leader.gp, "game")} · ${(leader.totals.pts / leader.gp).toFixed(1)} per game</div></div>`;
  html += `<div class="table-wrap"><table class="tbl"><thead><tr><th class="l">Player</th><th>GP</th><th title="Points per game">PPG</th>${stats.map((s) => `<th>${s.l}</th>`).join("")}</tr></thead>
    <tbody>${sorted.map((r) => `<tr><td class="l">${hasNum(r.m.number) ? `#${esc(r.m.number)} ` : ""}${esc(fullName(r.m))}</td><td>${r.gp}</td>
      <td><b>${r.gp ? (r.totals.pts / r.gp).toFixed(1) : "0.0"}</b></td>${stats.map((s) => `<td>${val(r, s.k)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return html;
}

function volunteerNeeds(e) {
  const needs = e.volunteerNeeds && Object.keys(e.volunteerNeeds).length ? e.volunteerNeeds : null;
  if (needs) return needs;
  const d = {}; volunteerRoles().forEach((r) => (d[r] = 1));

}

/* ---------- club fees ---------- */
const feeById = (id) => byId(S.fees, id);
const feeKey = (feeId, memberId) => `${feeId}_${memberId}`;
function feeTeamIds(f) { return Object.keys(f.teamAmounts || {}).length ? Object.keys(f.teamAmounts) : (f.teamIds || []); }
function feeAmount(f, m) {
  const perTeam = f.teamAmounts?.[m?.playerTeamId];
  return Number(hasNum(perTeam) ? perTeam : (f.amount ?? 0));
}
function feeMembers(f) {
  const ids = feeTeamIds(f);
  return sortMembers(S.members.filter((m) => roles(m).player && (!ids.length || ids.includes(m.playerTeamId))));
}
function paymentFor(feeId, memberId) {
  const key = feeKey(feeId, memberId);
  return byId(S.feePayments, key) || S.myPayments[key] || null;
}
const feePaid = (feeId, memberId) => paymentFor(feeId, memberId)?.status === "paid";
function feeMoney(f, m) {
  const cur = f.currency || "DKK";
  if (m) return `${feeAmount(f, m)} ${cur}`;
  const vals = [...new Set(feeTeamIds(f).map((t) => Number(f.teamAmounts?.[t] ?? f.amount ?? 0)))].sort((a, b) => a - b);
  if (!vals.length) return `${f.amount ?? 0} ${cur}`;
  return vals.length === 1 ? `${vals[0]} ${cur}` : `${vals[0]}–${vals[vals.length - 1]} ${cur}`;
}
function feeTotals(f) {
  const members = feeMembers(f);
  let total = 0, collected = 0, paid = 0;
  members.forEach((m) => { const a = feeAmount(f, m); total += a; if (feePaid(f.id, m.id)) { collected += a; paid++; } });
  return { members, total, collected, paid };
}

// players and parents read only their own payment docs
let feeFetch = new Set();
async function loadMyPayments() {
  if (isStaff() || !isActive()) return;
  const mine = linkedMembers().filter((m) => roles(m).player);
  for (const f of S.fees) {
    for (const m of mine) {
      const ids = feeTeamIds(f);
      if (!ids.length || ids.includes(m.playerTeamId)) {
        const key = feeKey(f.id, m.id);
        if (feeFetch.has(key)) continue;
        feeFetch.add(key);
        try {
          const snap = await getDoc(doc(db, "feePayments", key));
          if (snap.exists()) { S.myPayments[key] = { id: key, ...snap.data() }; render(); }
        } catch (_) { /* not allowed / offline */ }
      }
    }
  }
}
function homeFeeSection() {
  const mine = linkedMembers().filter((m) => roles(m).player);
  if (!mine.length || !S.fees.length) return "";
  const rows = [];
  S.fees.forEach((f) => mine.forEach((m) => {
    const ids = feeTeamIds(f);
    if (ids.length && !ids.includes(m.playerTeamId)) return;
    rows.push({ f, m, paid: feePaid(f.id, m.id) });
  }));
  if (!rows.length) return "";
  const pending = rows.filter((r) => !r.paid);

function feeModal(f) {

  const current = feeTeamIds(f || {});
  const teams = S.teams.filter((t) => !season || t.seasonId === season.id || current.includes(t.id));
  openModal({
    title: f ? "Edit fee" : "New fee",

function viewFee(f) {

  const ids = feeTeamIds(f);
  let html = `<button class="btn ghost sm" data-act="fee-back">‹ Fees</button>
    <div class="spread" style="margin-top:6px"><div><h2>${esc(f.name)}</h2>
      <div class="muted small">${esc(feeMoney(f))}${f.dueDate ? ` · due ${esc(fmtDay(f.dueDate, { day: "numeric", month: "short", year: "numeric" }))}` : ""}</div></div>

  const groups = ids.length ? ids : [...new Set(members.map((m) => m.playerTeamId))];
  groups.forEach((tid) => {

    const amount = Number(f.teamAmounts?.[tid] ?? f.amount ?? 0);
    html += `<div class="section-title spread"><span>${esc(teamById(tid)?.name || "No team")}</span><span class="small muted">${amount} ${esc(f.currency || "DKK")} · ${list.filter((m) => feePaid(f.id, m.id)).length}/${list.length}</span></div>`;
    html += list.length ? `<div class="list">${list.map((m) => {
      const p = paymentFor(f.id, m.id);

      return `<div class="item"><div class="main"><div class="title">${esc(fullName(m))}</div>
        <div class="small muted">${amount} ${esc(f.currency || "DKK")}${isPaid && p?.paidAt ? ` · paid ${esc(fmtDateTime(p.paidAt))}${p.markedByName ? ` by ${esc(p.markedByName)}` : ""}` : ""}</div></div>

  });
  return html;
}

// draw the viewer at step i, moving towards step i+1 by t (0..1)
function applyFrame(p, i, t) {

  if (!a) return false;

  const ball = document.getElementById("pv-ball");

        : lerpP(ballAt(pos.o[a.ball]), ballAt(pos.o[b.ball]), ease(Math.min(1, t * 1.15)));

    else if (a.ball >= 0) q = t < 0.5 ? ballAt(pos.o[a.ball]) : null;

  if (anim.hold > 0) { anim.hold -= dt; anim.raf = requestAnimationFrame(tickAnim); return; }
  anim.t += dt / STEP_MS;

    anim.t = 0; anim.hold = HOLD_MS;
    const lbl = document.getElementById("pv-label"); if (lbl) lbl.textContent = `Step ${S.playView.step + 1} / ${steps.length}`;
    const note = document.getElementById("pv-note"), n = steps[S.playView.step]?.note || "";

async function savePlay() {
  const pe = S.playEdit;
  if (!pe.name.trim()) throw new Error("Give the play a name.");
  if (!canManageTeam(pe.teamId)) throw new Error("You can't edit this team's plays.");
  const url = pe.videoUrl.trim();
  if (url && !/^https:\/\//i.test(url)) throw new Error("The video link must start with https://");
  const data = { teamId: pe.teamId, name: pe.name.trim(), category: pe.category, description: pe.description.trim(), videoUrl: url,
    steps: pe.steps.map((s) => {
      const acts = {};
      Object.entries(s.acts || {}).forEach(([k, v]) => { if (/^o[0-4]$/.test(k) && ["dribble", "screen"].includes(v)) acts[k] = v; });
      const curves = {};
      Object.entries(s.curves || {}).forEach(([k, v]) => { const n = Math.round(Math.max(-1, Math.min(1, Number(v) || 0)) * 100) / 100; if (/^[od][0-4]$/.test(k) && n) curves[k] = n; });
      const marks = (s.marks || []).filter((m) => MARK_TYPES.includes(m.t) && (m.p || []).length > 1).slice(0, 40)
        .map((m) => ({ t: m.t, team: m.team === "d" ? "d" : "o", p: m.p.slice(0, 60).map((q) => ({ x: Math.round(q.x * 2) / 2, y: Math.round(q.y * 2) / 2 })) }));
      return { o: s.o.map(clampPos), d: s.d.map(clampPos), ball: s.ball ?? -1, note: (s.note || "").trim(), acts, curves, marks, bx: s.bx === "handoff" ? "handoff" : "pass", shot: !!s.shot };
    }),
    updatedAt: serverTimestamp(), updatedBy: S.user.uid };
  const batch = writeBatch(db);
  const ref = pe.id ? doc(db, "plays", pe.id) : doc(collection(db, "plays"));
  if (pe.id) batch.update(ref, data);
  else batch.set(ref, { ...data, createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp() });
  log(batch, pe.id ? "Edited play" : "Created play", { label: `${data.name} · ${teamById(pe.teamId)?.name || ""}` });
  await batch.commit();
  S.playEdit = null;
  S.playView = { id: ref.id, teamId: data.teamId, step: 0, side: "both", pending: true };
  setTimeout(() => { if (S.playView?.pending) { S.playView = null; render(); } }, 8000);
  toast("Play saved");
  render();
}
function playCopyModal(p) {
  const teams = S.teams.filter((t) => canManageTeam(t.id) && t.id !== p.teamId && (!activeSeason() || t.seasonId === activeSeason().id));
  if (!teams.length) { toast("You have no other team to copy it to.", "error"); return; }
  openModal({
    title: "Copy play",
    body: `<label class="f">Copy “${esc(p.name)}” to<select name="teamId">${teams.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label>`,
    submitLabel: "Copy",
    onSubmit: async (d) => {
      const { id, createdAt, updatedAt, ...rest } = p;
      const batch = writeBatch(db);
      batch.set(doc(collection(db, "plays")), { ...rest, teamId: d.teamId, createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedBy: S.user.uid });
      log(batch, "Copied play", { label: `${p.name} → ${teamById(d.teamId)?.name || ""}` });
      await batch.commit();
      toast(`Copied to ${teamById(d.teamId)?.name || "team"}`);
    }
  });
}

function setBend(v) {
  const pe = S.playEdit, st = pe.steps[pe.cur];
  st.curves = { ...(st.curves || {}) };
  if (v) st.curves[pe.sel] = v; else delete st.curves[pe.sel];
  pe.dirty = true;
}
// live preview while the slider moves (no full re-render, so the slider keeps working)
document.addEventListener("input", (e) => {
  if (!(e.target.dataset && "bend" in e.target.dataset) || !S.playEdit) return;
  setBend(Number(e.target.value) / 100);
  const pe = S.playEdit, g = document.querySelector("#pe-court .paths");
  if (g) g.innerHTML = pathsSvg(pe.steps[pe.cur - 1], pe.steps[pe.cur], pe.side);
});
document.addEventListener("change", (e) => { if (e.target.dataset && "bend" in e.target.dataset && S.playEdit) render(); });
function resetPlays() { stopAnim(); S.playView = null; S.playEdit = null; S.playEditHidden = null; S.playLib = false; }

/* ---------- dragging in the editor ---------- */
function svgPoint(svg, ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
document.addEventListener("pointerdown", (ev) => {
  if (S.playEdit && S.playEdit.mode === "draw" && ev.target.closest && ev.target.closest("#pe-court")) {
    const svg = document.getElementById("pe-court"), p = clampPos(svgPoint(svg, ev));
    if ((S.playEdit.tool || "cut") === "erase") { eraseAt(p); ev.preventDefault(); return; }
    sketch = { svg, id: ev.pointerId, pts: [p], last: Date.now() };
    try { svg.setPointerCapture(ev.pointerId); } catch (_) {}
    ev.preventDefault();
    return;
  }
  const tok = ev.target.closest && ev.target.closest("#pe-court [data-tok]");
  if (!tok || !S.playEdit) return;
  const svg = document.getElementById("pe-court");
  const kind = tok.dataset.tok[0], i = Number(tok.dataset.tok.slice(1));
  const start = svgPoint(svg, ev), p0 = { ...S.playEdit.steps[S.playEdit.cur][kind][i] };
  drag = { tok, svg, kind, i, start, p0, moved: false, id: ev.pointerId, last: Date.now() };
  try { tok.setPointerCapture(ev.pointerId); } catch (_) {}
  ev.preventDefault();
});
document.addEventListener("pointermove", (ev) => {
  if (sketch && ev.pointerId === sketch.id) {
    const p = clampPos(svgPoint(sketch.svg, ev)), l = sketch.pts[sketch.pts.length - 1];
    if (Math.hypot(p.x - l.x, p.y - l.y) >= 0.8) sketch.pts.push(p);
    sketch.last = Date.now();
    const live = document.getElementById("pe-live"), pe = S.playEdit;
    if (live && sketch.pts.length > 1) live.innerHTML = markSvg({ t: pe.tool || "cut", team: pe.team || "o", p: sketch.pts });
    ev.preventDefault();
    return;
  }
  if (!drag || ev.pointerId !== drag.id) return;
  drag.last = Date.now();
  const p = svgPoint(drag.svg, ev);
  const q = clampPos({ x: drag.p0.x + p.x - drag.start.x, y: drag.p0.y + p.y - drag.start.y });
  if (Math.hypot(q.x - drag.p0.x, q.y - drag.p0.y) > 1.5) drag.moved = true;
  drag.tok.setAttribute("transform", `translate(${q.x} ${q.y})`);
  drag.q = q;
  const st = S.playEdit.steps[S.playEdit.cur];
  if (drag.kind === "o" && st.ball === drag.i) { const b = document.getElementById("pe-ball"); const bp = ballAt(q); if (b) b.setAttribute("transform", `translate(${bp.x} ${bp.y})`); }
  ev.preventDefault();
});
function endSketch(ev) {
  if (!sketch || (ev && ev.pointerId !== undefined && ev.pointerId !== sketch.id)) return false;
  const sk = sketch; sketch = null;
  const pe = S.playEdit;
  if (!pe) return true;
  const pts = simplifyPts(sk.pts, 0.6);
  const len = sk.pts.reduce((a, p, i) => (i ? a + Math.hypot(p.x - sk.pts[i - 1].x, p.y - sk.pts[i - 1].y) : 0), 0);
  if (len >= 4) {
    const st = pe.steps[pe.cur];
    st.marks = [...(st.marks || []), { t: pe.tool || "cut", team: ["pass", "handoff", "shot"].includes(pe.tool) ? "o" : pe.team || "o", p: pts.slice(0, 60).map((q) => ({ x: Math.round(q.x * 2) / 2, y: Math.round(q.y * 2) / 2 })) }];
    pe.dirty = true;
  }
  render();

}
function eraseAt(p) {
  const pe = S.playEdit, st = pe.steps[pe.cur], marks = st.marks || [];
  let best = -1, bd = 4;
  marks.forEach((m, i) => smoothPts(m.p).forEach((q) => { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = i; } }));

function endDrag(ev) {
  if (endSketch(ev)) return;
  if (!drag || (ev && ev.pointerId !== undefined && ev.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  const st = S.playEdit?.steps[S.playEdit.cur];

/* =========================================================
   CLUB LOGO (v-0.11)
   The admin picks an image; it is cleaned in the browser (white background
   around the logo removed, empty borders trimmed, max 512 px) and stored as a
   small PNG data URL in settings/logo. No Firebase Storage needed.
   ========================================================= */
function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("That file is not an image the browser can read. Use PNG or JPG."));
    img.src = URL.createObjectURL(file);
  });
}
// Background removal. The background colour is taken from the edges of the picture.
//   mode "around":     only background that touches the edge is removed (keeps e.g. white inside a logo)
//   mode "everywhere": that colour is removed everywhere in the picture
//   mode "none":       nothing removed
// Edges are softened by "un-mixing" the background colour, so there is no halo.
function processLogo(img, { mode = "everywhere", tolerance = 40, maxSize = 512 } = {}) {
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const im = ctx.getImageData(0, 0, w, h), d = im.data;
  // background colour = median of the border pixels
  const border = [];
  for (let x = 0; x < w; x += Math.max(1, (w / 200) | 0)) border.push((x) * 4, ((h - 1) * w + x) * 4);
  for (let y = 0; y < h; y += Math.max(1, (h / 200) | 0)) border.push((y * w) * 4, (y * w + w - 1) * 4);
  const med = (ch) => { const v = border.map((i) => d[i + ch]).sort((a, b) => a - b); return v[v.length >> 1]; };
  const bg = [med(0), med(1), med(2)];
  const bgLight = bg[0] + bg[1] + bg[2] > 600;
  if (mode !== "none") {
    const dist = (i) => Math.max(Math.abs(d[i] - bg[0]), Math.abs(d[i + 1] - bg[1]), Math.abs(d[i + 2] - bg[2]));
    const isBg = (k) => d[k * 4 + 3] < 16 || dist(k * 4) <= tolerance;
    const gone = new Uint8Array(w * h);
    if (mode === "everywhere") {
      for (let k = 0; k < w * h; k++) if (isBg(k)) gone[k] = 1;
    } else {
      const stack = [];
      const push = (x, y) => { const k = y * w + x; if (!gone[k] && isBg(k)) { gone[k] = 1; stack.push(k); } };
      for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
      for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
      while (stack.length) {
        const k = stack.pop(), x = k % w, y = (k / w) | 0;
        if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y);
        if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
      }
    }
    const soft = tolerance * 3;
    for (let k = 0; k < w * h; k++) {
      const i = k * 4;
      if (gone[k]) { d[i + 3] = 0; continue; }
      const x = k % w, y = (k / w) | 0;
      const near = (x > 0 && gone[k - 1]) || (x < w - 1 && gone[k + 1]) || (y > 0 && gone[k - w]) || (y < h - 1 && gone[k + w])
        || (x > 1 && gone[k - 2]) || (x < w - 2 && gone[k + 2]) || (y > 1 && gone[k - 2 * w]) || (y < h - 2 && gone[k + 2 * w]);
      if (!near) continue;
      const dd = dist(i);
      if (dd >= soft) continue;
      const a = Math.max(0.05, Math.min(1, (dd - tolerance * 0.5) / (soft - tolerance * 0.5)));
      for (let ch = 0; ch < 3; ch++) d[i + ch] = Math.max(0, Math.min(255, Math.round((d[i + ch] - (1 - a) * bg[ch]) / a)));
      d[i + 3] = Math.round(d[i + 3] * a);
    }
    ctx.putImageData(im, 0, 0);
  }
  // trim transparent borders + measure how light the logo is
  let x0 = w, y0 = h, x1 = -1, y1 = -1, lum = 0, n = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3] > 12) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (d[i + 3] > 200) { lum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
    }
  }
  if (x1 < 0) throw new Error("Nothing is left of the image. Lower the sensitivity or choose another option.");
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, pad = Math.round(Math.max(cw, ch) * 0.03);
  const f = Math.min(1, maxSize / (Math.max(cw, ch) + pad * 2));   // keep the logo's own shape
  const o = document.createElement("canvas");
  o.width = Math.round((cw + pad * 2) * f); o.height = Math.round((ch + pad * 2) * f);
  const octx = o.getContext("2d");
  octx.imageSmoothingQuality = "high";
  octx.drawImage(c, x0, y0, cw, ch, Math.round(pad * f), Math.round(pad * f), Math.round(cw * f), Math.round(ch * f));
  let url = o.toDataURL("image/png");
  for (let k = 0.75; url.length > 450000 && o.width * k > 96; k *= 0.75) {
    const s2 = document.createElement("canvas"); s2.width = Math.round(o.width * k); s2.height = Math.round(o.height * k);
    s2.getContext("2d").drawImage(o, 0, 0, s2.width, s2.height);
    url = s2.toDataURL("image/png");
  }
  // a light logo (e.g. white lines) needs the club colour behind it on white pages
  const onDark = mode !== "none" && n > 0 && lum / n > 170;
  // square icon for the browser tab / home screen
  const ic = document.createElement("canvas"); ic.width = ic.height = 192;
  const ictx = ic.getContext("2d");
  if (onDark) { ictx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#3c3a77"; ictx.fillRect(0, 0, 192, 192); }
  const fi = Math.min(168 / o.width, 168 / o.height);
  ictx.drawImage(o, (192 - o.width * fi) / 2, (192 - o.height * fi) / 2, o.width * fi, o.height * fi);
  return { url, icon: ic.toDataURL("image/png"), onDark, bgLight };
}

        <option value="none">Keep the picture as it is</option></select></label>
      <label class="f" id="logo-tol-wrap">Sensitivity<input type="range" id="logo-tol" min="5" max="120" value="40"></label>
      <p class="small muted" style="margin:0">Move the slider to the right if some background is left, to the left if parts of the logo disappear.</p>`,
    submitLabel: "Save logo",
    onSubmit: async () => {
      if (!res) throw new Error("There is no logo to save.");
      const batch = writeBatch(db);
      batch.set(doc(db, "settings", "logo"), { dataUrl: res.url, icon: res.icon, onDark: res.onDark, updatedAt: serverTimestamp(), updatedBy: S.user.uid });
      log(batch, "Changed club logo", { label: `${Math.round(res.url.length * 0.75 / 1024)} KB` });
      await batch.commit();
      toast("Logo saved");
    }
  });
  redraw();
  $("#logo-mode")?.addEventListener("change", (e) => { opts.mode = e.target.value; $("#logo-tol-wrap").hidden = opts.mode === "none"; redraw(); });
  let t = null;
  $("#logo-tol")?.addEventListener("input", (e) => { opts.tolerance = Number(e.target.value); clearTimeout(t); t = setTimeout(redraw, 150); });
}
/* v-0.19: Home Screen icon. iPhone uses apple-touch-icon (no transparency, square),
   Android uses manifest.webmanifest. Both must be real files next to index.html,
   so the admin downloads them here and uploads them to the GitHub repo. */
function homeIcon(size, { maskable = false } = {}) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const ctx = c.getContext("2d");
      ctx.fillStyle = S.logoOnDark ? (getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#3c3a77") : "#ffffff";
      ctx.fillRect(0, 0, size, size);
      const box = size * (maskable ? 0.66 : 0.8);
      const f = Math.min(box / img.naturalWidth, box / img.naturalHeight);
      const w = img.naturalWidth * f, h = img.naturalHeight * f;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      resolve(c);
    };
    img.onerror = () => reject(new Error("Could not read the logo."));
    img.src = S.logo;
  });
}
const canvasBytes = (c) => new Promise((res) => c.toBlob(async (b) => res(new Uint8Array(await b.arrayBuffer())), "image/png"));
// minimal ZIP (stored, no compression) so all files come in one download
function makeZip(files) {
  const crcT = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT[n] = c >>> 0; }
  const crc = (d) => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(({ name, data }) => {
    const nb = enc.encode(name), cr = crc(data);
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, cr, 4], [18, data.length, 4], [22, data.length, 4], [26, nb.length, 2], [28, 0, 2]]
      .forEach(([o, v, l]) => l === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, cr, 4], [20, data.length, 4], [24, data.length, 4], [28, nb.length, 2], [42, offset, 4]]
      .forEach(([o, v, l]) => l === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    parts.push(new Uint8Array(h.buffer), nb, data);
    central.push(new Uint8Array(ch.buffer), nb);
    offset += 30 + nb.length + data.length;
  });
  const size = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, offset, 4]]
    .forEach(([o, v, l]) => l === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}
async function downloadHomeIcons() {
  if (!S.logo) { toast("Upload the club logo first.", "error"); return; }
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#3c3a77";
  const manifest = {
    name: appName(), short_name: appName().slice(0, 12), start_url: "./", scope: "./", display: "standalone",
    background_color: "#ffffff", theme_color: accent,
    icons: [
      { src: "icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
      { src: "icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
      { src: "icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  const files = [
    { name: "apple-touch-icon.png", data: await canvasBytes(await homeIcon(180)) },
    { name: "icon-192.png", data: await canvasBytes(await homeIcon(192)) },
    { name: "icon-512.png", data: await canvasBytes(await homeIcon(512)) },
    { name: "icon-maskable-512.png", data: await canvasBytes(await homeIcon(512, { maskable: true })) },
    { name: "manifest.webmanifest", data: new TextEncoder().encode(JSON.stringify(manifest, null, 2)) }
  ];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(files));
  a.download = "home-screen-icons.zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  openModal({
    title: "Home Screen icons",
    body: `<div class="stack small">
      <div class="logo-prev"><div style="background:#fff"><img id="hs-prev" alt="" style="width:90px;height:90px;border-radius:20px;box-shadow:0 1px 6px rgba(0,0,0,.2)"></div></div>
      <div><b>home-screen-icons.zip</b> was downloaded. Unzip it and upload the 5 files to the root of the GitHub repo (next to index.html):</div>
      <div class="muted">apple-touch-icon.png · icon-192.png · icon-512.png · icon-maskable-512.png · manifest.webmanifest</div>
      <div>Then, on each phone: remove the old BBapp icon from the Home Screen, open the app in Safari/Chrome again and do <b>Add to Home Screen</b>. Phones keep the old icon until it is added again.</div></div>`,
  });
  homeIcon(180).then((c) => { const i = $("#hs-prev"); if (i) i.src = c.toDataURL("image/png"); });
}
Object.assign(ACTIONS, {
  "logo-home-icons": () => downloadHomeIcons().catch((err) => toast(errMsg(err), "error")),
  "logo-upload": () => pickLogoFile(),
  "logo-remove": () => confirmRun("Remove the club logo? The white basketball will be used again.", async () => {
    const batch = writeBatch(db);
    batch.set(doc(db, "settings", "logo"), { dataUrl: null, icon: null, onDark: false, updatedAt: serverTimestamp(), updatedBy: S.user.uid });  // rules do not allow deleting settings docs
    log(batch, "Removed club logo", {});
    await batch.commit();
    toast("Logo removed");
  })
});

/* =========================================================
   PUBLIC WEBSITE (v-0.10)
   BBapp keeps a cleaned copy of public information in public_* collections.
   web.html reads only those (no login). Nothing about members is ever copied.
   ========================================================= */
const PUB_DAYS = 200;
const PUB_SITE_FIELDS = ["tagline", "about", "email", "phone", "address", "facebook", "instagram", "heroImage"];
let pubTimer = null, pubRunning = false, pubAgain = false;
function schedulePublish() {
  if (!isStaff()) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(publishSync, 1200);
}
function canon(v) {
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === "object") { const o = {}; Object.keys(v).sort().forEach((k) => (o[k] = canon(v[k]))); return o; }
  return v === undefined ? null : v;
}
function sameData(cur, want) {
  if (!cur) return false;
  const { id, updatedAt, ...rest } = cur;
  const pick = {};
  Object.keys(want).forEach((k) => (pick[k] = rest[k]));
  return JSON.stringify(canon(pick)) === JSON.stringify(canon(want)) && Object.keys(rest).every((k) => k in want);
}
const siteUrl = (file) => new URL(file, location.href).href;
const currentSeasonId = () => activeSeason()?.id || "";

function publicEventData(e) {
  const t = teamById(e.teamId), v = venueById(e.venueId), game = e.type === "game";
  return {
    teamId: e.teamId || "", teamName: t?.name || "", category: t?.category || "", type: game ? "game" : "practice",
    title: game ? "" : (e.title || ""), opponent: game ? (e.opponent || "") : "", homeAway: game ? (e.homeAway === "away" ? "away" : "home") : "",
    date: e.date || "", startTime: e.startTime || "", endTime: e.endTime || "",
    venueName: v ? (v.name || "") : (e.location || ""), venueAddress: v ? (v.address || "") : "",
    status: e.status === "cancelled" ? "cancelled" : "scheduled",
    scoreFor: game && hasResult(e) ? Number(e.scoreFor) : null, scoreAgainst: game && hasResult(e) ? Number(e.scoreAgainst) : null
  };
}
function publicStandingData(tr) {
  const t = teamById(tr.teamId);
  const games = tournamentGames(tr).filter((g) => hasNum(g.homeScore) && hasNum(g.awayScore)).slice(0, 12)
    .map((g) => ({ date: g.date || "", home: entryName(tr, g.homeKey), away: entryName(tr, g.awayKey), homeScore: Number(g.homeScore), awayScore: Number(g.awayScore) }));
  return {
    teamId: tr.teamId || "", teamName: t?.name || "", current: !!t && t.seasonId === currentSeasonId(), name: tr.name || "",
    rows: standingsRows(tr).map((r) => ({ name: r.name, isUs: !!r.isUs, gp: r.gp, w: r.w, l: r.l, pf: r.pf, pa: r.pa, pts: r.pts })), games
  };
}
function publicNewsData(a) {
  const ids = a.teamIds || [];
  return { title: a.title || "", body: a.body || "", pinned: !!a.pinned, teamIds: ids,
    teamNames: ids.map((id) => teamById(id)?.name).filter(Boolean), createdAt: tsMillis(a.createdAt) };
}
function publicTeamData(t) {
  return { name: t.name || "", category: t.category || "", gender: t.gender || "", current: t.seasonId === currentSeasonId() };
}

// Compare what should be public with what is public, and queue only the differences.
function pubDiff(ops, coll, current, desired, mayDelete) {
  const cur = new Map(current.map((x) => [x.id, x]));
  desired.forEach((data, id) => { if (!sameData(cur.get(id), data)) ops.push(["set", coll, id, data]); });
  current.forEach((x) => { if (!desired.has(x.id) && mayDelete(x)) ops.push(["delete", coll, x.id]); });
}
async function publishSync() {
  if (!isStaff() || !S.user) return;
  if (pubRunning) { pubAgain = true; return; }
  const L = S.loaded, ops = [];
  if (L.events && L.teams && L.venues && L["public events"]) {
    const from = isoDaysAgo(PUB_DAYS - 2);
    const want = new Map();
    S.events.filter((e) => canManageTeam(e.teamId) && e.date >= from).forEach((e) => want.set(e.id, publicEventData(e)));
    pubDiff(ops, "public_events", S.pubEvents.filter((x) => (x.date || "") >= from), want, (x) => canManageTeam(x.teamId));
  }
  if (L.tournaments && L["tournament results"] && L.events && L.teams && L.seasons && L["public standings"]) {
    const want = new Map();
    S.tournaments.filter((tr) => canManageTeam(tr.teamId)).forEach((tr) => want.set(tr.id, publicStandingData(tr)));
    pubDiff(ops, "public_standings", S.pubStandings, want, (x) => canManageTeam(x.teamId));
  }
  if (L.announcements && L.teams && L["public news"]) {
    const list = S.announcements;
    const oldest = list.length >= 100 ? Math.min(...list.map((a) => tsMillis(a.createdAt) || Infinity)) : 0;
    const want = new Map();
    list.filter((a) => a.public === true && tsMillis(a.createdAt) > 0 && canEditNews(a)).forEach((a) => want.set(a.id, publicNewsData(a)));
    pubDiff(ops, "public_news", S.pubNews, want,
      (x) => (x.createdAt || 0) >= oldest && (isAdmin() || ((x.teamIds || []).length > 0 && (x.teamIds || []).every((t) => coachOf().includes(t)))));
  }
  if (isAdmin() && L.teams && L.seasons && L["public teams"]) {
    const want = new Map();
    S.teams.forEach((t) => want.set(t.id, publicTeamData(t)));
    pubDiff(ops, "public_teams", S.pubTeams, want, () => true);
  }
  if (isAdmin() && L["public site"] && S.settings) {
    const cur = S.pubSite || {};
    const want = { clubName: clubName(), appName: appName(), appUrl: siteUrl("./") };
    PUB_SITE_FIELDS.forEach((k) => (want[k] = cur[k] ?? ""));
    want.sponsors = cur.sponsors || [];
    if (!S.pubSite || !sameData(S.pubSite, want)) ops.push(["set", "public_site", "main", want]);
  }
  if (!ops.length) { if (S.pubStatus?.state !== "ok") { S.pubStatus = { state: "ok", at: Date.now(), n: 0 }; render(); } return; }
  pubRunning = true;
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const batch = writeBatch(db);
      ops.slice(i, i + 400).forEach(([kind, coll, id, data]) => {
        if (kind === "set") batch.set(doc(db, coll, id), { ...data, updatedAt: serverTimestamp() });
        else batch.delete(doc(db, coll, id));
      });
      await batch.commit();
    }
    S.pubStatus = { state: "ok", at: Date.now(), n: ops.length };
  } catch (err) {
    console.warn("[public website sync]", err.code, err.message);
    S.pubStatus = { state: "error", at: Date.now(), msg: errMsg(err) };
  } finally {
    pubRunning = false;
    render();
    if (pubAgain) { pubAgain = false; schedulePublish(); }
  }
}

function websiteSection() {
  const st = S.pubStatus;
  const status = !S.loaded["public site"] && (S.failedLists || []).some((n) => n.startsWith("public"))
    ? `<span class="badge bad">Rules missing</span>`
    : st?.state === "error" ? `<span class="badge bad">Sync failed</span>`
    : st?.state === "ok" ? `<span class="badge ok">Up to date</span>` : `<span class="badge">Checking…</span>`;
  const site = S.pubSite || {};
  return `<div class="section-title spread"><span>Public website</span><button class="btn sm" data-act="website-edit">Edit texts</button></div>
    <div class="card stack" style="gap:8px">
      <div class="spread"><div style="font-weight:600">Club website ${status}</div>
        <a class="btn sm" href="${esc(siteUrl("web.html"))}" target="_blank" rel="noopener">Open ›</a></div>
      <div class="small muted" style="word-break:break-all">${esc(siteUrl("web.html"))}</div>
      ${st?.state === "error" ? `<div class="small" style="color:var(--bad)">${esc(st.msg)}</div>` : ""}
      <div class="small muted">Shows practices, games, results and standings, plus announcements marked <b>Show on the public website</b>. Member names, attendance, stats and fees are never published. It updates automatically when a coach or admin has the app open.</div>
      <div class="small muted">${site.tagline ? `Tagline: ${esc(site.tagline)} · ` : ""}${plural((site.sponsors || []).length, "sponsor")}</div>
    </div>`;
}
function websiteModal() {
  const s = S.pubSite || {};
  const sponsors = (s.sponsors || []).map((x) => [x.name, x.url, x.logo].filter((v, i) => v || i === 0).join(" | ")).join("\n");
  openModal({
    title: "Public website",
    body: `<label class="f">Tagline<input type="text" name="tagline" maxlength="140" value="${esc(s.tagline || "")}" placeholder="We bring people together through basketball."></label>
      <label class="f">About the club<textarea name="about" rows="5" maxlength="3000">${esc(s.about || "")}</textarea></label>
      <div class="grid2"><label class="f">Contact email<input type="email" name="email" value="${esc(s.email || "")}"></label>
        <label class="f">Phone<input type="tel" name="phone" value="${esc(s.phone || "")}"></label></div>
      <label class="f">Address<input type="text" name="address" value="${esc(s.address || "")}"></label>
      <div class="grid2"><label class="f">Facebook link<input type="url" name="facebook" value="${esc(s.facebook || "")}" placeholder="https://facebook.com/…"></label>
        <label class="f">Instagram link<input type="url" name="instagram" value="${esc(s.instagram || "")}" placeholder="https://instagram.com/…"></label></div>
      <label class="f">Header photo (image link, optional)<input type="url" name="heroImage" value="${esc(s.heroImage || "")}" placeholder="https://…/team.jpg"></label>
      <label class="f">Sponsors (one per line: Name | website | logo link)<textarea name="sponsors" rows="4" placeholder="Vestjysk Bank | https://www.vestjyskbank.dk | https://…/logo.png">${esc(sponsors)}</textarea></label>
      <p class="small muted" style="margin:0">Everything on this form is public. Don't add private phone numbers or addresses.</p>`,
    onSubmit: async (d) => {
      const url = (v) => { v = String(v || "").trim(); if (v && !/^https:\/\//i.test(v)) throw new Error(`Links must start with https:// (${v.slice(0, 40)})`); return v; };
      const sponsors = String(d.sponsors || "").split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((p) => p[0])
        .slice(0, 30).map(([name, link, logo]) => ({ name: name.slice(0, 80), url: url(link), logo: url(logo) }));
      const data = { clubName: clubName(), appName: appName(), appUrl: siteUrl("./"),
        tagline: (d.tagline || "").trim(), about: (d.about || "").trim(), email: (d.email || "").trim(), phone: (d.phone || "").trim(),
        address: (d.address || "").trim(), facebook: url(d.facebook), instagram: url(d.instagram), heroImage: url(d.heroImage),
        sponsors, updatedAt: serverTimestamp() };
      const batch = writeBatch(db);
      batch.set(doc(db, "public_site", "main"), data);
      log(batch, "Edited public website", { label: data.tagline || clubName() });
      await batch.commit();
      toast("Website saved");
    }
  });
}
Object.assign(ACTIONS, { "website-edit": () => websiteModal() });

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (drag && !el.closest("#pe-court")) drag = null;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el); } catch (err) { console.warn(err); toast(errMsg(err), "error"); }
});
document.addEventListener("input", (e) => {
  if (e.target.closest && e.target.closest("#app form[data-form]")) e.target.dataset.dirty = "1";
  if (e.target.dataset?.input === "member-search") { S.memberSearch = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset?.change === "season-filter") { S.seasonFilter = e.target.value; render(); }
  if (e.target.dataset?.change === "cal-team") { S.calTeam = e.target.value; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.modal) closeModal(); });

render();
