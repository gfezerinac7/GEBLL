<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c3a77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BBapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BBapp">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%233c3a77'/%3E%3Cpath d='M2 32h60M32 2v60M11 11c12 10 12 32 0 42M53 11c-12 10-12 32 0 42' stroke='%23ffffff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface-2:#eef3fa; --text:#0f1b2d; --muted:#5b6b80;
  --line:#dce4ef; --accent:#3c3a77; --accent-ink:#ffffff; --accent-soft:#ebeaf6; --accent-dark:#2d2b5e;
  --ok:#1f7a4a; --ok-soft:#e2f4ea; --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --radius:14px; --shadow:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px}
h3{font-size:17px}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header & nav */
.top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.logo{display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
.logo img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.logo.badge{background:var(--accent);box-sizing:border-box}
.logo.badge img{height:100%;width:100%;object-fit:contain}
.logo-prev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-prev div{height:130px;border-radius:12px;display:grid;place-items:center;padding:12px;border:1px solid var(--line);overflow:hidden;min-width:0}
.logo-prev img{max-width:100%;max-height:104px;object-fit:contain;display:block}
.logo-prev .checker{background:repeating-conic-gradient(#e9eef5 0 25%,#fff 0 50%) 0 0/16px 16px}
.logo-prev .blue{background:var(--accent)}
.auth-brand .logo{margin:0 auto}
.brand .names{min-width:0}
.brand .app{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .club{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:#fff;color:var(--accent);font-weight:700;cursor:pointer}
main{padding:16px 0 calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex}
.nav button{flex:1;border:none;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 8px}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 2px 8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:22px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item.tap{cursor:pointer}
.item .main{flex:1;min-width:0}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.num{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.num.none{background:var(--surface-2);color:var(--muted);font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat .label{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.team-pick{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.team-pick:first-of-type{border-top:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.auth .card{padding:20px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .app{font-size:26px;font-weight:800;margin-top:8px}
.notice{padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);font-size:14px}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}

/* modal */
#modal-root .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#modal-root .sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:640px){#modal-root .sheet{left:50%;right:auto;bottom:auto;top:6vh;transform:translateX(-50%);width:600px;border-radius:18px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.code{font:700 28px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-align:center;padding:14px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px}
.linkbox{word-break:break-all;font-size:13px;background:var(--surface-2);padding:10px;border-radius:10px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.error{background:var(--bad);color:#fff}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.role input{width:20px;height:20px;accent-color:var(--accent)}
.role:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.role:has(input:disabled){opacity:.6;cursor:default}
.subsection{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.subsection[hidden]{display:none}
.sub-title{font-weight:700;color:var(--accent);font-size:14px}
.event{padding:0;overflow:hidden}
.event.cancelled .title{text-decoration:line-through;color:var(--muted)}
.event-head{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.datebox{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:6px 0;line-height:1.05}
.datebox.game{background:var(--accent);color:#fff}
.datebox .dow,.datebox .mon{font-size:11px;font-weight:600;text-transform:uppercase}
.datebox .dnum{font-size:20px;font-weight:800}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.counts .c{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.counts .c.ok{background:var(--ok-soft);color:var(--ok)}.counts .c.warn{background:var(--warn-soft);color:var(--warn)}.counts .c.bad{background:var(--bad-soft);color:var(--bad)}
.big-counts .c{font-size:13px;padding:4px 10px}
.responder{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.resp,.valid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.resp button,.valid button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
.valid{margin-top:4px}.valid button{padding:6px 2px;font-size:12px}
.resp.compact{margin-top:4px}.resp.compact button{padding:6px 2px;font-size:12px}
.edit-label{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;cursor:pointer;padding:2px 0}
.resp button.on.ok,.valid button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.resp button.on.warn,.valid button.on.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.resp button.on.bad,.valid button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.valid button.on{background:var(--muted);border-color:var(--muted);color:#fff}
.resp button:disabled{opacity:.5;cursor:default}
.badge.as-btn{border:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:4px 10px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.wd input{width:20px;height:20px;accent-color:var(--accent)}
[hidden]{display:none !important}
.result-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.big-result{font-size:17px;margin-top:0}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.score-grid input{font-size:22px;font-weight:700;text-align:center}
.score-dash{font-size:22px;font-weight:700;padding-bottom:10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--text)}
.bad-text{color:var(--bad) !important;font-weight:700}
.pick{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:none}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pick .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .num{width:34px;height:34px;font-size:14px}
.others summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.news.pinned{border-color:var(--accent)}
.news-body{white-space:pre-wrap;margin-top:6px;font-size:14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--surface-2)}
table.tbl th.l,table.tbl td.l{text-align:left}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tr.us{background:var(--accent-soft);font-weight:700}
table.box input{width:58px;padding:6px;text-align:center;font-size:15px}
table.box .calc{display:inline-block;min-width:34px;font-weight:700;color:var(--accent)}
.weeknav{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.weeknav .wk{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}

/* playbook (v-0.12) */
.court-wrap{max-width:560px;margin:0 auto}
.court{display:block;width:100%;height:auto;border-radius:12px;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.court.editing .tok{cursor:grab}
.court[data-side="offense"] .side-d,.court[data-side="defense"] .side-o{display:none}
.mv-o,.mv-d,.mv-b{stroke-width:.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mv-o{stroke:var(--accent)} .mv-d{stroke:#c92a2a} .mv-b{stroke:#e8590c;stroke-dasharray:2.2 1.6}
.mv-o.solid,.mv-d.solid,.mv-b.solid{stroke-dasharray:none} .bar{stroke-width:1.5} .thin{stroke-width:.5;stroke-opacity:.6}
.legend{margin:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.legend summary{cursor:pointer;font-weight:700;font-size:14px}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:8px}
.legend-grid div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-grid svg{flex:none;background:#f3e3c4;border-radius:4px}
.tools-card{margin-top:10px;padding:10px 12px}
.court.drawing{cursor:crosshair}
.court.drawing .tok{pointer-events:none}
.mark-hit{stroke:transparent;stroke-width:5;fill:none}
#pe-marks.erasing .mark:hover path{stroke-opacity:.35}
.mode-seg button{flex:1}
.tool-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.seg.tools{flex-wrap:wrap;gap:4px}
.seg.tools button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;min-width:84px}
.seg.tools svg{background:#f3e3c4;border-radius:4px}
.play-ctrl{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.dot{width:12px;height:12px;border-radius:50%;border:none;background:var(--line);padding:0;cursor:pointer}
.dot.on{background:var(--accent)}
.steps-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stepbtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--text)}
.stepbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.play-thumb{width:64px;height:60px;flex:none;border-radius:8px}
button.chip{border:none;cursor:pointer;font:inherit;font-size:13px}
button.chip.on{background:var(--accent);color:#fff}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}

/* playing time (v-0.22) */
.wrap.wide{max-width:1320px}
.rot-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.rot-title{flex:1;min-width:180px}
.rot-title h2{font-size:18px}
.rot-tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.rot-tabs button{border:none;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.rot-tabs button.on{background:var(--accent);color:#fff}
.rot-layout{display:grid;gap:16px}
.rot-qs{display:grid;gap:14px;align-content:start;align-items:start}
@media(min-width:1000px){.rot-layout{grid-template-columns:minmax(0,1fr) 260px}.rot-side{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-bottom:8px}}
@media(min-width:1180px){.rot-qs{grid-template-columns:1fr 1fr}}
.rq{padding:12px 12px 10px}
.rq-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-height:32px}
.rq-head b{flex:1;text-align:center}
.rq-sp{width:70px}
.rq-grid{display:grid;grid-template-columns:28px minmax(0,1fr);row-gap:6px;align-items:center}
.rq-axis{position:relative;height:22px}
.rq-axis span{position:absolute;bottom:7px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.rq-axis span.first{transform:none}
.rq-axis span::after{content:"";position:absolute;left:50%;top:14px;height:5px;border-left:1.5px solid #7d8796}
.rq-axis span.first::after{left:0}
.rq-pos{font-size:12px;font-weight:700;color:var(--muted)}
.rq-row{position:relative;height:36px;border-radius:6px;background:var(--surface-2)}
.rseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-right:1px solid rgba(255,255,255,.75);user-select:none;-webkit-user-select:none}
.rseg.empty{background:repeating-linear-gradient(45deg,#eef2f7 0 6px,#e1e7ef 6px 12px);color:var(--muted);font-weight:500}
.rseg.conf{box-shadow:inset 0 0 0 3px #c92a2a}
.rseg.sel{box-shadow:inset 0 0 0 3px #111}
.rh{position:absolute;top:-5px;bottom:-5px;width:22px;margin-left:-11px;cursor:ew-resize;touch-action:none;z-index:2;display:flex;justify-content:center}

.rbar{height:14px;border-radius:7px;background:var(--surface-2);position:relative;margin-top:4px}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";
import { getFirestore, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch,
  serverTimestamp, increment, arrayUnion, arrayRemove, deleteField, query, where, orderBy, limit, Timestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* =========================================================
   CONFIG
   ========================================================= */
const VERSION = "v-0.22";
const firebaseConfig = {
  apiKey: "AIzaSyCHXUL5qlZZ_me6S8oGzMMHqcBs0cV43eY",
  authDomain: "bbapp-6b10e.firebaseapp.com",
  projectId: "bbapp-6b10e",
  storageBucket: "bbapp-6b10e.firebasestorage.app",
  messagingSenderId: "431787724186",
  appId: "1:431787724186:web:450f61927ae01bfc8f7e23"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const VAPID_KEY = "BI5CmUYsogmRwMySXmpVcyHAD-avPyilWSzF6w1V98vH46Cy-tR3HQFP3idIx5WFgNlc2aGMjEAyQflR-wOUL1I";

const POSITIONS = [["PG","Point Guard"],["SG","Shooting Guard"],["SF","Small Forward"],["PF","Power Forward"],["C","Center"]];
const CATEGORIES = ["U8","U10","U12","U14","U16","U18","U20","Senior","Veterans"];
const GENDERS = ["Men","Women","Mixed"];
const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

/* =========================================================
   STATE
   ========================================================= */
const S = {
  settings: null, settingsLoaded: false, dbError: null,
  user: null, me: null, meLoaded: false, meSynced: false, pushOn: false,
  myMember: null, memberSynced: true, busy: false,
  seasons: [], teams: [], members: [], users: [], invites: [], logs: [], failedLists: [],
  events: [], venues: [], absences: [], attendance: {}, eventLog: [], calTeam: "mine", calView: "upcoming", calType: "all", weekStart: null, eventId: null,
  announcements: [], tournaments: [], tournamentGames: [], gameStats: {}, referees: [], volunteers: [], fees: [], feePayments: [], myPayments: {},
  plays: [], playsLoaded: false, playsDenied: false, playView: null, playEdit: null, playEditHidden: null, playCat: "all",
  logo: null, logoIcon: null, logoOnDark: false,
  pubEvents: [], pubStandings: [], pubNews: [], pubTeams: [], pubSite: null, loaded: {}, pubStatus: null,
  statSettings: null, teamTab: "roster", tournamentId: null, statMode: "total", feeId: null,
  tab: "home", teamId: null, seasonFilter: null, memberSearch: "", memberScope: "mine", roleFilter: "all",
  authMode: "login", joinInvite: null, showOldInvites: false,
  pendingInvite: normCode(new URLSearchParams(location.search).get("invite") || ""),
  modal: null
};
if (S.pendingInvite) S.authMode = "join";

let drag = null;   // playbook editor: token being dragged
let sketch = null; // playbook editor: stroke being drawn
let meUnsub = null, memberUnsub = null, memberListenId = null, memberRetries = 0;
let dataSubs = {}, dataKey = "";

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function normCode(c) { return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function appName() { return S.settings?.appName || "BBapp"; }
function clubName() { return S.settings?.clubName || "BB"; }
function fullName(m) { return `${m?.firstName || ""} ${m?.lastName || ""}`.trim() || "Unnamed"; }
function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?"; }
function byId(list, id) { return list.find((x) => x.id === id); }
const teamById = (id) => byId(S.teams, id);
const seasonById = (id) => byId(S.seasons, id);
const userById = (id) => byId(S.users, id);
const memberById = (id) => byId(S.members, id);
const activeSeason = () => S.seasons.find((s) => s.active);
const hasNum = (v) => v !== undefined && v !== null && v !== "";
function tsMillis(t) { return t?.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }
function fmtDate(t) { const ms = tsMillis(t); return ms ? new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function fmtDateTime(t) { const ms = tsMillis(t); return ms ? new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—"; }
function sortMembers(list) { return [...list].sort((a, b) => (a.lastName || "").localeCompare(b.lastName || "") || (a.firstName || "").localeCompare(b.firstName || "")); }
function sortTeams(list) { return [...list].sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true })); }
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const roles = (m) => m?.roles || {};

/* ---------- my permissions (mirrors firestore.rules) ---------- */
const isActive = () => !!(S.me && S.me.active);
const myRoles = () => (isActive() && S.myMember && S.myMember.uid === S.user?.uid ? roles(S.myMember) : {});
const isAdmin = () => isActive() && (S.me.isAdmin === true || myRoles().admin === true);
const coachOf = () => (myRoles().coach ? S.myMember.coachTeamIds || [] : []);
const isCoach = () => coachOf().length > 0;
const isStaff = () => isAdmin() || isCoach();
const canManageTeam = (tid) => isAdmin() || coachOf().includes(tid);
// coaches can only edit player-only members of their own teams
const canEditMember = (m) => isAdmin() || (isCoach() && !roles(m).coach && !roles(m).admin && coachOf().includes(m.playerTeamId));

function toast(msg, type = "") {
  const box = $("#toast");
  while (box.children.length >= 2) box.firstElementChild.remove();
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), type === "error" ? 6000 : 3000);
}
function errMsg(err) {
  const map = {
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/email-already-in-use": "This email already has an account. Log in, then use “Redeem invite code” in your profile.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
    "auth/network-request-failed": "No connection. Check your internet.",
    "permission-denied": "You don't have permission to do that.",
    "unavailable": "No connection to the database. Try again."
  };
  return map[err?.code] || err?.message || String(err);
}
function log(batch, action, details = {}) {
  if (!S.user || !isActive()) return;
  const ref = doc(collection(db, "auditLog"));
  const data = { action, details, byUid: S.user.uid, byName: S.me?.name || "", at: serverTimestamp() };
  if (batch) batch.set(ref, data);
  else setDoc(ref, data).catch(() => {});
}
function genCode() {
  const arr = new Uint32Array(8);
  crypto.getRandomValues(arr);
  return Array.from(arr, (n) => CODE_ALPHABET[n % CODE_ALPHABET.length]).join("");
}
function inviteLink(code) { return `${location.origin}${location.pathname}?invite=${code}`; }
function inviteStatus(inv) {
  if (!inv.active) return ["Cancelled", "bad"];
  if (tsMillis(inv.expiresAt) < Date.now()) return ["Expired", "bad"];
  if ((inv.uses || 0) >= (inv.maxUses || 1)) return ["Used", "ok"];
  return ["Open", "accent"];
}
const inviteIsOpen = (inv) => inviteStatus(inv)[0] === "Open";
function describeInvite(inv) {
  if (inv.type === "guardian") return `Parent / guardian of ${inv.memberName || "a player"}`;
  return `Account for ${inv.memberName || "a member"}`;
}
function roleBadgesFor(m) {
  const r = roles(m), b = [];
  if (r.admin) b.push(`<span class="badge accent">Admin</span>`);
  if (r.coach) b.push(`<span class="badge accent">Coach</span>`);
  if (r.player) b.push(`<span class="badge ok">Player</span>`);
  return b.join(" ");
}
function playerLine(m) {
  if (!roles(m).player) return "";
  const t = teamById(m.playerTeamId);
  const pos = [m.pos1, m.pos2].filter(Boolean).join(" / ");
  return [t ? `${t.name}${hasNum(m.number) ? ` · #${m.number}` : ""}` : "No team", pos].filter(Boolean).join(" · ");
}
function coachLine(m) {
  if (!roles(m).coach) return "";
  const names = (m.coachTeamIds || []).map((id) => teamById(id)?.name).filter(Boolean);
  return names.length ? `Coach: ${names.join(", ")}` : "Coach: no team";
}

/* =========================================================
   FIREBASE LISTENERS
   ========================================================= */
onSnapshot(doc(db, "settings", "stats"),
  (snap) => { S.statSettings = snap.exists() ? snap.data() : null; render(); },
  (err) => console.warn("[stats settings]", err.code));

// v-0.11: club logo (small image stored as a data URL, readable without login)
onSnapshot(doc(db, "settings", "logo"),
  (snap) => {
    const x = snap.exists() ? snap.data() : {};
    S.logo = x.dataUrl || null; S.logoIcon = x.icon || S.logo; S.logoOnDark = x.onDark === true;
    applyFavicon(); render();
  },
  (err) => console.warn("[logo]", err.code));

onSnapshot(doc(db, "settings", "app"),
  (snap) => { S.settings = snap.exists() ? snap.data() : null; S.settingsLoaded = true; S.dbError = null; render(); },
  (err) => { S.dbError = err; S.settingsLoaded = true; render(); });

onAuthStateChanged(auth, (u) => {
  S.user = u;
  if (meUnsub) { meUnsub(); meUnsub = null; }
  stopMemberListener();
  S.me = null; S.meSynced = false; S.meLoaded = !u;
  dataKey = "__reset"; syncDataSubs();
  if (u) {
    meUnsub = onSnapshot(doc(db, "users", u.uid), { includeMetadataChanges: true },
      (snap) => {
        S.me = snap.exists() ? { id: snap.id, ...snap.data() } : null;
        S.meSynced = !snap.metadata.hasPendingWrites;
        S.meLoaded = true;
        syncMemberListener();
        syncDataSubs();
        render();
        initPush();
        maybeMigrateLegacy();
        maybeAutoRedeem();
      },
      (err) => { S.meLoaded = true; toast(errMsg(err), "error"); render(); });
  }
  render();
});

function stopMemberListener() {
  if (memberUnsub) memberUnsub();
  memberUnsub = null; memberListenId = null; S.myMember = null; S.memberSynced = true;
}
function syncMemberListener() {
  if (S.me && !S.meSynced) return; // keep the current listener while my own profile write is pending
  const mid = isActive() ? S.me.memberId || null : null;
  if (mid === memberListenId) return;
  stopMemberListener();
  if (!mid) return;
  memberListenId = mid;
  S.memberSynced = false;
  memberUnsub = onSnapshot(doc(db, "members", mid), { includeMetadataChanges: true },
    (snap) => {
      memberRetries = 0;
      S.myMember = snap.exists() ? { id: snap.id, ...snap.data() } : null;
      S.memberSynced = !snap.metadata.hasPendingWrites;
      syncDataSubs(); render();
    },
    (err) => {
      console.warn("[my member]", err.code, err.message);
      memberUnsub = null;
      if (memberRetries < 3) {
        memberRetries++;
        setTimeout(() => { if (memberListenId === mid) { memberListenId = null; syncMemberListener(); } }, 2000 * memberRetries);
      } else {
        S.myMember = null; S.memberSynced = true;
        S.failedLists = [...new Set([...(S.failedLists || []), "my member profile"])];
        syncDataSubs(); render();
      }
    });
}

let subsGen = 0;
function syncDataSubs() {
  // Wait until the server has confirmed my own profile and roles, otherwise the
  // rules still see the old state and reject the listeners.
  if (S.user && S.me && (!S.meSynced || !S.memberSynced)) return;
  const key = `${S.user?.uid || ""}|${isActive()}|${isStaff()}|${isAdmin()}|${coachOf().join(",")}`;
  if (key === dataKey) return;
  dataKey = key;
  const gen = ++subsGen;
  Object.values(dataSubs).forEach((u) => u && u());
  dataSubs = {};
  S.failedLists = [];
  S.loaded = {}; S.pubEvents = []; S.pubStandings = []; S.pubNews = []; S.pubTeams = []; S.pubSite = null; S.pubStatus = null;
  if (!isActive()) { S.seasons = []; S.teams = []; S.members = []; S.users = []; S.invites = []; S.logs = []; S.events = []; S.venues = []; S.absences = []; S.attendance = {}; S.announcements = []; S.tournaments = []; S.tournamentGames = []; S.gameStats = {}; S.referees = []; S.volunteers = []; S.fees = []; S.feePayments = []; S.myPayments = {}; return; }
  if (!isStaff()) { S.users = []; S.invites = []; }
  if (!isAdmin()) S.logs = [];
  // Each list retries on its own; a failing list never clears the others (no flicker).
  const listen = (name, makeRef, setter) => {
    let tries = 0;
    const start = () => onSnapshot(makeRef(),
      (snap) => {
        tries = 0;
        S.failedLists = (S.failedLists || []).filter((n) => n !== name);
        setter(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        if (!snap.metadata?.fromCache) S.loaded[name] = true;
        schedulePublish();
        render();
      },
      (err) => {
        console.warn(`[${name}]`, err.code, err.message);
        if (gen !== subsGen) return;
        if (err.code === "permission-denied" && tries < 3) {
          tries++;
          setTimeout(() => { if (gen === subsGen) dataSubs[name] = start(); }, 1500 * tries);
        } else if (!(S.failedLists || []).includes(name)) {
          S.failedLists = [...(S.failedLists || []), name];
          render();
        }
      });
    dataSubs[name] = start();
  };
  listen("seasons", () => collection(db, "seasons"), (v) => {
    S.seasons = v.sort((a, b) => String(b.startDate || "").localeCompare(String(a.startDate || "")));
    if (S.seasonFilter === null && S.seasons.length) S.seasonFilter = activeSeason()?.id || "all";
  });
  listen("teams", () => collection(db, "teams"), (v) => (S.teams = sortTeams(v)));
  listen("members", () => collection(db, "members"), (v) => (S.members = sortMembers(v)));
  listen("venues", () => collection(db, "venues"), (v) => (S.venues = v.sort((a, b) => (b.isHome ? 1 : 0) - (a.isHome ? 1 : 0) || (a.name || "").localeCompare(b.name || ""))));
  listen("events", () => query(collection(db, "events"), where("date", ">=", isoDaysAgo(200))), (v) => (S.events = v));
  listen("unavailability", () => query(collection(db, "absences"), where("to", ">=", isoDaysAgo(200))), (v) => (S.absences = v));
  listen("announcements", () => query(collection(db, "announcements"), orderBy("createdAt", "desc"), limit(100)), (v) => (S.announcements = v));
  listen("tournaments", () => collection(db, "tournaments"), (v) => (S.tournaments = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
  listen("tournament results", () => collection(db, "tournamentGames"), (v) => (S.tournamentGames = v));
  listen("referees", () => collection(db, "referees"), (v) => (S.referees = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
  listen("volunteers", () => collection(db, "volunteers"), (v) => (S.volunteers = v));
  listen("fees", () => collection(db, "fees"), (v) => (S.fees = v.sort((a, b) => String(b.dueDate || "").localeCompare(String(a.dueDate || "")))));
  if (isStaff()) listen("fee payments", () => collection(db, "feePayments"), (v) => (S.feePayments = v));
  if (isStaff()) {
    listen("users", () => collection(db, "users"), (v) => (S.users = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
    listen("invites", () => collection(db, "invites"), (v) => (S.invites = v.sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt))));
  }
  // v-0.10: staff keep the public website copies (public_*) in sync
  if (isStaff()) {
    listen("public events", () => query(collection(db, "public_events"), where("date", ">=", isoDaysAgo(PUB_DAYS))), (v) => (S.pubEvents = v));
    listen("public standings", () => collection(db, "public_standings"), (v) => (S.pubStandings = v));
    listen("public news", () => collection(db, "public_news"), (v) => (S.pubNews = v));
  }
  if (isAdmin()) {
    listen("public teams", () => collection(db, "public_teams"), (v) => (S.pubTeams = v));
    listen("public site", () => collection(db, "public_site"), (v) => (S.pubSite = v.find((x) => x.id === "main") || null));
  }
  if (isAdmin()) listen("activity log", () => query(collection(db, "auditLog"), orderBy("at", "desc"), limit(50)), (v) => (S.logs = v));
}

/* One-time upgrade for the admin account created with v-0.1.x (no member profile yet). */
let migrationTried = false;
async function maybeMigrateLegacy() {
  if (migrationTried || !S.meSynced || !isActive() || S.me.isAdmin !== true || S.me.memberId) return;
  migrationTried = true; // only once per page load, never in a loop
  try {
    const parts = String(S.me.name || "").trim().split(/\s+/);
    const ref = doc(collection(db, "members"));
    const batch = writeBatch(db);
    batch.set(ref, newMemberData({ firstName: parts[0] || "Admin", lastName: parts.slice(1).join(" "),
      roles: { player: false, coach: false, admin: true }, uid: S.user.uid }));
    batch.update(doc(db, "users", S.user.uid), { memberId: ref.id, updatedAt: serverTimestamp() });
    await batch.commit();
    await updateDoc(doc(db, "users", S.user.uid), { isAdmin: deleteField(), coachOf: deleteField() }).catch(() => {});
    toast("Your admin profile was upgraded. You can add Player/Coach in Members.");
  } catch (err) {
    console.warn("[upgrade]", err);
    if (err.code === "permission-denied") { S.failedLists = [...(S.failedLists || []), "profile upgrade"]; render(); }
    else toast(errMsg(err), "error");
  }
}
function newMemberData(o) {
  return {
    firstName: o.firstName || "", lastName: o.lastName || "", birthYear: o.birthYear ?? null, isMinor: !!o.isMinor,
    roles: { player: !!o.roles?.player, coach: !!o.roles?.coach, admin: !!o.roles?.admin },
    pos1: o.pos1 || "", pos2: o.pos2 || "", playerTeamId: o.playerTeamId || null, number: hasNum(o.number) ? o.number : null,
    coachTeamIds: o.coachTeamIds || [], uid: o.uid || null, guardianUids: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  };
}

/* =========================================================
   PUSH NOTIFICATIONS (v-0.9)
   ========================================================= */
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
const pushState = () => {
  if (!("Notification" in window) || !navigator.serviceWorker) return "unsupported";
  if (isIOS() && !isStandalone()) return "ios-home-screen";
  if (Notification.permission === "denied") return "blocked";
  if (Notification.permission === "granted") return S.pushOn ? "on" : "granted";
  return "off";
};
let messaging = null, swReg = null, pushInit = false;
async function initPush() {
  if (pushInit || !isActive()) return;
  pushInit = true;
  try {
    if (!(await isSupported().catch(() => false))) return;
    swReg = await navigator.serviceWorker.register("firebase-messaging-sw.js", { scope: "./" });
    messaging = getMessaging(fbApp);
    onMessage(messaging, (payload) => {
      const d = payload.data || payload.notification || {};
      toast(`${d.title || "BBapp"}${d.body ? ` — ${d.body}` : ""}`);
    });
    if (Notification.permission === "granted") enablePush(true);
  } catch (err) { console.warn("[push]", err); }
}
async function enablePush(silent = false) {
  try {
    if (!messaging) { if (!silent) toast("This browser can't do notifications.", "error"); return; }
    if (isIOS() && !isStandalone()) { if (!silent) toast("On iPhone, add BBapp to your Home Screen first.", "error"); return; }
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { if (!silent) toast("Notifications are blocked. Allow them in your browser settings.", "error"); render(); return; }
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if (!token) { if (!silent) toast("Could not get a notification token.", "error"); return; }
    await setDoc(doc(db, "pushTokens", token), { uid: S.user.uid, name: S.me?.name || "",
      ua: (navigator.userAgent || "").slice(0, 180), updatedAt: serverTimestamp() }, { merge: true });
    S.pushOn = true;
    if (!silent) toast("Notifications are on for this device.");
    render();
  } catch (err) { console.warn("[push]", err); if (!silent) toast(errMsg(err), "error"); }
}
/** Queue a notification. The Cloud Function resolves who gets it and sends it. */
function queuePush(batch, { title, body, url = "", tag = "", teamIds = [], memberIds = [], uids = [], everyone = false, reason = "" }) {
  if (!S.user) return;
  const data = { title, body, url: url || location.href.split("?")[0], tag, teamIds, memberIds, uids, everyone,
    reason, excludeUid: S.user.uid, status: "pending", createdBy: S.user.uid, createdByName: S.me?.name || "", createdAt: serverTimestamp() };
  const ref = doc(collection(db, "pushQueue"));
  if (batch) batch.set(ref, data);
  else setDoc(ref, data).catch((err) => console.warn("[push queue]", err));
}

   RENDER
   ========================================================= */
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderNow(); });
}
function renderNow() {
  // never rebuild the court while a player is being dragged (but never get stuck if the browser lost the "finger up")
  if (drag && Date.now() - drag.last < 4000) return;
  if (sketch && Date.now() - sketch.last < 4000) return;
  if (rotDrag && Date.now() - rotDrag.last < 4000) return;
  drag = null; sketch = null; rotDrag = null;
  document.title = appName();
  const root = $("#app");
  const active = document.activeElement;
  const focusId = active && active.id && root.contains(active) ? active.id : null;
  const caret = focusId && "selectionStart" in active ? active.selectionStart : null;
  let html;
  if (S.busy || !S.settingsLoaded || (S.user && !S.meLoaded)) html = `<div class="spinner"></div>`;
  else if (S.dbError && !S.settings) html = viewDbError();
  else if (!S.settings) html = viewSetup();
  else if (!S.user) html = viewAuth();
  else if (!S.me) html = viewCompleteProfile();
  else if (S.me.active && S.me.mustChangePassword === true) html = viewChangePassword();
  else if (!S.me.active) html = viewDisabled();
  else html = viewShell();
  // keep what the user is typing in on-page forms when live data re-renders the page
  const keep = [];
  root.querySelectorAll("form[data-form] [data-dirty]").forEach((el) => {
    if (el.name) keep.push([el.form.dataset.form, el.form.elements.eventId?.value || "", el.name, el.value]);
  });
  root.innerHTML = html;
  keep.forEach(([f, id, n, v]) => {
    const form = [...root.querySelectorAll(`form[data-form="${f}"]`)].find((x) => (x.elements.eventId?.value || "") === id);
    const el = form?.elements[n];
    if (el && "value" in el) { el.value = v; el.dataset.dirty = "1"; }
  });
  syncAttendanceSubs();
  syncStatsSubs();
  syncPlaySubs();
  loadMyPayments();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret !== null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (_) {} } }
  }
}

  if (scope === "mine") list = list.filter((m) => coachOf().includes(m.playerTeamId) || (m.coachTeamIds || []).some((t) => coachOf().includes(t)));
  if (rf !== "all") list = list.filter((m) => roles(m)[rf]);
  if (q) list = list.filter((m) => fullName(m).toLowerCase().includes(q));
  const chip = (k, l) => `<button data-act="role-filter" data-role="${k}" class="${rf === k ? "on" : ""}">${l}</button>`;
  return `<div class="spread"><h2>Members</h2><button class="btn primary sm" data-act="member-new">+ New member</button></div>
    <div class="stack" style="margin:12px 0">
      <input type="search" id="member-search" data-input="member-search" placeholder="Search by name" value="${esc(S.memberSearch)}">
      <div class="seg">${chip("all", "All")}${chip("player", "Players")}${chip("coach", "Coaches")}${chip("admin", "Admins")}</div>
      ${!isAdmin() ? `<div class="seg"><button data-act="member-scope" data-scope="mine" class="${scope === "mine" ? "on" : ""}">My teams</button><button data-act="member-scope" data-scope="all" class="${scope === "all" ? "on" : ""}">Whole club</button></div>` : ""}
    </div>
    ${list.length ? `<div class="list">${list.map((m) => memberItem(m)).join("")}</div>` : `<div class="card empty">No members found.</div>`}`;
}

function accountItem(u) {
  const self = u.id === S.user.uid;
  const member = S.members.find((m) => m.uid === u.id);
  const children = S.members.filter((m) => (m.guardianUids || []).includes(u.id)).map(fullName);
  const lines = [];
  if (member) lines.push(`Member: ${fullName(member)}`);
  if (children.length) lines.push(`Parent of: ${children.join(", ")}`);
  return `<div class="item"><div class="main">
      <div class="title">${esc(u.name || "?")} ${member ? roleBadgesFor(member) : ""} ${u.active ? "" : `<span class="badge bad">Disabled</span>`}</div>
      <div class="small muted">${esc(u.email || "")}</div>
      ${lines.length ? `<div class="small muted">${esc(lines.join(" · "))}</div>` : ""}</div>
    ${self ? `<span class="badge">You</span>` : `<button class="btn sm ${u.active ? "danger" : ""}" data-act="user-active" data-id="${u.id}">${u.active ? "Disable" : "Enable"}</button>`}
  </div>`;
}
function inviteList(invites) {
  return `<div class="list">${invites.map((i) => {
    const [label, cls] = inviteStatus(i);
    const open = label === "Open";
    const canManage = isAdmin() || (i.teamId && coachOf().includes(i.teamId));
    return `<div class="item"><div class="main">
        <div class="title" style="font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em">${esc(i.id)} <span class="badge ${cls}">${label}</span></div>
        <div class="small">${esc(describeInvite(i))}${i.teamName ? ` · ${esc(i.teamName)}` : ""}</div>
        <div class="small muted">Used ${i.uses || 0}/${i.maxUses || 1} · Expires ${esc(fmtDate(i.expiresAt))} · by ${esc(i.createdByName || "?")}</div></div>
      ${open ? `<div class="stack" style="gap:6px"><button class="btn sm" data-act="invite-show" data-code="${i.id}">Share</button>
        ${canManage ? `<button class="btn sm danger" data-act="invite-deactivate" data-code="${i.id}">Cancel</button>` : ""}</div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function openModal({ title, body, submitLabel = "Save", onSubmit = null, danger = "" }) {
  S.modal = { onSubmit };
  $("#modal-root").innerHTML = `<div class="backdrop" data-act="modal-close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-act="modal-close" aria-label="Close">✕</button></div>
      <form data-form="modal" class="sheet-body" novalidate>${body}
        ${onSubmit ? `<div class="form-actions">${danger}<span style="flex:1"></span><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div>` : ""}
      </form></div>`;
  document.body.style.overflow = "hidden";
}
function closeModal() { S.modal = null; $("#modal-root").innerHTML = ""; document.body.style.overflow = ""; }

function seasonModal(s) {
  openModal({
    title: s ? "Edit season" : "New season",
    body: `<label class="f">Name<input type="text" name="name" value="${esc(s?.name || "")}" placeholder="2026/27" required></label>
      <div class="grid2"><label class="f">Start<input type="date" name="startDate" value="${esc(s?.startDate || "")}"></label>
      <label class="f">End<input type="date" name="endDate" value="${esc(s?.endDate || "")}"></label></div>
      ${s ? "" : `<label class="check"><input type="checkbox" name="active" ${S.seasons.length ? "" : "checked"}> Make this the active season</label>`}`,
    danger: s && !S.teams.some((t) => t.seasonId === s.id) ? `<button type="button" class="btn danger" data-act="season-delete" data-id="${s.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      if (!d.name?.trim()) throw new Error("Name is required.");
      const batch = writeBatch(db);
      const ref = s ? doc(db, "seasons", s.id) : doc(collection(db, "seasons"));
      const data = { name: d.name.trim(), startDate: d.startDate || "", endDate: d.endDate || "", updatedAt: serverTimestamp() };
      if (s) batch.update(ref, data);
      else {
        batch.set(ref, { ...data, active: !!d.active, createdAt: serverTimestamp() });
        if (d.active) { S.seasons.filter((x) => x.active).forEach((x) => batch.update(doc(db, "seasons", x.id), { active: false })); S.seasonFilter = ref.id; }
      }
      log(batch, s ? "Edited season" : "Created season", { label: data.name });
      await batch.commit();
      toast("Season saved");
    }
  });
}

/* ---------- the member form (Player / Coach / Admin) ---------- */
function memberModal(m, preset = {}) {
  const admin = isAdmin();
  const year = new Date().getFullYear();
  const r = m ? { ...roles(m) } : { player: !!preset.player, coach: !!preset.coach, admin: false };
  if (!admin) r.player = true; // coaches can only create/edit players
  const season = activeSeason();
  const teamsForSelect = S.teams.filter((t) => (admin || coachOf().includes(t.id)) &&
    (!season || t.seasonId === season.id || t.id === m?.playerTeamId || t.id === preset.teamId));
  const coachTeamsList = S.teams.filter((t) => !season || t.seasonId === season.id || (m?.coachTeamIds || []).includes(t.id));
  const playerTeam = m?.playerTeamId || preset.teamId || "";
  const coachTeamIds = m?.coachTeamIds || (preset.coachTeamId ? [preset.coachTeamId] : []);
  const posOpts = (sel, none) => `<option value="">${none ? "—" : "Choose…"}</option>${POSITIONS.map(([c, l]) => `<option value="${c}" ${sel === c ? "selected" : ""}>${c} · ${l}</option>`).join("")}`;

  let links = "";
  if (m) {
    const account = m.uid ? userById(m.uid) : null;
    const guardians = (m.guardianUids || []).map((u) => ({ uid: u, user: userById(u) }));
    links = `<div class="section-title" style="margin-top:8px">Login &amp; parents</div>
      <div class="list">
        <div class="item"><div class="main"><div class="small muted">Own account</div>
          <div class="title">${m.uid ? esc(account?.name || "Linked") : `<span class="muted">No account yet</span>`}</div>
          ${account?.email ? `<div class="small muted">${esc(account.email)}</div>` : ""}</div>
          ${m.uid ? (admin && m.uid !== S.user.uid ? `<button type="button" class="btn sm danger" data-act="unlink-account" data-id="${m.id}">Unlink</button>` : "")
            : `<button type="button" class="btn sm" data-act="invite-new" data-type="self" data-member="${m.id}">Invite</button>`}
        </div>
        ${guardians.map((g) => `<div class="item"><div class="main"><div class="small muted">Parent / guardian</div>
          <div class="title">${esc(g.user?.name || "Linked account")}</div>${g.user?.email ? `<div class="small muted">${esc(g.user.email)}</div>` : ""}</div>
          ${admin ? `<button type="button" class="btn sm danger" data-act="unlink-guardian" data-id="${m.id}" data-uid="${g.uid}">Remove</button>` : ""}</div>`).join("")}
        <div class="item"><div class="main small muted">${m.isMinor ? "Under 18: a parent or guardian can manage this player." : "Add a parent or guardian account."}</div>
          <button type="button" class="btn sm" data-act="invite-new" data-type="guardian" data-member="${m.id}">Invite parent</button></div>
      </div>`;
  }

  openModal({
    title: m ? fullName(m) : "New member",
    body: `<div class="grid2">
        <label class="f">First name<input type="text" name="firstName" value="${esc(m?.firstName || "")}" required></label>
        <label class="f">Last name<input type="text" name="lastName" value="${esc(m?.lastName || "")}"></label></div>
      <div class="grid2">
        <label class="f">Birth year<input type="number" name="birthYear" id="birth-year" inputmode="numeric" min="1930" max="${year}" value="${esc(m?.birthYear || "")}"></label>
        <label class="check" style="margin-top:20px"><input type="checkbox" name="isMinor" id="is-minor" ${m?.isMinor ? "checked" : ""}> Under 18</label></div>

      <div class="f" style="font-size:13px;color:var(--muted);font-weight:600">Roles</div>
      <div class="roles">
        <label class="role"><input type="checkbox" name="rolePlayer" data-role-toggle="player" ${r.player ? "checked" : ""} ${admin ? "" : "disabled"}><span>Player</span></label>
        <label class="role"><input type="checkbox" name="roleCoach" data-role-toggle="coach" ${r.coach ? "checked" : ""} ${admin ? "" : "disabled"}><span>Coach</span></label>
        <label class="role"><input type="checkbox" name="roleAdmin" data-role-toggle="admin" ${r.admin ? "checked" : ""} ${admin ? "" : "disabled"}><span>Admin</span></label>
      </div>

      <div class="subsection" data-role-section="player" ${r.player ? "" : "hidden"}>
        <div class="sub-title">Player</div>
        <div class="grid2">
          <label class="f">1st position<select name="pos1">${posOpts(m?.pos1, false)}</select></label>
          <label class="f">2nd position<select name="pos2">${posOpts(m?.pos2, true)}</select></label></div>
        <div class="grid2">
          <label class="f">Team<select name="playerTeamId">${admin ? `<option value="">No team yet</option>` : ""}${teamsForSelect.map((t) => `<option value="${t.id}" ${playerTeam === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
          <label class="f">Jersey #<input type="number" name="number" inputmode="numeric" min="0" max="99" value="${esc(hasNum(m?.number) ? m.number : "")}"></label></div>
      </div>

      <div class="subsection" data-role-section="coach" ${r.coach ? "" : "hidden"}>
        <div class="sub-title">Coach of</div>
        ${coachTeamsList.length ? coachTeamsList.map((t) => `<label class="check" style="padding:6px 0"><input type="checkbox" name="coach_${t.id}" ${coachTeamIds.includes(t.id) ? "checked" : ""}> ${esc(t.name)} <span class="small muted">${esc(seasonById(t.seasonId)?.name || "")}</span></label>`).join("")
          : `<div class="small muted">No teams yet. Create teams first.</div>`}
      </div>

      <div class="subsection" data-role-section="admin" ${r.admin ? "" : "hidden"}>
        <div class="sub-title">Admin</div>
        <div class="small muted">Full access: sees and manages everything in the club.</div>
      </div>
      ${links}`,
    danger: m && admin && m.uid !== S.user.uid ? `<button type="button" class="btn danger" data-act="member-delete" data-id="${m.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      const nr = admin ? { player: !!d.rolePlayer, coach: !!d.roleCoach, admin: !!d.roleAdmin } : { player: true, coach: false, admin: false };
      if (!d.firstName?.trim()) throw new Error("First name is required.");
      if (!nr.player && !nr.coach && !nr.admin) throw new Error("Tick at least one role: Player, Coach or Admin.");
      const data = {
        firstName: d.firstName.trim(), lastName: (d.lastName || "").trim(),
        birthYear: d.birthYear ? Number(d.birthYear) : null, isMinor: !!d.isMinor,
        pos1: "", pos2: "", playerTeamId: null, number: null, updatedAt: serverTimestamp()
      };
      if (admin) { data.roles = nr; data.coachTeamIds = []; }
      if (nr.player) {
        if (!d.pos1) throw new Error("Choose the player's 1st position.");
        if (!admin && !d.playerTeamId) throw new Error("Choose one of your teams.");
        data.pos1 = d.pos1; data.pos2 = d.pos2 || ""; data.playerTeamId = d.playerTeamId || null;
        if (hasNum(d.number)) {
          const n = Number(d.number);
          if (!Number.isInteger(n) || n < 0 || n > 99) throw new Error("Jersey number must be 0–99.");
          if (data.playerTeamId) {
            const clash = S.members.find((o) => o.id !== m?.id && roles(o).player && o.playerTeamId === data.playerTeamId && hasNum(o.number) && Number(o.number) === n);
            if (clash) throw new Error(`#${n} is already used by ${fullName(clash)} in ${teamById(data.playerTeamId)?.name}.`);
          }
          data.number = n;
        }
      }
      if (admin && nr.coach) {
        data.coachTeamIds = coachTeamsList.filter((t) => d[`coach_${t.id}`]).map((t) => t.id)
          .concat((m?.coachTeamIds || []).filter((id) => !coachTeamsList.some((t) => t.id === id)));
      }
      if (admin && m && m.uid === S.user.uid && !nr.admin && S.me.isAdmin !== true) {
        if (!window.confirm("You are removing Admin from your own profile. You will lose admin access. Continue?")) return false;
      }
      const batch = writeBatch(db);
      const ref = m ? doc(db, "members", m.id) : doc(collection(db, "members"));
      if (m) batch.update(ref, data);
      else batch.set(ref, { ...newMemberData({ roles: nr }), ...data, createdAt: serverTimestamp() });
      log(batch, m ? "Edited member" : "Created member", { label: `${data.firstName} ${data.lastName}`.trim() });
      await batch.commit();
      toast(m ? "Member saved" : `${data.firstName} added`);
    }
  });
  const by = $("#birth-year"), minor = $("#is-minor");
  if (by && minor) by.addEventListener("input", () => { const y = Number(by.value); if (y > 1900) minor.checked = (year - y) < 18; });
  document.querySelectorAll("#modal-root [data-role-toggle]").forEach((cb) => cb.addEventListener("change", () => {
    const sec = $(`#modal-root [data-role-section="${cb.dataset.roleToggle}"]`);
    if (sec) sec.hidden = !cb.checked;
  }));
}

// Creates the Firebase login in a second, invisible app instance, so the admin stays logged in.
// The new account then redeems the invite itself (same database rules as a normal sign-up).
async function createLoginForInvite(code, inv, email, password, name) {
  const secApp = getApps().find((a) => a.name === "account-maker") || initializeApp(firebaseConfig, "account-maker");
  const secAuth = getAuth(secApp), secDb = getFirestore(secApp);
  let cred;
  try { cred = await createUserWithEmailAndPassword(secAuth, email, password); }
  catch (err) {
    if (err?.code === "auth/email-already-in-use") throw new Error("That email already has a login. The invite was created — send them the code so they can redeem it from their profile.");
    throw err;
  }
  const uid = cred.user.uid, self = inv.type !== "guardian";
  try {
    const batch = writeBatch(secDb);
    batch.update(doc(secDb, "invites", code), { uses: increment(1), usedBy: arrayUnion(uid), lastUsedAt: serverTimestamp() });
    batch.set(doc(secDb, "users", uid), { name: self ? inv.memberName : name, email, phone: "", active: true,
      memberId: self ? inv.memberId : null, joinedWith: code, mustChangePassword: true, createdAt: serverTimestamp() });
    if (self) batch.update(doc(secDb, "members", inv.memberId), { uid, lastInvite: code, updatedAt: serverTimestamp() });
    else batch.update(doc(secDb, "members", inv.memberId), { guardianUids: arrayUnion(uid), lastInvite: code, updatedAt: serverTimestamp() });
    await batch.commit();
  } finally {
    try { await signOut(secAuth); } catch (_) {}
  }
  log(null, "Created login with temporary password", { label: `${email} · ${describeInvite(inv)}` });
  toast("Login created");
  return { email, password };
}

// Invite email: on phones (and Safari on Mac) the share sheet can attach the install guide PDF;
// elsewhere we open the email app with the guide as a link (browsers can't attach files to mailto).
async function sendInviteEmail(code, creds = null) {
  const inv = byId(S.invites, code) || {};
  const link = inviteLink(code), guide = new URL("install-guide.pdf", location.href).href;
  const to = ($("#invite-to")?.value || "").trim();
  const subject = `Your invite to ${appName()} – ${clubName()}`;
  const body = [
    `Hi${inv.memberName ? " " + inv.memberName.split(" ")[0] : ""},`, "",
    `You're invited to ${appName()}, the team app of ${clubName()} (${describeInvite(inv)}).`, "",
    ...(creds ? [
      `Your login is ready:`,
      `   Email: ${creds.email}`,
      `   Temporary password: ${creds.password}`, "",
      `1. Open ${new URL("./", location.href).href} on your phone and tap "Log in".`,
      `2. Log in with the email and temporary password above, then choose your own password.`,
      `3. Put the app on your home screen and turn on notifications.`, ""
    ] : [
      `1. Open this link on your phone: ${link}`,
      `   (or go to ${new URL("./", location.href).href} → "Join with code" and type ${code})`,
      `2. Create your account with your email and a password.`,
      `3. Put the app on your home screen and turn on notifications.`, ""
    ]),
    `The attached guide shows every step with pictures. You can also open it here: ${guide}`, "",
    creds ? `Keep this email private: the password is only for you.` : `The invite is personal and valid until ${fmtDate(inv.expiresAt)}.`, "",
    `See you on the court!`, `${S.me?.name || clubName()}`
  ].join("\n");
  let file = null;
  try {
    const res = await fetch(guide, { cache: "force-cache" });
    if (res.ok) file = new File([await res.blob()], `${appName()} - install guide.pdf`, { type: "application/pdf" });
  } catch (_) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ title: subject, text: body, files: [file] }); return; }
    catch (err) { if (err && err.name === "AbortError") return; }
  }
  location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  toast("Your email app opens with the invite. The install guide is included as a link.");

/* =========================================================
   INVITES — validate & redeem
   ========================================================= */
async function fetchInvite(raw) {
  const code = normCode(raw);
  if (code.length < 6) throw new Error("That code looks too short.");
  const snap = await getDoc(doc(db, "invites", code));
  if (!snap.exists()) throw new Error("Invite code not found.");
  const data = snap.data();
  const [label] = inviteStatus(data);
  if (label !== "Open") throw new Error(`This invite is ${label.toLowerCase()}. Ask for a new one.`);
  if (S.user && (data.usedBy || []).includes(S.user.uid)) throw new Error("You already used this invite.");
  return { code, data };
}
async function redeemInvite(code, inv, { createProfile, name = "" }) {
  const uid = S.user.uid;
  const self = inv.type !== "guardian";
  if (!createProfile && self && S.me?.memberId) throw new Error("Your account is already linked to a member profile.");
  const displayName = name.trim() || (self ? inv.memberName : "");
  if (createProfile && !displayName) throw new Error("Enter your name.");
  autoRedeemDone = true; // the local snapshot fires before the commit resolves
  const batch = writeBatch(db);
  batch.update(doc(db, "invites", code), { uses: increment(1), usedBy: arrayUnion(uid), lastUsedAt: serverTimestamp() });
  if (createProfile) {
    batch.set(doc(db, "users", uid), { name: displayName, email: S.user.email || "", phone: "", active: true,
      memberId: self ? inv.memberId : null, joinedWith: code, createdAt: serverTimestamp() });
  } else if (self) {
    batch.update(doc(db, "users", uid), { memberId: inv.memberId, lastInvite: code, updatedAt: serverTimestamp() });
  }
  if (self) batch.update(doc(db, "members", inv.memberId), { uid, lastInvite: code, updatedAt: serverTimestamp() });
  else batch.update(doc(db, "members", inv.memberId), { guardianUids: arrayUnion(uid), lastInvite: code, updatedAt: serverTimestamp() });
  await batch.commit();
  S.pendingInvite = "";
  if (location.search.includes("invite=")) history.replaceState(null, "", location.pathname);
  setTimeout(() => log(null, "Redeemed invite", { label: `${code} · ${describeInvite(inv)}` }), 2000);
}
let autoRedeemDone = false;
function maybeAutoRedeem() {
  if (autoRedeemDone || !S.pendingInvite || !isActive()) return;
  autoRedeemDone = true;
  const code = S.pendingInvite;
  S.pendingInvite = "";
  history.replaceState(null, "", location.pathname);
  setTimeout(() => redeemModal(code), 300);
}

const FORMS = {
  async result(d) {
    const e = eventById(d.eventId);
    if (!e || !canManageTeam(e.teamId)) throw new Error("You can't edit this result.");
    const both = hasNum(d.scoreFor) && hasNum(d.scoreAgainst);
    if (!both && (hasNum(d.scoreFor) || hasNum(d.scoreAgainst))) throw new Error("Enter both scores (or leave both empty).");
    const f = both ? Number(d.scoreFor) : null, a = both ? Number(d.scoreAgainst) : null;
    if (both && (![f, a].every((n) => Number.isInteger(n) && n >= 0 && n <= 300))) throw new Error("Scores must be whole numbers.");
    const batch = writeBatch(db);
    batch.update(doc(db, "events", e.id), { scoreFor: f, scoreAgainst: a, resultBy: S.user.uid, resultByName: S.me.name || "", resultAt: serverTimestamp(), updatedAt: serverTimestamp() });
    log(batch, both ? "Saved result" : "Cleared result", { label: both ? `${eventTitle(e)} · ${e.date} · ${f}–${a}` : `${eventTitle(e)} · ${e.date}` });
    await batch.commit();
    toast(both ? "Result saved" : "Result cleared");
  },
  async login(d) { await signInWithEmailAndPassword(auth, d.email.trim(), d.password); },
  async reset(d) {
    await sendPasswordResetEmail(auth, d.email.trim());
    toast("If that email has an account, a reset link is on its way. Check the spam folder too.");
    S.authMode = "login"; render();
  },
  async "join-check"(d) {
    const { code, data } = await fetchInvite(d.code);
    S.joinInvite = { code, data }; S.pendingInvite = code; render();
  },
  async join(d) {
    const { code, data } = S.joinInvite;
    if (data.type === "guardian" && !d.name?.trim()) throw new Error("Name is required.");
    await createUserWithEmailAndPassword(auth, d.email.trim(), d.password);
    S.user = auth.currentUser;
    S.busy = true; render();
    try { await redeemInvite(code, data, { createProfile: true, name: d.name || "" }); S.joinInvite = null; toast(`Welcome to ${clubName()}!`); }
    finally { S.busy = false; render(); }
  },
  async newpass(d) {
    if ((d.p1 || "").length < 6) throw new Error("The password must be at least 6 characters.");
    if (d.p1 !== d.p2) throw new Error("The two passwords are not the same.");
    try { await updatePassword(auth.currentUser, d.p1); }
    catch (err) {
      if (err?.code === "auth/requires-recent-login") { toast("For security, log in again with the temporary password, then choose your new one.", "error"); await signOut(auth); return; }
      throw err;
    }
    await updateDoc(doc(db, "users", S.user.uid), { mustChangePassword: false, updatedAt: serverTimestamp() });
    toast("Password saved. Welcome!");
  },
  async complete(d) {
    const { code, data } = await fetchInvite(d.code);
    S.busy = true; render();
    try { await redeemInvite(code, data, { createProfile: true, name: d.name || "" }); toast(`Welcome to ${clubName()}!`); }
    finally { S.busy = false; render(); }
  },
  async setup(d) {
    if (!d.firstName?.trim()) throw new Error("First name is required.");
    if (!S.user) { await createUserWithEmailAndPassword(auth, d.email.trim(), d.password); S.user = auth.currentUser; }
    S.busy = true; render();
    try {
      const uid = S.user.uid;
      const memberRef = doc(collection(db, "members"));
      const batch = writeBatch(db);
      batch.set(memberRef, newMemberData({ firstName: d.firstName.trim(), lastName: (d.lastName || "").trim(),
        roles: { player: false, coach: false, admin: true }, uid }));
      batch.set(doc(db, "users", uid), { name: `${d.firstName.trim()} ${(d.lastName || "").trim()}`.trim(),
        email: S.user.email || "", phone: "", active: true, memberId: memberRef.id, createdAt: serverTimestamp() });
      batch.set(doc(db, "settings", "app"), { clubName: "BB", appName: "BBapp", createdBy: uid, createdAt: serverTimestamp() });
      await batch.commit();
      toast("Admin account created.");
    } finally { S.busy = false; render(); }
  },
  async modal(d, form) {
    if (!S.modal?.onSubmit) return;
    form.querySelectorAll("input[type=checkbox][name]").forEach((c) => { d[c.name] = c.checked; });
    const result = await S.modal.onSubmit(d);
    if (result !== false && S.modal && $("#modal-root form") === form) closeModal();
  }
};
document.addEventListener("submit", async (e) => {
  const form = e.target;
  const name = form.dataset?.form;
  if (!name || !FORMS[name]) return;
  e.preventDefault();
  const btn = form.querySelector("[type=submit]");
  if (btn) btn.disabled = true;
  try {
    await FORMS[name](Object.fromEntries(new FormData(form)), form);
    form.querySelectorAll("[data-dirty]").forEach((x) => delete x.dataset.dirty);
  }
  catch (err) { console.warn(err); toast(errMsg(err), "error"); }
  finally { if (btn && document.contains(btn)) btn.disabled = false; }
});

  }
  const upcoming = list.filter((e) => eventEnd(e).getTime() >= now).sort((a, b) => eventStart(a) - eventStart(b));

/* ---------- game statistics listeners (open game / open team) ---------- */
let statSubs = [], statSubKey = "";
function syncStatsSubs() {
  if (!isActive()) { statSubs.forEach((u) => u()); statSubs = []; statSubKey = ""; return; }
  const e = S.eventId ? eventById(S.eventId) : null;
  const teamStats = S.tab === "teams" && S.teamId && S.teamTab === "stats" ? S.teamId : "";
  const key = `${e && e.type === "game" ? e.id : ""}|${teamStats}`;
  if (key === statSubKey) return;
  statSubKey = key;
  statSubs.forEach((u) => u());
  statSubs = [];
  S.gameStats = {};
  const add = (ref) => statSubs.push(onSnapshot(ref,
    (snap) => { const next = { ...S.gameStats }; snap.docs.forEach((d) => (next[d.id] = { id: d.id, ...d.data() })); S.gameStats = next; render(); },
    (err) => console.warn("[stats]", err.code, err.message)));
  if (e && e.type === "game") add(query(collection(db, "gameStats"), where("eventId", "==", e.id)));
  if (teamStats) add(query(collection(db, "gameStats"), where("teamId", "==", teamStats)));
}

/* ---------- attendance listeners: only for events on screen ---------- */
let attSubs = [], attKeyStr = "", logSub = null, logKeyStr = "";
function syncAttendanceSubs() {
  if (!isActive()) {
    if (attSubs.length || logSub) { attSubs.forEach((u) => u()); attSubs = []; attKeyStr = ""; if (logSub) logSub(); logSub = null; logKeyStr = ""; }
    return;
  }
  const ids = new Set();
  if (S.eventId) ids.add(S.eventId);
  const { upcoming } = visibleEvents("all");
  let pool = upcoming.filter(isMyEvent);
  if (S.tab === "calendar" && S.weekStart) {
    const from = S.weekStart, to = isoAdd(S.weekStart, 6);
    pool = [...calendarEvents().filter((e) => e.date >= from && e.date <= to), ...pool];
  }
  if (S.tab === "teams" && S.teamId) pool = [...S.events.filter((e) => e.teamId === S.teamId).slice(-40), ...pool];
  pool.slice(0, 60).forEach((e) => ids.add(e.id));
  const list = [...ids].sort();
  const key = list.join(",");
  if (key !== attKeyStr) {
    attKeyStr = key;
    attSubs.forEach((u) => u());
    attSubs = [];
    const chunks = [];
    for (let i = 0; i < list.length; i += 30) chunks.push(list.slice(i, i + 30));
    const results = chunks.map(() => null);
    chunks.forEach((chunk, idx) => {
      attSubs.push(onSnapshot(query(collection(db, "attendance"), where("eventId", "in", chunk)),
        (snap) => {
          results[idx] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          const next = {};
          // keep old data for chunks that have not answered yet (no flicker)
          Object.values(S.attendance).forEach((a) => { if (chunk.includes(a.eventId) === false && list.includes(a.eventId)) next[a.id] = a; });
          results.forEach((r) => (r || []).forEach((a) => { next[a.id] = a; }));

        (err) => { console.warn("[attendance]", err.code, err.message); if (!S.failedLists.includes("attendance")) { S.failedLists = [...S.failedLists, "attendance"]; render(); } }));
    });

    if (logSub) logSub();
    logSub = null;
    S.eventLog = [];

      logSub = onSnapshot(query(collection(db, "attendanceLog"), where("eventId", "==", lk)),
        (snap) => { S.eventLog = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => tsMillis(b.at) - tsMillis(a.at)); render(); },
        (err) => console.warn("[attendanceLog]", err.code, err.message));
    }
  }
}

  const teamOptions = S.teams.filter((t) => !season || t.seasonId === season.id);
  const all = calendarEvents();
  const from = S.weekStart, to = isoAdd(S.weekStart, 6);
  const week = all.filter((e) => e.date >= from && e.date <= to);
  const thisWeek = mondayOf(todayISO());
  const chip = (k, l) => `<button data-act="cal-type" data-type="${k}" class="${S.calType === k ? "on" : ""}">${l}</button>`;

  let html = `<div class="spread"><h2>Calendar</h2>${manageable.length ? `<button class="btn primary sm" data-act="event-new">+ New event</button>` : ""}</div>
    <div class="stack" style="margin:12px 0">
      <select data-change="cal-team" aria-label="Team">
        <option value="mine" ${S.calTeam === "mine" ? "selected" : ""}>My teams</option>
        <option value="all" ${S.calTeam === "all" ? "selected" : ""}>All teams</option>
        ${teamOptions.map((t) => `<option value="${t.id}" ${S.calTeam === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
      <div class="seg">${chip("all", "All")}${chip("practice", "Practices")}${chip("game", "Games")}</div>
      <div class="weeknav">
        <button class="btn sm" data-act="week-move" data-d="-7" aria-label="Previous week">‹</button>
        <div class="wk"><b>${esc(weekLabel(S.weekStart))}</b>${S.weekStart === thisWeek ? `<span class="badge accent">This week</span>` : ""}</div>
        <button class="btn sm" data-act="week-move" data-d="7" aria-label="Next week">›</button>
      </div>
      ${S.weekStart !== thisWeek ? `<button class="btn ghost sm" data-act="week-today">Back to this week</button>` : ""}
    </div>`;

  if (!week.length) {
    const next = all.find((e) => e.date > to);
    const prev = [...all].reverse().find((e) => e.date < from);
    html += `<div class="card empty">No ${S.calType === "game" ? "games" : S.calType === "practice" ? "practices" : "events"} this week.</div>
      <div class="row" style="margin-top:10px;justify-content:center">
        ${prev ? `<button class="btn sm" data-act="week-goto" data-date="${prev.date}">‹ ${esc(fmtDay(prev.date, { day: "numeric", month: "short" }))}</button>` : ""}
        ${next ? `<button class="btn sm" data-act="week-goto" data-date="${next.date}">Next: ${esc(fmtDay(next.date, { weekday: "short", day: "numeric", month: "short" }))} ›</button>` : ""}
      </div>`;
    return html;
  }
  let lastDay = "";
  html += `<div class="stack">`;
  week.forEach((e) => {
    if (e.date !== lastDay) {
      lastDay = e.date;
      html += `<div class="section-title" style="margin:10px 2px 0">${esc(fmtDay(e.date))}${e.date === todayISO() ? " · Today" : ""}</div>`;
    }
    html += eventCard(e);
  });
  html += `</div>`;
  return html;
}
function viewEventDetail(e) {

    <div class="spread" style="margin-top:6px;align-items:flex-start"><div>
      <h2>${esc(eventTitle(e))} ${cancelled ? `<span class="badge bad">Cancelled</span>` : ""}</h2>
      <div class="muted small">${esc(t?.name || "")} · ${e.type === "game" ? (e.homeAway === "away" ? "Away game" : "Home game") : "Practice"}</div></div>
      ${manage ? `<button class="btn sm" data-act="event-edit" data-id="${e.id}">Edit</button>` : ""}</div>
    <div class="card stack" style="margin-top:12px;gap:6px">
      <div><b>${esc(fmtDay(e.date))}</b></div>
      <div>${esc(e.startTime || "")}${e.endTime ? ` – ${esc(e.endTime)}` : ""}${e.type === "game" && e.meetTime ? ` · Meet at ${esc(e.meetTime)}` : ""}</div>
      ${eventPlace(e) ? `<div>${esc(eventPlace(e))}${venueById(e.venueId)?.address ? `<span class="small muted"> · ${esc(venueById(e.venueId).address)}</span>` : ""} ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" class="small">Map</a>` : ""}</div>` : ""}
      ${e.notes ? `<div class="small" style="white-space:pre-wrap">${esc(e.notes)}</div>` : ""}
      <div class="small muted">${isClosed(e) ? "Responses closed" : `Responses close ${esc(fmtDateTime(e.closesAt))}`}</div>

        <input type="hidden" name="eventId" value="${e.id}">

          <label class="f">${esc(us)}<input type="number" name="scoreFor" inputmode="numeric" min="0" max="300" value="${esc(hasNum(e.scoreFor) ? e.scoreFor : "")}"></label>
          <span class="score-dash">–</span>
          <label class="f">${esc(e.opponent || "Opponent")}<input type="number" name="scoreAgainst" inputmode="numeric" min="0" max="300" value="${esc(hasNum(e.scoreAgainst) ? e.scoreAgainst : "")}"></label>
        </div>
        <div class="spread">${resultBadge(e)}<button class="btn primary sm" type="submit">Save result</button></div>
      </form>`;
    } else {
      html += `<div class="card result-line big-result">${resultBadge(e)} ${hasResult(e) ? `<b>${esc(scoreLine(e))}</b>` : ""}</div>`;
    }
  }

  if (e.type === "game" && !cancelled) html += callUpSection(e, manage);

  if (!cancelled && !isPast(e)) {
    const out = notCalledUp(e);
    if (out.length) html += `<div class="notice" style="margin-top:12px">${out.map((m) => esc(m.firstName)).join(", ")} ${out.length > 1 ? "are" : "is"} not called up for this game.</div>`;
  }
  if (!cancelled && responders.length && !isPast(e)) {
    html += `<div class="section-title">Your response</div><div class="card stack">${responders.map((m) => {
      const a = attOf(e.id, m.id);
      return `<div><div class="small" style="font-weight:600">${esc(fullName(m))}</div>${respButtons(e, m)}
