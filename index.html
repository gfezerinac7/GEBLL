<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task and Project Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0_ROV4sjigkHj5yachpCuuAmoUtfsJoA",
            authDomain: "task-manager-5f5b3.firebaseapp.com",
            projectId: "task-manager-5f5b3",
            storageBucket: "task-manager-5f5b3.firebasestorage.app",
            messagingSenderId: "912477224199",
            appId: "1:912477224199:web:ca3071efacbb5994ff19a2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const secondaryApp = initializeApp(firebaseConfig, 'secondary');
        const secondaryAuth = getAuth(secondaryApp);

        window.firebaseDB = db;
        window.firebaseFns = { collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc };
        window.firebaseAuth = auth;
        window.firebaseAuthFns = { signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword };
        window.firebaseSecondaryAuth = secondaryAuth;
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header i {
            font-size: 32px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            background: #f9f9f9;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: #f0f0f0;
        }

        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .tab-btn i {
            font-size: 16px;
        }

        .content {
            padding: 30px 20px;
            display: none;
            min-height: 400px;
        }

        .content.active {
            display: block;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: #f0f4ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 11px 20px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
        }

        .btn-danger {
            background: #ff6b6b;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #51cf66;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-color: #2563eb;
        }

        .card.completed {
            opacity: 0.6;
            background: #f5f5f5;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card.completed .card-title {
            text-decoration: line-through;
            color: #999;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-high {
            background: #ffe0e0;
            color: #c92a2a;
        }

        .badge-medium {
            background: #fff3bf;
            color: #b08600;
        }

        .badge-low {
            background: #d3f9d8;
            color: #2f7e1f;
        }

        .badge-daily {
            background: #e7f5ff;
            color: #0066cc;
        }

        .badge-weekly {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-monthly {
            background: #fce4ec;
            color: #c2185b;
        }

        .badge-date {
            background: #f0f0f0;
            color: #666;
        }

        .card-meta {
            font-size: 13px;
            color: #666;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item i {
            color: #999;
        }

        .assignee-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .assignee-avatar {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #51cf66 0%, #40c057 100%);
            transition: width 0.3s;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 15px;
            display: block;
        }

        .empty-state p {
            font-size: 16px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .team-member:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .team-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .team-role {
            font-size: 12px;
            color: #999;
        }

        .team-actions {
            display: flex;
            gap: 8px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-box i.fa-tasks {
            font-size: 40px;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .login-box h2 {
            font-size: 22px;
            margin-bottom: 24px;
            color: #333;
        }

        .login-error {
            color: #c92a2a;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .login-error.active {
            display: block;
        }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.15);
            font-size: 13px;
            color: white;
        }

        .user-bar-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .role-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }

        .role-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .role-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .role-name.protected {
            color: #2563eb;
        }

        .module-checks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .module-check {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f5f5f5;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .module-check input {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .app-hidden {
            display: none !important;
        }

        .schedule-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }

        .view-switch {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            width: fit-content;
        }

        .view-btn {
            padding: 8px 14px;
            background: white;
            border: none;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        .view-btn.active {
            background: #2563eb;
            color: white;
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .date-nav .btn {
            padding: 8px 12px;
        }

        .schedule-range-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .schedule-grid-wrap {
            overflow-x: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
        }

        .schedule-grid {
            display: grid;
            min-width: 600px;
        }

        .sg-cell {
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 8px;
            font-size: 12px;
            min-height: 60px;
        }

        .sg-header {
            background: #f5f7ff;
            font-weight: 600;
            text-align: center;
            padding: 10px 6px;
            font-size: 12px;
            color: #333;
            position: sticky;
            top: 0;
        }

        .sg-loc-label {
            background: #f9f9f9;
            font-weight: 600;
            font-size: 12px;
            color: #333;
            display: flex;
            align-items: center;
            padding: 8px;
        }

        .sg-shift-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 5px 6px;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .sg-shift-time {
            font-weight: 600;
            color: #333;
        }

        .sg-shift-assignee {
            color: #2563eb;
            font-weight: 600;
        }

        .sg-shift-empty {
            color: #999;
            font-style: italic;
        }

        .sg-assign-btn {
            background: none;
            border: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 4px;
        }

        .sg-day-summary {
            cursor: pointer;
            padding: 10px 6px;
        }

        .sg-day-summary:hover {
            background: #f5f7ff;
        }

        .sg-summary-count {
            font-weight: 600;
            color: #333;
        }

        .sg-summary-unassigned {
            color: #c92a2a;
            font-size: 11px;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.2s;
        }

        .fab:hover {
            transform: scale(1.08);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 18px;
            color: #999;
            cursor: pointer;
            padding: 4px 8px;
        }

        .modal-close:hover {
            color: #333;
        }

        .task-add-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: 1px dashed #2563eb;
            color: #2563eb;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .task-add-btn:hover {
            background: #f0f4ff;
        }

        .project-tasks {
            margin-top: 12px;
            border-top: 0.5px solid #eee;
            padding-top: 12px;
        }

        .project-task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .project-task-item.completed span.pt-name {
            text-decoration: line-through;
            color: #999;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 12px 15px;
            }

            .card-header {
                flex-direction: column;
            }

            .content {
                padding: 20px 15px;
            }

            .form-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <i class="fas fa-tasks"></i>
            <h2>Task & Project Manager</h2>
            <div class="form-group" style="text-align:left;">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@company.com">
            </div>
            <div class="form-group" style="text-align:left;">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Your password">
            </div>
            <button class="btn" style="width:100%; justify-content:center;" onclick="doLogin()">
                <i class="fas fa-right-to-bracket"></i>
                Log in
            </button>
            <p class="login-error" id="loginError">Invalid email or password.</p>
        </div>
    </div>

    <div id="appContainer" class="container app-hidden">
        <div class="header">
            <h1>
                <i class="fas fa-tasks"></i>
                Task & Project Manager
            </h1>
        </div>

        <div class="user-bar">
            <div class="user-bar-info">
                <i class="fas fa-user-circle"></i>
                <span id="currentUserLabel">-</span>
            </div>
            <button class="logout-btn" onclick="doLogout()">
                <i class="fas fa-right-from-bracket"></i>
                Log out
            </button>
        </div>

        <div class="tabs" id="tabsBar">
            <button class="tab-btn active" data-module="shifts" onclick="switchTab('shifts')">
                <i class="fas fa-clock"></i>
                Shifts
            </button>
            <button class="tab-btn" data-module="locations" onclick="switchTab('locations')">
                <i class="fas fa-map-marker-alt"></i>
                Locations
            </button>
            <button class="tab-btn" data-module="schedule" onclick="switchTab('schedule')">
                <i class="fas fa-calendar-alt"></i>
                Schedule
            </button>
            <button class="tab-btn" data-module="tasks" onclick="switchTab('tasks')">
                <i class="fas fa-list-check"></i>
                Tasks
            </button>
            <button class="tab-btn" data-module="projects" onclick="switchTab('projects')">
                <i class="fas fa-folder"></i>
                Projects
            </button>
            <button class="tab-btn" data-module="team" onclick="switchTab('team')">
                <i class="fas fa-users"></i>
                Team
            </button>
            <button class="tab-btn" data-module="roles" onclick="switchTab('roles')">
                <i class="fas fa-user-shield"></i>
                Roles
            </button>

        </div>

        <!-- TAB TAREAS -->
        <div id="tasks" class="content">
            <div class="section-title">
                <i class="fas fa-tasks"></i>
                Active Tasks
            </div>
            <div id="taskList"></div>
        </div>

        <button class="fab" onclick="openTaskModal()" title="Add task">
            <i class="fas fa-plus"></i>
        </button>

        <div id="taskModalOverlay" class="modal-overlay" onclick="closeTaskModalOutside(event)">
            <div class="modal-box">
                <div class="modal-header">
                    <div class="section-title" style="margin-bottom:0;">
                        <i class="fas fa-plus-circle"></i>
                        New Task
                    </div>
                    <button class="modal-close" onclick="closeTaskModal()"><i class="fas fa-times"></i></button>
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="taskName" placeholder="Ex: Review client proposal">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="taskDesc" placeholder="Additional details..." rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Recurrence Type</label>
                        <select id="taskRecurrence">
                            <option value="once">Once</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>

    <script>
        const ADMIN_UID = 'Lx9yqGaSngS6GpidDgNKQQGdm9o2';
        const CORE_MODULES = [
            { key: 'tasks', label: 'Tasks' },
            { key: 'projects', label: 'Projects' },
            { key: 'team', label: 'Team' },
            { key: 'locations', label: 'Locations' },
            { key: 'shifts', label: 'Shifts' },
            { key: 'schedule', label: 'Schedule' }
        ];

        const state = {
            tasks: [],
            projects: [],
            team: [],
            roles: [],
            locations: [],
            shifts: [],
            assignments: []
        };

        let scheduleView = 'daily';
        let scheduleRefDate = new Date();
        let pendingAssign = null;

        const assigneeMap = {};

        let db, fns, auth, authFns;
        let unsubscribers = [];
        let currentUser = null;
        let currentMember = null;

        function initFirebaseSync() {
            db = window.firebaseDB;
            fns = window.firebaseFns;
            auth = window.firebaseAuth;
            authFns = window.firebaseAuthFns;

            authFns.onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    showApp();
                } else {
                    showLogin();
                }
            });
        }

        if (window.firebaseReady) {
            initFirebaseSync();
        } else {
            window.addEventListener('firebase-ready', initFirebaseSync);
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('app-hidden');
            document.getElementById('appContainer').classList.add('app-hidden');
            unsubscribers.forEach(u => u && u());
            unsubscribers = [];
        }

        async function showApp() {
            document.getElementById('loginScreen').classList.add('app-hidden');
            document.getElementById('appContainer').classList.remove('app-hidden');
            startDataSync();
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.classList.remove('active');

            if (!email || !password) {
                errorEl.textContent = 'Enter email and password.';
                errorEl.classList.add('active');
                return;
            }

            authFns.signInWithEmailAndPassword(auth, email, password)
                .catch(() => {
                    errorEl.textContent = 'Invalid email or password.';
                    errorEl.classList.add('active');
                });
        }

        function doLogout() {
            authFns.signOut(auth);
        }

        function startDataSync() {
            unsubscribers.forEach(u => u && u());

            const tasksCol = fns.collection(db, 'tasks');
            const unsubTasks = fns.onSnapshot(tasksCol, (snapshot) => {
                state.tasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTasks();
            });

            const projectsCol = fns.collection(db, 'projects');
            const unsubProjects = fns.onSnapshot(projectsCol, (snapshot) => {
                state.projects = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderProjects();
            });

            const teamCol = fns.collection(db, 'team');
            const unsubTeam = fns.onSnapshot(teamCol, (snapshot) => {
                state.team = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                Object.keys(assigneeMap).forEach(k => delete assigneeMap[k]);
                state.team.forEach(m => {
                    assigneeMap[m.id] = {
                        name: m.name,
                        role: m.role,
                        initials: m.name.split(' ').map(n => n[0]).join('').toUpperCase()
                    };
                });
                currentMember = state.team.find(m => m.authUid === currentUser.uid) || null;
                renderTeam();
                populateAssigneeSelects();
                applyRolePermissions();
                renderSchedule();
            });

            const rolesCol = fns.collection(db, 'roles');
            const unsubRoles = fns.onSnapshot(rolesCol, async (snapshot) => {
                state.roles = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                await ensureDefaultRoles();
                renderRoles();
                populateRoleSelect();
                applyRolePermissions();
            });

            const locationsCol = fns.collection(db, 'locations');
            const unsubLocations = fns.onSnapshot(locationsCol, (snapshot) => {
                state.locations = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLocations();
                populateLocationSelect();
                renderSchedule();
            });

            const shiftsCol = fns.collection(db, 'shifts');
            const unsubShifts = fns.onSnapshot(shiftsCol, (snapshot) => {
                state.shifts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderShifts();
                renderSchedule();
            });

            const assignmentsCol = fns.collection(db, 'assignments');
            const unsubAssignments = fns.onSnapshot(assignmentsCol, (snapshot) => {
                state.assignments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderSchedule();
            });

            unsubscribers = [unsubTasks, unsubProjects, unsubTeam, unsubRoles, unsubLocations, unsubShifts, unsubAssignments];
        }

        async function ensureDefaultRoles() {
            const defaults = [
                { name: 'Admin', modules: ['tasks', 'projects', 'team', 'locations', 'shifts', 'schedule', 'roles'], protected: true },
                { name: 'Lead', modules: ['tasks', 'projects', 'team', 'locations', 'shifts', 'schedule'], protected: false },
                { name: 'Member', modules: [], protected: false }
            ];
            for (const d of defaults) {
                const exists = state.roles.find(r => r.name === d.name);
                if (!exists) {
                    await fns.addDoc(fns.collection(db, 'roles'), { name: d.name, modules: d.modules, protected: d.protected || false });
                }
            }
        }

        function getUserRole() {
            if (currentUser && currentUser.uid === ADMIN_UID) {
                return { name: 'Admin', modules: ['tasks', 'projects', 'team', 'locations', 'shifts', 'schedule', 'roles'], protected: true };
            }
            if (!currentMember) return { name: 'Member', modules: [] };
            return state.roles.find(r => r.name === currentMember.role) || { name: currentMember.role, modules: [] };
        }

        function applyRolePermissions() {
            const role = getUserRole();
            const isAdmin = role.name === 'Admin';

            document.getElementById('currentUserLabel').textContent =
                (currentMember ? currentMember.name : (currentUser ? currentUser.email : '')) + ' (' + role.name + ')';

            document.querySelectorAll('#tabsBar .tab-btn').forEach(btn => {
                const mod = btn.getAttribute('data-module');
                const visible = isAdmin || (role.modules || []).includes(mod);
                btn.style.display = visible ? '' : 'none';
            });

            const activeBtn = document.querySelector('#tabsBar .tab-btn.active');
            if (activeBtn && activeBtn.style.display === 'none') {
                const firstVisible = document.querySelector('#tabsBar .tab-btn:not([style*="display: none"])');
                if (firstVisible) {
                    const mod = firstVisible.getAttribute('data-module');
                    switchTabProgrammatic(mod);
                }
            }
        }

        function switchTabProgrammatic(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('#tabsBar .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            const btn = document.querySelector(`#tabsBar .tab-btn[data-module="${tab}"]`);
            if (btn) btn.classList.add('active');
        }

        function populateAssigneeSelects() {
            const taskSelect = document.getElementById('taskAssignee');
            const projTaskSelect = document.getElementById('ptaskAssignee');

            const allOptions = '<option value="">Unassigned</option>' +
                state.team.map(m => `<option value="${m.id}">${m.name} (${m.role})</option>`).join('');

            const leadAdminOptions = '<option value="">Unassigned</option>' +
                state.team.filter(m => m.role === 'Lead' || m.role === 'Admin')
                    .map(m => `<option value="${m.id}">${m.name} (${m.role})</option>`).join('');

            if (taskSelect) taskSelect.innerHTML = allOptions;
            if (projTaskSelect) projTaskSelect.innerHTML = leadAdminOptions;
        }

        function populateRoleSelect() {
            const roleSelect = document.getElementById('memberRole');
            if (!roleSelect) return;
            const current = roleSelect.value;
            roleSelect.innerHTML = state.roles.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
            if (current && state.roles.some(r => r.name === current)) roleSelect.value = current;
        }

        function openTaskModal() {
            document.getElementById('taskModalOverlay').classList.add('active');
        }

        function closeTaskModal() {
            document.getElementById('taskModalOverlay').classList.remove('active');
        }

        function closeTaskModalOutside(e) {
            if (e.target.id === 'taskModalOverlay') closeTaskModal();
        }

        function openProjectTaskModal(projectId) {
            document.getElementById('ptaskProjectId').value = projectId;
            document.getElementById('projectTaskModalOverlay').classList.add('active');
        }

        function closeProjectTaskModal() {
            document.getElementById('projectTaskModalOverlay').classList.remove('active');
        }

        function closeProjectTaskModalOutside(e) {
            if (e.target.id === 'projectTaskModalOverlay') closeProjectTaskModal();
        }

        function switchTab(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const recurrence = document.getElementById('taskRecurrence').value;
            const date = document.getElementById('taskDate').value;
            const priority = document.getElementById('taskPriority').value;
            const assignee = document.getElementById('taskAssignee').value;

            if (!name) {
                alert('Please enter a task name');
                return;
            }

            fns.addDoc(fns.collection(db, 'tasks'), {
                name,
                desc,
                recurrence,
                date,
                priority,
                assignee,
                completed: false,
                createdAt: new Date().toLocaleDateString('en-US')
            });

            clearTaskForm();
            closeTaskModal();
        }

        function clearTaskForm() {
            document.getElementById('taskName').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskRecurrence').value = 'once';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskAssignee').value = '';
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) {
                fns.updateDoc(fns.doc(db, 'tasks', id), { completed: !task.completed });
            }
        }

        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                fns.deleteDoc(fns.doc(db, 'tasks', id));
            }
        }

        function addProject() {
            const name = document.getElementById('projectName').value.trim();
            const desc = document.getElementById('projectDesc').value.trim();
            const start = document.getElementById('projectStart').value;
            const end = document.getElementById('projectEnd').value;

            if (!name) {
                alert('Please enter a project name');
                return;
            }

            fns.addDoc(fns.collection(db, 'projects'), {
                name,
                desc,
                start,
                end,
                progress: 0,
                tasks: [],
                createdAt: new Date().toLocaleDateString('en-US')
            });

            clearProjectForm();
        }

        function clearProjectForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('projectDesc').value = '';
            document.getElementById('projectStart').value = '';
            document.getElementById('projectEnd').value = '';
        }

        function deleteProject(id) {
            if (confirm('Delete this project?')) {
                fns.deleteDoc(fns.doc(db, 'projects', id));
            }
        }

        function addProjectTask() {
            const projectId = document.getElementById('ptaskProjectId').value;
            const name = document.getElementById('ptaskName').value.trim();
            const desc = document.getElementById('ptaskDesc').value.trim();
            const date = document.getElementById('ptaskDate').value;
            const priority = document.getElementById('ptaskPriority').value;
            const assignee = document.getElementById('ptaskAssignee').value;

            if (!name) {
                alert('Please enter a task name');
                return;
            }

            const project = state.projects.find(p => p.id === projectId);
            if (!project) return;

            const newTask = {
                ptid: 'pt_' + Date.now(),
                name, desc, date, priority, assignee,
                completed: false
            };

            const updatedTasks = [...(project.tasks || []), newTask];
            fns.updateDoc(fns.doc(db, 'projects', projectId), { tasks: updatedTasks });

            document.getElementById('ptaskName').value = '';
            document.getElementById('ptaskDesc').value = '';
            document.getElementById('ptaskDate').value = '';
            document.getElementById('ptaskPriority').value = 'medium';
            document.getElementById('ptaskAssignee').value = '';
            closeProjectTaskModal();
        }

        function toggleProjectTask(projectId, ptid) {
            const project = state.projects.find(p => p.id === projectId);
            if (!project) return;
            const updatedTasks = (project.tasks || []).map(t =>
                t.ptid === ptid ? { ...t, completed: !t.completed } : t
            );
            fns.updateDoc(fns.doc(db, 'projects', projectId), { tasks: updatedTasks });
        }

        function deleteProjectTask(projectId, ptid) {
            const project = state.projects.find(p => p.id === projectId);
            if (!project) return;
            const updatedTasks = (project.tasks || []).filter(t => t.ptid !== ptid);
            fns.updateDoc(fns.doc(db, 'projects', projectId), { tasks: updatedTasks });
        }

        async function addTeamMember() {
            const name = document.getElementById('memberName').value.trim();
            const email = document.getElementById('memberEmail').value.trim();
            const password = document.getElementById('memberPassword').value;
            const role = document.getElementById('memberRole').value;

            if (!name) {
                alert('Please enter a name');
                return;
            }
            if (!email || !password) {
                alert('Email and a temporary password are required to create this member\'s login.');
                return;
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters.');
                return;
            }

            try {
                const cred = await authFns.createUserWithEmailAndPassword(window.firebaseSecondaryAuth, email, password);
                const newUid = cred.user.uid;
                await authFns.signOut(window.firebaseSecondaryAuth);

                await fns.addDoc(fns.collection(db, 'team'), {
                    name,
                    email,
                    role,
                    authUid: newUid,
                    joinDate: new Date().toLocaleDateString('en-US')
                });

                clearMemberForm();
            } catch (err) {
                alert('Could not create login: ' + (err.message || err));
            }
        }

        function clearMemberForm() {
            document.getElementById('memberName').value = '';
            document.getElementById('memberEmail').value = '';

        function createRole() {
            const nameInput = document.getElementById('newRoleName');
            const name = nameInput.value.trim();
            if (!name) {

                return;
            }
            if (state.roles.some(r => r.name.toLowerCase() === name.toLowerCase())) {
                alert('A role with that name already exists');
                return;
            }

            const checks = document.querySelectorAll('#newRoleModules input[type="checkbox"]');
            const modules = Array.from(checks).filter(c => c.checked).map(c => c.value);

            fns.addDoc(fns.collection(db, 'roles'), { name, modules, protected: false });

            nameInput.value = '';
            checks.forEach(c => c.checked = false);
        }

        function toggleRoleModule(roleId, moduleKey, checked) {
            const role = state.roles.find(r => r.id === roleId);
            if (!role) return;
            let modules = role.modules || [];
            if (checked) {
                if (!modules.includes(moduleKey)) modules = [...modules, moduleKey];
            } else {
                modules = modules.filter(m => m !== moduleKey);
            }
            fns.updateDoc(fns.doc(db, 'roles', roleId), { modules });
        }

        function deleteRole(roleId) {
            const role = state.roles.find(r => r.id === roleId);
            if (!role) return;
            if (role.protected) {
                alert('The Admin role cannot be deleted.');
                return;
            }
            if (state.team.some(m => m.role === role.name)) {
                alert('This role is assigned to one or more team members. Reassign them before deleting this role.');
                return;
            }
            if (confirm(`Delete role "${role.name}"?`)) {
                fns.deleteDoc(fns.doc(db, 'roles', roleId));
            }
        }

        function calcGrossMinutes(start, end) {
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            let mins = (eh * 60 + em) - (sh * 60 + sm);
            if (mins < 0) mins += 24 * 60;
            return mins;
        }

        function addShift() {
            const start = document.getElementById('shiftStart').value;
            const end = document.getElementById('shiftEnd').value;
            const locationId = document.getElementById('shiftLocation').value;

            if (!start || !end || !locationId) {
                alert('Please fill in start time, end time and location');
                return;
            }

            const grossMinutes = calcGrossMinutes(start, end);
            if (grossMinutes <= 0) {
                alert('End time must be after start time.');
                return;
            }

            fns.addDoc(fns.collection(db, 'shifts'), {
                start, end, locationId, grossMinutes
            });

            document.getElementById('shiftStart').value = '';
            document.getElementById('shiftEnd').value = '';
        }

        // ===== SCHEDULE (Fase C) =====

        function toDateKey(date) {
            const y = date.getFullYear();
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const d = date.getDate().toString().padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDayLabel(date) {
            return date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        function startOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function getScheduleDates() {
            const dates = [];
            if (scheduleView === 'daily') {
                dates.push(new Date(scheduleRefDate));
            } else if (scheduleView === 'weekly') {
                const start = startOfWeek(scheduleRefDate);
                for (let i = 0; i < 7; i++) {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    dates.push(d);
                }
            } else {
                const year = scheduleRefDate.getFullYear();
                const month = scheduleRefDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for (let i = 1; i <= daysInMonth; i++) {
                    dates.push(new Date(year, month, i));
                }
            }
            return dates;
        }

        function setScheduleView(view) {
            scheduleView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.view-btn[data-view="${view}"]`).classList.add('active');
            renderSchedule();
        }

        function navigateSchedule(dir) {
            const d = new Date(scheduleRefDate);
            if (scheduleView === 'daily') d.setDate(d.getDate() + dir);
            else if (scheduleView === 'weekly') d.setDate(d.getDate() + dir * 7);
            else d.setMonth(d.getMonth() + dir);
            scheduleRefDate = d;
            renderSchedule();
        }

        function updateScheduleRangeLabel(dates) {
            const label = document.getElementById('scheduleRangeLabel');
            if (dates.length === 1) {
                label.textContent = dates[0].toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            } else if (scheduleView === 'weekly') {
                label.textContent = `${dates[0].toLocaleDateString('en-US', { day: 'numeric', month: 'short' })} - ${dates[6].toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })}`;
            } else {
                label.textContent = scheduleRefDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }
        }

        function getAssignmentsForShiftDate(shiftId, dateKey) {
            return state.assignments.filter(a => a.shiftId === shiftId && a.dateKey === dateKey);
        }

        function getMemberDayMinutes(memberId, dateKey, excludeAssignmentId) {
            const dayAssignments = state.assignments.filter(a =>
                a.memberId === memberId && a.dateKey === dateKey && a.id !== excludeAssignmentId
            );
            let total = 0;
            dayAssignments.forEach(a => {
                const shift = state.shifts.find(s => s.id === a.shiftId);
                if (shift) total += shift.grossMinutes;
            });
            return total;
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            if (!grid) return;

            const dates = getScheduleDates();
            updateScheduleRangeLabel(dates);

            if (state.locations.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fas fa-map-marker-alt"></i><p>Create at least one location first.</p></div>`;
                grid.style.display = 'block';
                return;
            }

            const isMonthly = scheduleView === 'monthly';
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = `140px repeat(${dates.length}, minmax(${isMonthly ? '70px' : '150px'}, 1fr))`;

            let html = '<div class="sg-cell sg-header">Location</div>';
            dates.forEach(d => {
                html += `<div class="sg-cell sg-header">${isMonthly ? d.getDate() : formatDayLabel(d)}</div>`;
            });

            state.locations.forEach(loc => {
                html += `<div class="sg-cell sg-loc-label">${loc.name}</div>`;
                const locShifts = state.shifts.filter(s => s.locationId === loc.id);

                dates.forEach(d => {
                    const dateKey = toDateKey(d);
                    if (isMonthly) {
                        let assignedCount = 0;
                        let unassignedCount = 0;
                        locShifts.forEach(shift => {
                            const assigns = getAssignmentsForShiftDate(shift.id, dateKey);
                            if (assigns.length > 0) assignedCount += assigns.length;
                            else unassignedCount++;
                        });
                        html += `
                            <div class="sg-cell sg-day-summary" onclick="openDayDetail('${loc.id}','${dateKey}')">
                                <div class="sg-summary-count">${locShifts.length} shift${locShifts.length !== 1 ? 's' : ''}</div>
                                ${unassignedCount > 0 ? `<div class="sg-summary-unassigned">${unassignedCount} open</div>` : ''}
                            </div>
                        `;
                    } else {
                        if (locShifts.length === 0) {
                            html += `<div class="sg-cell"><span class="sg-shift-empty">No shifts</span></div>`;
                        } else {
                            let cellHtml = '<div class="sg-cell">';
                            locShifts.forEach(shift => {
                                const assigns = getAssignmentsForShiftDate(shift.id, dateKey);
                                if (assigns.length === 0) {
                                    cellHtml += `
                                        <div class="sg-shift-item">
                                            <div class="sg-shift-time">${shift.start}-${shift.end}</div>
                                            <button class="sg-assign-btn" onclick="openAssignModal('${shift.id}','${dateKey}')">
                                                <i class="fas fa-plus"></i> Assign
                                            </button>
                                        </div>
                                    `;
                                } else {
                                    assigns.forEach(a => {
                                        const m = assigneeMap[a.memberId];
                                        cellHtml += `
                                            <div class="sg-shift-item">
                                                <div class="sg-shift-time">${shift.start}-${shift.end}</div>
                                                <div class="sg-shift-assignee" onclick="openAssignModal('${shift.id}','${dateKey}','${a.id}')" style="cursor:pointer;">
                                                    ${m ? m.name : 'Unknown'} ${a.sickLeave ? '(Sick)' : ''}
                                                </div>
                                            </div>
                                        `;
                                    });
                                }
                            });
                            cellHtml += '</div>';
                            html += cellHtml;
                        }
                    }
                });
            });

            grid.innerHTML = html;
        }

        function openAssignModal(shiftId, dateKey, assignmentId) {
            const shift = state.shifts.find(s => s.id === shiftId);
            if (!shift) return;
            const loc = state.locations.find(l => l.id === shift.locationId);

            pendingAssign = { shiftId, dateKey, assignmentId: assignmentId || null };

            document.getElementById('assignModalSubtitle').textContent =
                `${loc ? loc.name : ''} — ${shift.start} to ${shift.end} on ${dateKey}`;

            const eligible = state.team.filter(m => m.role === 'Lead' || m.role === 'Admin');
            const select = document.getElementById('assignMemberSelect');
            select.innerHTML = eligible.map(m => `<option value="${m.id}">${m.name} (${m.role})</option>`).join('')
                || '<option value="">No Lead/Admin members available</option>';

            const unassignBtn = document.getElementById('unassignBtn');
            if (assignmentId) {
                const existing = state.assignments.find(a => a.id === assignmentId);
                if (existing) select.value = existing.memberId;
                unassignBtn.style.display = 'block';
            } else {
                unassignBtn.style.display = 'none';
            }

            document.getElementById('assignWarning').style.display = 'none';
            document.getElementById('assignModalOverlay').classList.add('active');
        }

        function closeAssignModal() {
            document.getElementById('assignModalOverlay').classList.remove('active');
            pendingAssign = null;
        }

        function closeAssignModalOutside(e) {
            if (e.target.id === 'assignModalOverlay') closeAssignModal();
        }

        async function confirmAssign() {
            if (!pendingAssign) return;
            const memberId = document.getElementById('assignMemberSelect').value;
            const warningEl = document.getElementById('assignWarning');

            if (!memberId) {
                warningEl.textContent = 'Select a team member.';
                warningEl.style.display = 'block';
                return;
            }

            const shift = state.shifts.find(s => s.id === pendingAssign.shiftId);
            if (!shift) return;

            const existingMinutes = getMemberDayMinutes(memberId, pendingAssign.dateKey, pendingAssign.assignmentId);
            const totalMinutes = existingMinutes + shift.grossMinutes;
            const netMinutes = totalMinutes - 30;

            if (netMinutes > 475) {
                const m = assigneeMap[memberId];
                warningEl.textContent = `${m ? m.name : 'This member'} would have ${formatMinutes(netMinutes)} net on ${pendingAssign.dateKey}, exceeding the 7h55 daily limit.`;
                warningEl.style.display = 'block';
                return;
            }

            if (pendingAssign.assignmentId) {
                await fns.updateDoc(fns.doc(db, 'assignments', pendingAssign.assignmentId), { memberId });
            } else {
                await fns.addDoc(fns.collection(db, 'assignments'), {
                    shiftId: pendingAssign.shiftId,
                    dateKey: pendingAssign.dateKey,
                    memberId,
                    sickLeave: false
                });
            }

            closeAssignModal();
        }

        async function confirmUnassign() {
            if (!pendingAssign || !pendingAssign.assignmentId) return;
            if (confirm('Remove this assignment?')) {
                await fns.deleteDoc(fns.doc(db, 'assignments', pendingAssign.assignmentId));
                closeAssignModal();
            }
        }

        function openDayDetail(locationId, dateKey) {
            const loc = state.locations.find(l => l.id === locationId);
            document.getElementById('dayDetailTitle').textContent = `${loc ? loc.name : ''} — ${dateKey}`;

            const locShifts = state.shifts.filter(s => s.locationId === locationId);
            const body = document.getElementById('dayDetailBody');

            if (locShifts.length === 0) {
                body.innerHTML = `<p style="color:#999; font-size:13px;">No shifts for this location.</p>`;
            } else {
                body.innerHTML = locShifts.map(shift => {
                    const assigns = getAssignmentsForShiftDate(shift.id, dateKey);
                    const assignedHtml = assigns.length === 0
                        ? `<button class="task-add-btn" onclick="closeDayDetailModal(); openAssignModal('${shift.id}','${dateKey}')"><i class="fas fa-plus"></i> Assign</button>`
                        : assigns.map(a => {
                            const m = assigneeMap[a.memberId];
                            return `<div class="sg-shift-assignee" style="cursor:pointer; margin-top:4px;" onclick="closeDayDetailModal(); openAssignModal('${shift.id}','${dateKey}','${a.id}')">${m ? m.name : 'Unknown'} ${a.sickLeave ? '(Sick)' : ''}</div>`;
                        }).join('');

                    return `
                        <div class="project-task-item" style="flex-direction:column; align-items:flex-start;">
                            <div class="sg-shift-time">${shift.start} - ${shift.end}</div>
                            ${assignedHtml}
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('dayDetailModalOverlay').classList.add('active');
        }

        function closeDayDetailModal() {
            document.getElementById('dayDetailModalOverlay').classList.remove('active');
        }

        function closeDayDetailModalOutside(e) {
            if (e.target.id === 'dayDetailModalOverlay') closeDayDetailModal();
        }

    </script>
</body>
</html>
