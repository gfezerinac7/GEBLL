<style>
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface-2:#eef3fa; --text:#0f1b2d; --muted:#5b6b80;
  --line:#dce4ef; --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e6eeff; --accent-dark:#163fae;
  --ok:#1f7a4a; --ok-soft:#e2f4ea; --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --radius:14px; --shadow:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.05);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px}
h3{font-size:17px}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header & nav */
.top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand .names{min-width:0}
.brand .app{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .club{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:#fff;color:var(--accent);font-weight:700;cursor:pointer}
main{padding:16px 0 calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex}
.nav button{flex:1;border:none;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 8px}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 2px 8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:22px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item.tap{cursor:pointer}
.item .main{flex:1;min-width:0}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.num{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.num.none{background:var(--surface-2);color:var(--muted);font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat .label{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.team-pick{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.team-pick:first-of-type{border-top:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.auth .card{padding:20px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .app{font-size:26px;font-weight:800;margin-top:8px}
.notice{padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);font-size:14px}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}

/* modal */
#modal-root .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#modal-root .sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:640px){#modal-root .sheet{left:50%;right:auto;bottom:auto;top:6vh;transform:translateX(-50%);width:600px;border-radius:18px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.code{font:700 28px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-align:center;padding:14px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px}
.linkbox{word-break:break-all;font-size:13px;background:var(--surface-2);padding:10px;border-radius:10px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.error{background:var(--bad);color:#fff}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.role input{width:20px;height:20px;accent-color:var(--accent)}
.role:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.role:has(input:disabled){opacity:.6;cursor:default}
.subsection{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.subsection[hidden]{display:none}
.sub-title{font-weight:700;color:var(--accent);font-size:14px}
.event{padding:0;overflow:hidden}
.event.cancelled .title{text-decoration:line-through;color:var(--muted)}
.event-head{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.datebox{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:6px 0;line-height:1.05}
.datebox.game{background:var(--accent);color:#fff}
.datebox .dow,.datebox .mon{font-size:11px;font-weight:600;text-transform:uppercase}
.datebox .dnum{font-size:20px;font-weight:800}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.counts .c{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.counts .c.ok{background:var(--ok-soft);color:var(--ok)}.counts .c.warn{background:var(--warn-soft);color:var(--warn)}.counts .c.bad{background:var(--bad-soft);color:var(--bad)}
.big-counts .c{font-size:13px;padding:4px 10px}
.responder{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.resp,.valid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.resp button,.valid button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
.valid{margin-top:8px}.valid button{padding:6px 2px;font-size:12px}
.resp button.on.ok,.valid button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.resp button.on.warn,.valid button.on.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.resp button.on.bad,.valid button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.valid button.on{background:var(--muted);border-color:var(--muted);color:#fff}
.resp button:disabled{opacity:.5;cursor:default}
.badge.as-btn{border:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:4px 10px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.wd input{width:20px;height:20px;accent-color:var(--accent)}
[hidden]{display:none !important}
.result-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.big-result{font-size:17px;margin-top:0}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.score-grid input{font-size:22px;font-weight:700;text-align:center}
.score-dash{font-size:22px;font-weight:700;padding-bottom:10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--text)}
.bad-text{color:var(--bad) !important;font-weight:700}
.pick{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:none}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pick .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .num{width:34px;height:34px;font-size:14px}
.others summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.news.pinned{border-color:var(--accent)}
.news-body{white-space:pre-wrap;margin-top:6px;font-size:14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--surface-2)}
table.tbl th.l,table.tbl td.l{text-align:left}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tr.us{background:var(--accent-soft);font-weight:700}
table.box input{width:58px;padding:6px;text-align:center;font-size:15px}
table.box .calc{display:inline-block;min-width:34px;font-weight:700;color:var(--accent)}
.weeknav{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.weeknav .wk{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";
import { getFirestore, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch,
  serverTimestamp, increment, arrayUnion, arrayRemove, deleteField, query, where, orderBy, limit, Timestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* =========================================================
   CONFIG
   ========================================================= */
const VERSION = "v-0.10";
const firebaseConfig = {
  apiKey: "AIzaSyCHXUL5qlZZ_me6S8oGzMMHqcBs0cV43eY",
  authDomain: "bbapp-6b10e.firebaseapp.com",
  projectId: "bbapp-6b10e",
  storageBucket: "bbapp-6b10e.firebasestorage.app",
  messagingSenderId: "431787724186",
  appId: "1:431787724186:web:450f61927ae01bfc8f7e23"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const VAPID_KEY = "BI5CmUYsogmRwMySXmpVcyHAD-avPyilWSzF6w1V98vH46Cy-tR3HQFP3idIx5WFgNlc2aGMjEAyQflR-wOUL1I";

const POSITIONS = [["PG","Point Guard"],["SG","Shooting Guard"],["SF","Small Forward"],["PF","Power Forward"],["C","Center"]];
const CATEGORIES = ["U8","U10","U12","U14","U16","U18","U20","Senior","Veterans"];
const GENDERS = ["Men","Women","Mixed"];
const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

/* =========================================================
   STATE
   ========================================================= */
const S = {
  settings: null, settingsLoaded: false, dbError: null,
  user: null, me: null, meLoaded: false, meSynced: false, pushOn: false,
  myMember: null, memberSynced: true, busy: false,
  seasons: [], teams: [], members: [], users: [], invites: [], logs: [], failedLists: [],
  events: [], venues: [], absences: [], attendance: {}, eventLog: [], calTeam: "mine", calView: "upcoming", calType: "all", weekStart: null, eventId: null,
  announcements: [], tournaments: [], tournamentGames: [], gameStats: {}, referees: [], volunteers: [], fees: [], feePayments: [], myPayments: {},
  pubEvents: [], pubStandings: [], pubNews: [], pubTeams: [], pubSite: null, loaded: {}, pubStatus: null,
  statSettings: null, teamTab: "roster", tournamentId: null, statMode: "total", feeId: null,
  tab: "home", teamId: null, seasonFilter: null, memberSearch: "", memberScope: "mine", roleFilter: "all",
  authMode: "login", joinInvite: null, showOldInvites: false,
  pendingInvite: normCode(new URLSearchParams(location.search).get("invite") || ""),
  modal: null
};
if (S.pendingInvite) S.authMode = "join";

let meUnsub = null, memberUnsub = null, memberListenId = null, memberRetries = 0;
let dataSubs = {}, dataKey = "";

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function normCode(c) { return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function appName() { return S.settings?.appName || "BBapp"; }
function clubName() { return S.settings?.clubName || "BB"; }
function fullName(m) { return `${m?.firstName || ""} ${m?.lastName || ""}`.trim() || "Unnamed"; }
function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?"; }
function byId(list, id) { return list.find((x) => x.id === id); }
const teamById = (id) => byId(S.teams, id);
const seasonById = (id) => byId(S.seasons, id);
const userById = (id) => byId(S.users, id);
const memberById = (id) => byId(S.members, id);
const activeSeason = () => S.seasons.find((s) => s.active);
const hasNum = (v) => v !== undefined && v !== null && v !== "";
function tsMillis(t) { return t?.toMillis ? t.toMillis() : (typeof t === "number" ? t : 0); }
function fmtDate(t) { const ms = tsMillis(t); return ms ? new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function fmtDateTime(t) { const ms = tsMillis(t); return ms ? new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—"; }
function sortMembers(list) { return [...list].sort((a, b) => (a.lastName || "").localeCompare(b.lastName || "") || (a.firstName || "").localeCompare(b.firstName || "")); }
function sortTeams(list) { return [...list].sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true })); }
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const roles = (m) => m?.roles || {};

/* ---------- my permissions (mirrors firestore.rules) ---------- */
const isActive = () => !!(S.me && S.me.active);
const myRoles = () => (isActive() && S.myMember && S.myMember.uid === S.user?.uid ? roles(S.myMember) : {});
const isAdmin = () => isActive() && (S.me.isAdmin === true || myRoles().admin === true);
const coachOf = () => (myRoles().coach ? S.myMember.coachTeamIds || [] : []);
const isCoach = () => coachOf().length > 0;
const isStaff = () => isAdmin() || isCoach();
const canManageTeam = (tid) => isAdmin() || coachOf().includes(tid);
// coaches can only edit player-only members of their own teams
const canEditMember = (m) => isAdmin() || (isCoach() && !roles(m).coach && !roles(m).admin && coachOf().includes(m.playerTeamId));

function toast(msg, type = "") {
  const box = $("#toast");
  while (box.children.length >= 2) box.firstElementChild.remove();
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), type === "error" ? 6000 : 3000);
}
function errMsg(err) {
  const map = {
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "Wrong email or password.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/email-already-in-use": "This email already has an account. Log in, then use “Redeem invite code” in your profile.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
    "auth/network-request-failed": "No connection. Check your internet.",
    "permission-denied": "You don't have permission to do that.",
    "unavailable": "No connection to the database. Try again."
  };
  return map[err?.code] || err?.message || String(err);
}
function log(batch, action, details = {}) {
  if (!S.user || !isActive()) return;
  const ref = doc(collection(db, "auditLog"));
  const data = { action, details, byUid: S.user.uid, byName: S.me?.name || "", at: serverTimestamp() };
  if (batch) batch.set(ref, data);

let subsGen = 0;
function syncDataSubs() {
  // Wait until the server has confirmed my own profile and roles, otherwise the
  // rules still see the old state and reject the listeners.
  if (S.user && S.me && (!S.meSynced || !S.memberSynced)) return;
  const key = `${S.user?.uid || ""}|${isActive()}|${isStaff()}|${isAdmin()}|${coachOf().join(",")}`;
  if (key === dataKey) return;
  dataKey = key;
  const gen = ++subsGen;
  Object.values(dataSubs).forEach((u) => u && u());
  dataSubs = {};
  S.failedLists = [];
  S.loaded = {}; S.pubEvents = []; S.pubStandings = []; S.pubNews = []; S.pubTeams = []; S.pubSite = null; S.pubStatus = null;
  if (!isActive()) { S.seasons = []; S.teams = []; S.members = []; S.users = []; S.invites = []; S.logs = []; S.events = []; S.venues = []; S.absences = []; S.attendance = {}; S.announcements = []; S.tournaments = []; S.tournamentGames = []; S.gameStats = {}; S.referees = []; S.volunteers = []; S.fees = []; S.feePayments = []; S.myPayments = {}; return; }
  if (!isStaff()) { S.users = []; S.invites = []; }
  if (!isAdmin()) S.logs = [];
  // Each list retries on its own; a failing list never clears the others (no flicker).
  const listen = (name, makeRef, setter) => {
    let tries = 0;
    const start = () => onSnapshot(makeRef(),
      (snap) => {
        tries = 0;
        S.failedLists = (S.failedLists || []).filter((n) => n !== name);
        setter(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        if (!snap.metadata?.fromCache) S.loaded[name] = true;
        schedulePublish();
        render();
      },
      (err) => {
        console.warn(`[${name}]`, err.code, err.message);
        if (gen !== subsGen) return;
        if (err.code === "permission-denied" && tries < 3) {
          tries++;
          setTimeout(() => { if (gen === subsGen) dataSubs[name] = start(); }, 1500 * tries);
        } else if (!(S.failedLists || []).includes(name)) {
          S.failedLists = [...(S.failedLists || []), name];
          render();
        }
      });
    dataSubs[name] = start();
  };
  listen("seasons", () => collection(db, "seasons"), (v) => {
    S.seasons = v.sort((a, b) => String(b.startDate || "").localeCompare(String(a.startDate || "")));
    if (S.seasonFilter === null && S.seasons.length) S.seasonFilter = activeSeason()?.id || "all";
  });
  listen("teams", () => collection(db, "teams"), (v) => (S.teams = sortTeams(v)));
  listen("members", () => collection(db, "members"), (v) => (S.members = sortMembers(v)));
  listen("venues", () => collection(db, "venues"), (v) => (S.venues = v.sort((a, b) => (b.isHome ? 1 : 0) - (a.isHome ? 1 : 0) || (a.name || "").localeCompare(b.name || ""))));
  listen("events", () => query(collection(db, "events"), where("date", ">=", isoDaysAgo(200))), (v) => (S.events = v));
  listen("unavailability", () => query(collection(db, "absences"), where("to", ">=", isoDaysAgo(200))), (v) => (S.absences = v));
  listen("announcements", () => query(collection(db, "announcements"), orderBy("createdAt", "desc"), limit(100)), (v) => (S.announcements = v));
  listen("tournaments", () => collection(db, "tournaments"), (v) => (S.tournaments = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
  listen("tournament results", () => collection(db, "tournamentGames"), (v) => (S.tournamentGames = v));
  listen("referees", () => collection(db, "referees"), (v) => (S.referees = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
  listen("volunteers", () => collection(db, "volunteers"), (v) => (S.volunteers = v));
  listen("fees", () => collection(db, "fees"), (v) => (S.fees = v.sort((a, b) => String(b.dueDate || "").localeCompare(String(a.dueDate || "")))));
  if (isStaff()) listen("fee payments", () => collection(db, "feePayments"), (v) => (S.feePayments = v));
  if (isStaff()) {
    listen("users", () => collection(db, "users"), (v) => (S.users = v.sort((a, b) => (a.name || "").localeCompare(b.name || ""))));
    listen("invites", () => collection(db, "invites"), (v) => (S.invites = v.sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt))));
  }
  // v-0.10: staff keep the public website copies (public_*) in sync
  if (isStaff()) {
    listen("public events", () => query(collection(db, "public_events"), where("date", ">=", isoDaysAgo(PUB_DAYS))), (v) => (S.pubEvents = v));
    listen("public standings", () => collection(db, "public_standings"), (v) => (S.pubStandings = v));
    listen("public news", () => collection(db, "public_news"), (v) => (S.pubNews = v));
  }
  if (isAdmin()) {
    listen("public teams", () => collection(db, "public_teams"), (v) => (S.pubTeams = v));
    listen("public site", () => collection(db, "public_site"), (v) => (S.pubSite = v.find((x) => x.id === "main") || null));
  }
  if (isAdmin()) listen("activity log", () => query(collection(db, "auditLog"), orderBy("at", "desc"), limit(50)), (v) => (S.logs = v));
}

const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
const pushState = () => {
  if (!("Notification" in window) || !navigator.serviceWorker) return "unsupported";
  if (isIOS() && !isStandalone()) return "ios-home-screen";
  if (Notification.permission === "denied") return "blocked";
  if (Notification.permission === "granted") return S.pushOn ? "on" : "granted";

let messaging = null, swReg = null, pushInit = false;
async function initPush() {

    if (!(await isSupported().catch(() => false))) return;
    swReg = await navigator.serviceWorker.register("firebase-messaging-sw.js", { scope: "./" });
    messaging = getMessaging(fbApp);
    onMessage(messaging, (payload) => {
      const d = payload.data || payload.notification || {};
      toast(`${d.title || "BBapp"}${d.body ? ` — ${d.body}` : ""}`);
    });
    if (Notification.permission === "granted") enablePush(true);
  } catch (err) { console.warn("[push]", err); }
}
async function enablePush(silent = false) {
  try {
    if (!messaging) { if (!silent) toast("This browser can't do notifications.", "error"); return; }
    if (isIOS() && !isStandalone()) { if (!silent) toast("On iPhone, add BBapp to your Home Screen first.", "error"); return; }
    const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (perm !== "granted") { if (!silent) toast("Notifications are blocked. Allow them in your browser settings.", "error"); render(); return; }
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if (!token) { if (!silent) toast("Could not get a notification token.", "error"); return; }
    await setDoc(doc(db, "pushTokens", token), { uid: S.user.uid, name: S.me?.name || "",
      ua: (navigator.userAgent || "").slice(0, 180), updatedAt: serverTimestamp() }, { merge: true });
    S.pushOn = true;
    if (!silent) toast("Notifications are on for this device.");
    render();
  } catch (err) { console.warn("[push]", err); if (!silent) toast(errMsg(err), "error"); }
}
/** Queue a notification. The Cloud Function resolves who gets it and sends it. */
function queuePush(batch, { title, body, url = "", tag = "", teamIds = [], memberIds = [], uids = [], everyone = false, reason = "" }) {
  if (!S.user) return;

    reason, excludeUid: S.user.uid, status: "pending", createdBy: S.user.uid, createdByName: S.me?.name || "", createdAt: serverTimestamp() };
  const ref = doc(collection(db, "pushQueue"));

let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderNow(); });
}
function renderNow() {
  document.title = appName();
  const root = $("#app");
  const active = document.activeElement;
  const focusId = active && active.id && root.contains(active) ? active.id : null;
  const caret = focusId && "selectionStart" in active ? active.selectionStart : null;
  let html;
  if (S.busy || !S.settingsLoaded || (S.user && !S.meLoaded)) html = `<div class="spinner"></div>`;
  else if (S.dbError && !S.settings) html = viewDbError();
  else if (!S.settings) html = viewSetup();
  else if (!S.user) html = viewAuth();
  else if (!S.me) html = viewCompleteProfile();
  else if (!S.me.active) html = viewDisabled();
  else html = viewShell();
  // keep what the user is typing in on-page forms when live data re-renders the page
  const keep = [];
  root.querySelectorAll("form[data-form] [data-dirty]").forEach((el) => {
    if (el.name) keep.push([el.form.dataset.form, el.form.elements.eventId?.value || "", el.name, el.value]);
  });
  root.innerHTML = html;
  keep.forEach(([f, id, n, v]) => {
    const form = [...root.querySelectorAll(`form[data-form="${f}"]`)].find((x) => (x.elements.eventId?.value || "") === id);
    const el = form?.elements[n];
    if (el && "value" in el) { el.value = v; el.dataset.dirty = "1"; }
  });
  syncAttendanceSubs();
  syncStatsSubs();
  loadMyPayments();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret !== null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (_) {} } }
  }
}

function viewDisabled() {

/* ---------- app shell ---------- */
function viewShell() {
  const tabs = [["home", "Home"], ["calendar", "Calendar"], ["teams", "Teams"]];

  if (isAdmin()) tabs.push(["admin", "Admin"]);
  if (!tabs.some((t) => t[0] === S.tab) && S.tab !== "news") S.tab = "home";
  const views = { home: viewHome, news: viewNews, calendar: viewCalendar, teams: viewTeams, members: viewMembers, admin: viewAdmin };
  return `
  <header class="top"><div class="wrap">
    <div class="brand">${BALL(34, true)}<div class="names"><div class="app">${esc(appName())}</div><div class="club">${esc(clubName())}</div></div></div>

  </div></header>
  <main><div class="wrap">${rulesBanner()}${views[S.tab]()}${footer()}</div></main>
  <nav class="nav"><div class="wrap">${tabs.map(([k, l]) => `<button data-act="tab" data-tab="${k}" class="${S.tab === k || (k === "home" && S.tab === "news") ? "on" : ""}">${ICONS[k]}<span>${l}</span></button>`).join("")}</div></nav>`;

function rulesBanner() {
  const f = S.failedLists || [];

function myBadges() {
  const r = myRoles(), b = [];
  if (isAdmin()) b.push(`<span class="badge accent">Admin</span>`);
  if (r.coach) b.push(`<span class="badge accent">Coach</span>`);
  if (r.player) b.push(`<span class="badge ok">Player</span>`);
  if (S.members.some((m) => (m.guardianUids || []).includes(S.user.uid))) b.push(`<span class="badge ok">Parent</span>`);

}
function memberItem(m, { tapAct = "member-edit", showNumberFor = null } = {}) {
  const editable = canEditMember(m);
  const numBox = showNumberFor
    ? `<div class="num ${hasNum(m.number) ? "" : "none"}">${hasNum(m.number) ? esc(m.number) : "–"}</div>`
    : `<div class="num none">${esc(initials(fullName(m)))}</div>`;
  const staffBadges = isStaff() ? `
    ${m.uid ? `<span class="badge ok">Account</span>` : ""}
    ${(m.guardianUids || []).length ? `<span class="badge ok">${plural(m.guardianUids.length, "parent")}</span>` : ""}
    ${!m.uid && !(m.guardianUids || []).length ? `<span class="badge warn">No account</span>` : ""}
    ${m.isMinor ? `<span class="badge">U18</span>` : ""}` : "";
  const absNow = showNumberFor && typeof absenceFor === "function" ? absenceFor(m.id, todayISO()) : null;
  const lines = showNumberFor
    ? [[m.pos1, m.pos2].filter(Boolean).join(" / ") || "No position"]

  return `<div class="item ${editable ? "tap" : ""}" ${editable ? `data-act="${tapAct}" data-id="${m.id}"` : ""}>

/* ---------- Home ---------- */
function viewHome() {
  const uid = S.user.uid;
  const mine = S.myMember && S.myMember.uid === uid ? memberById(S.myMember.id) || S.myMember : null;
  const children = S.members.filter((m) => (m.guardianUids || []).includes(uid));
  const coached = S.teams.filter((t) => coachOf().includes(t.id));
  const season = activeSeason();
  let html = `<div class="stack"><div><h2>Hi, ${esc((S.me.name || "").split(" ")[0] || "there")}</h2>
    <div class="row" style="margin-top:6px">${myBadges()}</div></div>`;
  if (isAdmin()) {
    html += `<div class="stats">
      <div class="card stat"><div class="label">Active season</div><div class="big">${esc(season?.name || "None")}</div></div>
      <div class="card stat"><div class="label">Teams</div><div class="big">${S.teams.filter((t) => !season || t.seasonId === season.id).length}</div></div>
      <div class="card stat"><div class="label">Players</div><div class="big">${S.members.filter((m) => roles(m).player).length}</div></div>
      <div class="card stat"><div class="label">Coaches</div><div class="big">${S.members.filter((m) => roles(m).coach).length}</div></div>
    </div>`;

  html += homeNewsSection();
  html += homeCalendarSection();
  html += homeVolunteerSection();
  html += homeFeeSection();

  if (mine) {
    html += `<div class="section-title">My profile</div><div class="list">${memberItem(mine)}</div>`;
  }
  if (children.length) {
    html += `<div class="section-title">My children</div><div class="list">${children.map((m) => memberItem(m)).join("")}</div>`;
  }
  if (coached.length) {
    html += `<div class="section-title">Teams I coach</div><div class="list">${coached.map(teamItem).join("")}</div>`;

function openModal({ title, body, submitLabel = "Save", onSubmit = null, danger = "" }) {

      </form></div>`;
  document.body.style.overflow = "hidden";
}
function closeModal() { S.modal = null; $("#modal-root").innerHTML = ""; document.body.style.overflow = ""; }

function seasonModal(s) {
  openModal({
    title: s ? "Edit season" : "New season",
    body: `<label class="f">Name<input type="text" name="name" value="${esc(s?.name || "")}" placeholder="2026/27" required></label>
      <div class="grid2"><label class="f">Start<input type="date" name="startDate" value="${esc(s?.startDate || "")}"></label>
      <label class="f">End<input type="date" name="endDate" value="${esc(s?.endDate || "")}"></label></div>
      ${s ? "" : `<label class="check"><input type="checkbox" name="active" ${S.seasons.length ? "" : "checked"}> Make this the active season</label>`}`,
    danger: s && !S.teams.some((t) => t.seasonId === s.id) ? `<button type="button" class="btn danger" data-act="season-delete" data-id="${s.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      if (!d.name?.trim()) throw new Error("Name is required.");
      const batch = writeBatch(db);
      const ref = s ? doc(db, "seasons", s.id) : doc(collection(db, "seasons"));
      const data = { name: d.name.trim(), startDate: d.startDate || "", endDate: d.endDate || "", updatedAt: serverTimestamp() };
      if (s) batch.update(ref, data);
      else {
        batch.set(ref, { ...data, active: !!d.active, createdAt: serverTimestamp() });
        if (d.active) { S.seasons.filter((x) => x.active).forEach((x) => batch.update(doc(db, "seasons", x.id), { active: false })); S.seasonFilter = ref.id; }
      }
      log(batch, s ? "Edited season" : "Created season", { label: data.name });
      await batch.commit();
      toast("Season saved");
    }
  });
}

function teamModal(t) {
  if (!S.seasons.length) { toast("Create a season first (Admin tab).", "error"); return; }
  const season = t?.seasonId || activeSeason()?.id || S.seasons[0]?.id || "";
  openModal({

/* ---------- the member form (Player / Coach / Admin) ---------- */
function memberModal(m, preset = {}) {
  const admin = isAdmin();
  const year = new Date().getFullYear();
  const r = m ? { ...roles(m) } : { player: !!preset.player, coach: !!preset.coach, admin: false };
  if (!admin) r.player = true; // coaches can only create/edit players
  const season = activeSeason();
  const teamsForSelect = S.teams.filter((t) => (admin || coachOf().includes(t.id)) &&
    (!season || t.seasonId === season.id || t.id === m?.playerTeamId || t.id === preset.teamId));
  const coachTeamsList = S.teams.filter((t) => !season || t.seasonId === season.id || (m?.coachTeamIds || []).includes(t.id));

/* =========================================================
   INVITES — validate & redeem
   ========================================================= */
async function fetchInvite(raw) {
  const code = normCode(raw);
  if (code.length < 6) throw new Error("That code looks too short.");
  const snap = await getDoc(doc(db, "invites", code));
  if (!snap.exists()) throw new Error("Invite code not found.");
  const data = snap.data();
  const [label] = inviteStatus(data);
  if (label !== "Open") throw new Error(`This invite is ${label.toLowerCase()}. Ask for a new one.`);
  if (S.user && (data.usedBy || []).includes(S.user.uid)) throw new Error("You already used this invite.");
  return { code, data };
}
async function redeemInvite(code, inv, { createProfile, name = "" }) {
  const uid = S.user.uid;
  const self = inv.type !== "guardian";
  if (!createProfile && self && S.me?.memberId) throw new Error("Your account is already linked to a member profile.");
  const displayName = name.trim() || (self ? inv.memberName : "");
  if (createProfile && !displayName) throw new Error("Enter your name.");
  autoRedeemDone = true; // the local snapshot fires before the commit resolves
  const batch = writeBatch(db);
  batch.update(doc(db, "invites", code), { uses: increment(1), usedBy: arrayUnion(uid), lastUsedAt: serverTimestamp() });
  if (createProfile) {
    batch.set(doc(db, "users", uid), { name: displayName, email: S.user.email || "", phone: "", active: true,
      memberId: self ? inv.memberId : null, joinedWith: code, createdAt: serverTimestamp() });
  } else if (self) {
    batch.update(doc(db, "users", uid), { memberId: inv.memberId, lastInvite: code, updatedAt: serverTimestamp() });
  }
  if (self) batch.update(doc(db, "members", inv.memberId), { uid, lastInvite: code, updatedAt: serverTimestamp() });
  else batch.update(doc(db, "members", inv.memberId), { guardianUids: arrayUnion(uid), lastInvite: code, updatedAt: serverTimestamp() });
  await batch.commit();
  S.pendingInvite = "";
  if (location.search.includes("invite=")) history.replaceState(null, "", location.pathname);
  setTimeout(() => log(null, "Redeemed invite", { label: `${code} · ${describeInvite(inv)}` }), 2000);
}
let autoRedeemDone = false;
function maybeAutoRedeem() {
  if (autoRedeemDone || !S.pendingInvite || !isActive()) return;
  autoRedeemDone = true;
  const code = S.pendingInvite;
  S.pendingInvite = "";
  history.replaceState(null, "", location.pathname);
  setTimeout(() => redeemModal(code), 300);
}

/* =========================================================
   FORM HANDLERS
   ========================================================= */
const FORMS = {
  async result(d) {
    const e = eventById(d.eventId);
    if (!e || !canManageTeam(e.teamId)) throw new Error("You can't edit this result.");
    const both = hasNum(d.scoreFor) && hasNum(d.scoreAgainst);
    if (!both && (hasNum(d.scoreFor) || hasNum(d.scoreAgainst))) throw new Error("Enter both scores (or leave both empty).");
    const f = both ? Number(d.scoreFor) : null, a = both ? Number(d.scoreAgainst) : null;
    if (both && (![f, a].every((n) => Number.isInteger(n) && n >= 0 && n <= 300))) throw new Error("Scores must be whole numbers.");
    const batch = writeBatch(db);
    batch.update(doc(db, "events", e.id), { scoreFor: f, scoreAgainst: a, resultBy: S.user.uid, resultByName: S.me.name || "", resultAt: serverTimestamp(), updatedAt: serverTimestamp() });
    log(batch, both ? "Saved result" : "Cleared result", { label: both ? `${eventTitle(e)} · ${e.date} · ${f}–${a}` : `${eventTitle(e)} · ${e.date}` });
    await batch.commit();
    toast(both ? "Result saved" : "Result cleared");
  },
  async login(d) { await signInWithEmailAndPassword(auth, d.email.trim(), d.password); },
  async reset(d) {
    await sendPasswordResetEmail(auth, d.email.trim());
    toast("If that email has an account, a reset link is on its way.");
    S.authMode = "login"; render();
  },
  async "join-check"(d) {
    const { code, data } = await fetchInvite(d.code);
    S.joinInvite = { code, data }; S.pendingInvite = code; render();
  },
  async join(d) {
    const { code, data } = S.joinInvite;
    if (data.type === "guardian" && !d.name?.trim()) throw new Error("Name is required.");
    await createUserWithEmailAndPassword(auth, d.email.trim(), d.password);
    S.user = auth.currentUser;
    S.busy = true; render();
    try { await redeemInvite(code, data, { createProfile: true, name: d.name || "" }); S.joinInvite = null; toast(`Welcome to ${clubName()}!`); }
    finally { S.busy = false; render(); }
  },
  async complete(d) {
    const { code, data } = await fetchInvite(d.code);
    S.busy = true; render();
    try { await redeemInvite(code, data, { createProfile: true, name: d.name || "" }); toast(`Welcome to ${clubName()}!`); }
    finally { S.busy = false; render(); }
  },
  async setup(d) {
    if (!d.firstName?.trim()) throw new Error("First name is required.");
    if (!S.user) { await createUserWithEmailAndPassword(auth, d.email.trim(), d.password); S.user = auth.currentUser; }
    S.busy = true; render();
    try {
      const uid = S.user.uid;
      const memberRef = doc(collection(db, "members"));
      const batch = writeBatch(db);
      batch.set(memberRef, newMemberData({ firstName: d.firstName.trim(), lastName: (d.lastName || "").trim(),
        roles: { player: false, coach: false, admin: true }, uid }));
      batch.set(doc(db, "users", uid), { name: `${d.firstName.trim()} ${(d.lastName || "").trim()}`.trim(),
        email: S.user.email || "", phone: "", active: true, memberId: memberRef.id, createdAt: serverTimestamp() });
      batch.set(doc(db, "settings", "app"), { clubName: "BB", appName: "BBapp", createdBy: uid, createdAt: serverTimestamp() });
      await batch.commit();
      toast("Admin account created.");
    } finally { S.busy = false; render(); }

let statSubs = [], statSubKey = "";
function syncStatsSubs() {
  if (!isActive()) { statSubs.forEach((u) => u()); statSubs = []; statSubKey = ""; return; }
  const e = S.eventId ? eventById(S.eventId) : null;
  const teamStats = S.tab === "teams" && S.teamId && S.teamTab === "stats" ? S.teamId : "";
  const key = `${e && e.type === "game" ? e.id : ""}|${teamStats}`;
  if (key === statSubKey) return;

    (err) => console.warn("[stats]", err.code, err.message)));
  if (e && e.type === "game") add(query(collection(db, "gameStats"), where("eventId", "==", e.id)));

/* ---------- attendance listeners: only for events on screen ---------- */

function syncAttendanceSubs() {

    return;
  }
  const ids = new Set();
  if (S.eventId) ids.add(S.eventId);
  const { upcoming } = visibleEvents("all");
  let pool = upcoming.filter(isMyEvent);
  if (S.tab === "calendar" && S.weekStart) {
    const from = S.weekStart, to = isoAdd(S.weekStart, 6);
    pool = [...calendarEvents().filter((e) => e.date >= from && e.date <= to), ...pool];
  }
  if (S.tab === "teams" && S.teamId) pool = [...S.events.filter((e) => e.teamId === S.teamId).slice(-40), ...pool];
  pool.slice(0, 60).forEach((e) => ids.add(e.id));

  const key = list.join(",");

    attKeyStr = key;
    attSubs.forEach((u) => u());

    for (let i = 0; i < list.length; i += 30) chunks.push(list.slice(i, i + 30));

  let html = `<div class="spread"><h2>Calendar</h2>${manageable.length ? `<button class="btn primary sm" data-act="event-new">+ New event</button>` : ""}</div>
    <div class="stack" style="margin:12px 0">
      <select data-change="cal-team" aria-label="Team">
        <option value="mine" ${S.calTeam === "mine" ? "selected" : ""}>My teams</option>
        <option value="all" ${S.calTeam === "all" ? "selected" : ""}>All teams</option>
        ${teamOptions.map((t) => `<option value="${t.id}" ${S.calTeam === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
      <div class="seg">${chip("all", "All")}${chip("practice", "Practices")}${chip("game", "Games")}</div>
      <div class="weeknav">
        <button class="btn sm" data-act="week-move" data-d="-7" aria-label="Previous week">‹</button>
        <div class="wk"><b>${esc(weekLabel(S.weekStart))}</b>${S.weekStart === thisWeek ? `<span class="badge accent">This week</span>` : ""}</div>
        <button class="btn sm" data-act="week-move" data-d="7" aria-label="Next week">›</button>
      </div>
      ${S.weekStart !== thisWeek ? `<button class="btn ghost sm" data-act="week-today">Back to this week</button>` : ""}
    </div>`;

  if (!week.length) {
    const next = all.find((e) => e.date > to);
    const prev = [...all].reverse().find((e) => e.date < from);
    html += `<div class="card empty">No ${S.calType === "game" ? "games" : S.calType === "practice" ? "practices" : "events"} this week.</div>
      <div class="row" style="margin-top:10px;justify-content:center">
        ${prev ? `<button class="btn sm" data-act="week-goto" data-date="${prev.date}">‹ ${esc(fmtDay(prev.date, { day: "numeric", month: "short" }))}</button>` : ""}
        ${next ? `<button class="btn sm" data-act="week-goto" data-date="${next.date}">Next: ${esc(fmtDay(next.date, { weekday: "short", day: "numeric", month: "short" }))} ›</button>` : ""}
      </div>`;
    return html;
  }
  let lastDay = "";
  html += `<div class="stack">`;
  week.forEach((e) => {
    if (e.date !== lastDay) {
      lastDay = e.date;
      html += `<div class="section-title" style="margin:10px 2px 0">${esc(fmtDay(e.date))}${e.date === todayISO() ? " · Today" : ""}</div>`;
    }
    html += eventCard(e);
  });
  html += `</div>`;
  return html;
}

            : a?.validated ? `<div class="small">Coach: <span class="badge ${VALIDATIONS[a.validated][1]}">${VALIDATIONS[a.validated][0]}</span></div>` : ""}
        </div></div>`;
    }).join("")}</div>`;
  } else html += `<div class="card empty">No players on ${esc(t?.name || "this team")} yet.</div>`;

  }

    html += S.eventLog.length ? `<div class="list">${S.eventLog.map((l) => {
      const m = memberById(l.memberId);
      const val = l.action === "validation" ? (VALIDATIONS[l.value]?.[0] || "cleared") : (RESPONSES[l.value]?.[0] || l.value);

        <div class="small muted">${esc(fmtDateTime(l.at))}</div></div></div>`;
    }).join("")}</div>` : `<div class="card empty">No changes yet.</div>`;
    html += `<div class="stack" style="margin-top:20px">
      <button class="btn block" data-act="event-cancel" data-id="${e.id}">${cancelled ? "Restore event" : "Cancel event"}</button>
      <button class="btn danger block" data-act="event-delete" data-id="${e.id}">Delete event</button>
      ${e.seriesId ? `<button class="btn danger block" data-act="event-delete-series" data-id="${e.id}">Delete this and following in series</button>` : ""}

/* Home: next events + unavailability */
function homeCalendarSection() {
  const ids = myTeamIds();
  const next = visibleEvents("all").upcoming.filter(isMyEvent).slice(0, 4);
  const linked = linkedMembers().filter((m) => roles(m).player);
  const today = todayISO();
  const abs = S.absences.filter((a) => a.to >= today && (linked.some((m) => m.id === a.memberId) || (isStaff() && canManageTeam(a.teamId))))
    .sort((a, b) => a.from.localeCompare(b.from));
  let html = "";
  if (ids.length || next.length) {
    html += `<div class="section-title spread"><span>Next events</span><button class="btn ghost sm" data-act="tab" data-tab="calendar">See all ›</button></div>`;
    html += next.length ? `<div class="stack">${next.map((e) => eventCard(e)).join("")}</div>` : `<div class="card empty">No upcoming events.</div>`;
  }
  if (linked.length || isStaff()) {
    html += `<div class="section-title spread"><span>Unavailability</span><button class="btn sm" data-act="absence-new">+ Report</button></div>`;
    html += abs.length ? `<div class="list">${abs.map((a) => {
      const m = memberById(a.memberId);
      const canEdit = linked.some((x) => x.id === a.memberId) || canManageTeam(a.teamId);
      return `<div class="item"><div class="main"><div class="title">${esc(m ? fullName(m) : "?")} <span class="badge warn">${esc(ABSENCE_TYPES[a.type] || a.type)}</span></div>
        <div class="small muted">${esc(fmtDay(a.from, { day: "numeric", month: "short" }))} → ${esc(fmtDay(a.to, { day: "numeric", month: "short" }))}${a.note ? ` · ${esc(a.note)}` : ""}</div></div>
        ${canEdit ? `<button class="btn sm danger" data-act="absence-delete" data-id="${a.id}">Remove</button>` : ""}</div>`;
    }).join("")}</div>` : `<div class="card empty">Nobody marked unavailable.</div>`;
  }
  return html;
}

/* ---------- modals ---------- */
function eventModal(e) {
  const manageable = S.teams.filter((t) => canManageTeam(t.id) && (!activeSeason() || t.seasonId === activeSeason().id || t.id === e?.teamId));
  if (!manageable.length) { toast("Create a team first.", "error"); return; }
  const type = e?.type || "practice";
  const defTeam = e?.teamId || (S.calTeam !== "mine" && S.calTeam !== "all" && canManageTeam(S.calTeam) ? S.calTeam : manageable[0].id);
  const closeH = e ? Math.round((tsMillis(e.startsAt) - tsMillis(e.closesAt)) / 36e5) : 2;
  const defVenue = e ? e.venueId : (type === "game" ? homeVenue()?.id : null);
  openModal({
    title: e ? "Edit event" : "New event",
    body: `<div class="grid2">
        <label class="f">Type<select name="type" id="ev-type"><option value="practice" ${type === "practice" ? "selected" : ""}>Practice</option><option value="game" ${type === "game" ? "selected" : ""}>Game</option></select></label>
        <label class="f">Team<select name="teamId">${manageable.map((t) => `<option value="${t.id}" ${defTeam === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label></div>
      <div class="subsection" data-ev="game" ${type === "game" ? "" : "hidden"}>
        ${(() => { const trs = tournamentsFor(defTeam); return trs.length ? `<label class="f">Counts for<select name="tournamentId" id="ev-tournament"><option value="">No tournament</option>${trs.map((x) => `<option value="${x.id}" ${e?.tournamentId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="f">Opponent from the tournament<select name="opponentKey" id="ev-opp-key"><option value="">Type the name below</option>${trs.flatMap((x) => (x.entries || []).filter((en) => en.key !== US).map((en) => `<option value="${x.id}|${en.key}" ${e?.tournamentId === x.id && e?.opponentKey === en.key ? "selected" : ""}>${esc(en.name)}</option>`)).join("")}</select></label>` : ""; })()}
        <div class="grid2"><label class="f">Opponent<input type="text" name="opponent" id="ev-opponent" value="${esc(e?.opponent || "")}"></label>
          <label class="f">Home / away<select name="homeAway"><option value="home" ${e?.homeAway !== "away" ? "selected" : ""}>Home</option><option value="away" ${e?.homeAway === "away" ? "selected" : ""}>Away</option></select></label></div>
        <label class="f">Meet time<input type="time" name="meetTime" value="${esc(e?.meetTime || "")}"></label>
      </div>
      <div class="subsection" data-ev="practice" ${type === "practice" ? "" : "hidden"}>
        <label class="f">Title (optional)<input type="text" name="title" value="${esc(e?.title || "")}" placeholder="Practice"></label>
      </div>
      <label class="f">Date<input type="date" name="date" id="ev-date" value="${esc(e?.date || todayISO())}" required></label>
      <div class="grid2"><label class="f">Start<input type="time" name="startTime" value="${esc(e?.startTime || "18:00")}" required></label>
        <label class="f">End<input type="time" name="endTime" value="${esc(e?.endTime || "19:30")}"></label></div>
      <label class="f">Venue<select name="venueId" id="ev-venue">
        ${S.venues.map((v) => `<option value="${v.id}" ${defVenue === v.id ? "selected" : ""}>${esc(v.name)}${v.isHome ? " (Home)" : ""}</option>`).join("")}
        <option value="" ${e && !e.venueId ? "selected" : ""}>Other location…</option></select></label>
      <label class="f" data-ev="location" ${S.venues.length && (!e || e.venueId) ? "hidden" : ""}>Location<input type="text" name="location" value="${esc(e?.location || "")}" placeholder="Address or hall name"></label>
      <label class="f">Responses close<select name="closeHours">${CLOSE_OPTIONS.map(([h, l]) => `<option value="${h}" ${closeH === h ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">Notes<textarea name="notes" rows="2">${esc(e?.notes || "")}</textarea></label>
      ${e ? (e.seriesId ? `<label class="check"><input type="checkbox" name="applySeries"> Apply time, venue and notes to the following events in this series</label>` : "") : `
      <label class="check"><input type="checkbox" name="repeat" id="ev-repeat"> Repeat every week</label>
      <div class="subsection" data-ev="repeat" hidden>
        <div class="weekdays">${WEEKDAYS.map(([v, l]) => `<label class="wd"><input type="checkbox" name="wd_${v}"><span>${l}</span></label>`).join("")}</div>
        <label class="f">Until<input type="date" name="until" value="${esc(activeSeason()?.endDate || "")}"></label>
      </div>`}`,
    onSubmit: async (d) => {
      const team = teamById(d.teamId);
      if (!d.date || !d.startTime) throw new Error("Date and start time are required.");
      if (d.endTime && d.endTime <= d.startTime) throw new Error("End time must be after start time.");
      if (d.type === "game" && !d.opponent?.trim()) throw new Error("Enter the opponent.");
      if (!d.venueId && !d.location?.trim()) throw new Error("Choose a venue or enter a location.");
      const closeHours = Number(d.closeHours) || 0;
      let tournamentId = null, opponentKey = null;
      if (d.type === "game" && d.opponentKey) {
        const [tid, key] = String(d.opponentKey).split("|");
        tournamentId = tid; opponentKey = key;
      } else if (d.type === "game" && d.tournamentId) tournamentId = d.tournamentId;
      const base = {
        tournamentId, opponentKey,
        type: d.type, teamId: d.teamId, seasonId: team?.seasonId || "", title: d.type === "practice" ? (d.title || "").trim() : "",
        opponent: d.type === "game" ? d.opponent.trim() : "", homeAway: d.type === "game" ? d.homeAway : "", meetTime: d.type === "game" ? (d.meetTime || "") : "",
        startTime: d.startTime, endTime: d.endTime || "", venueId: d.venueId || null, location: d.venueId ? "" : (d.location || "").trim(),
        notes: (d.notes || "").trim(), updatedAt: serverTimestamp()
      };
      const timing = (date) => {
        const start = new Date(`${date}T${d.startTime}`);
        return { date, startsAt: Timestamp.fromDate(start), closesAt: Timestamp.fromMillis(start.getTime() - closeHours * 36e5) };
      };
      const batch = writeBatch(db);
      if (e) {
        batch.update(doc(db, "events", e.id), { ...base, ...timing(d.date) });
        if (e.date !== d.date || e.startTime !== d.startTime || (e.venueId || null) !== (d.venueId || null)) {
          queuePush(batch, { title: "Event changed",
            body: `${eventTitle({ ...e, ...base })} · now ${fmtDay(d.date, { weekday: "short", day: "numeric", month: "short" })} ${d.startTime}`,
            teamIds: [d.teamId], tag: `moved_${e.id}`, reason: "event-changed" });
        }
        let n = 1;
        if (d.applySeries && e.seriesId) {
          S.events.filter((x) => x.seriesId === e.seriesId && x.id !== e.id && x.date > e.date).forEach((x) => {
            const { type, teamId, seasonId, title, opponent, homeAway, meetTime, date, ...shared } = { ...base, date: x.date };
            batch.update(doc(db, "events", x.id), { ...shared, ...timing(x.date) });
            n++;
          });
        }
        log(batch, "Edited event", { label: `${eventTitle({ ...e, ...base })} · ${d.date}${n > 1 ? ` (+${n - 1} in series)` : ""}` });
        await batch.commit();
        toast(n > 1 ? `${n} events updated` : "Event saved");
        return;
      }
      let dates = [d.date];
      let seriesId = null;
      if (d.repeat) {
        const days = WEEKDAYS.map(([v]) => v).filter((v) => d[`wd_${v}`]);
        if (!days.length) days.push(String(new Date(`${d.date}T12:00`).getDay()));
        if (!d.until || d.until < d.date) throw new Error("Choose an “Until” date after the start date.");
        dates = [];
        const cur = new Date(`${d.date}T12:00`), end = new Date(`${d.until}T12:00`);
        while (cur <= end) { if (days.includes(String(cur.getDay()))) dates.push(localISO(cur)); cur.setDate(cur.getDate() + 1); }
        if (!dates.length) throw new Error("No dates match those weekdays.");
        if (dates.length > 200) throw new Error("That is more than 200 events. Choose an earlier “Until” date.");
        seriesId = doc(collection(db, "events")).id;
      }
      dates.forEach((date) => {
        batch.set(doc(collection(db, "events")), { ...base, ...timing(date), seriesId, status: "scheduled",
          createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp() });
      });
      log(batch, dates.length > 1 ? "Created recurring events" : "Created event", { label: `${eventTitle(base)} · ${team?.name} · ${dates[0]}${dates.length > 1 ? ` (${dates.length} events)` : ""}` });
      await batch.commit();
      toast(dates.length > 1 ? `${dates.length} events created` : "Event created");
    }
  });
  const root = $("#modal-root");
  const show = (k, on) => { const el = root.querySelector(`[data-ev="${k}"]`); if (el) el.hidden = !on; };
  $("#ev-type")?.addEventListener("change", (ev) => {
    show("game", ev.target.value === "game"); show("practice", ev.target.value === "practice");
    // new games start at the home venue (can still be changed)
    if (!e && ev.target.value === "game" && homeVenue()) { $("#ev-venue").value = homeVenue().id; show("location", false); }
  });
  $("#ev-venue")?.addEventListener("change", (ev) => show("location", !ev.target.value));
  $("#ev-opp-key")?.addEventListener("change", (ev) => {
    const label = ev.target.selectedOptions[0]?.textContent || "";
    const [tid] = String(ev.target.value || "").split("|");
    if (ev.target.value) { $("#ev-opponent").value = label; const t = $("#ev-tournament"); if (t) t.value = tid; }
  });
  $("#ev-repeat")?.addEventListener("change", (ev) => {
    show("repeat", ev.target.checked);
    if (ev.target.checked) {
      const wd = String(new Date(`${$("#ev-date").value}T12:00`).getDay());
      const any = root.querySelectorAll('.weekdays input:checked').length;
      if (!any) { const box = root.querySelector(`input[name="wd_${wd}"]`); if (box) box.checked = true; }
    }
  });
}

async function saveResponse(e, m, response, reason = "") {
  const batch = writeBatch(db);
  batch.set(doc(db, "attendance", attKey(e.id, m.id)), {
    eventId: e.id, memberId: m.id, teamId: e.teamId,
    response, reason: reason.trim(), respondedBy: S.user.uid, respondedByName: S.me.name || "", respondedAt: serverTimestamp()
  }, { merge: true });
  batch.set(doc(collection(db, "attendanceLog")), {
    eventId: e.id, memberId: m.id, teamId: e.teamId, action: "response", value: response, reason: reason.trim(),
    byUid: S.user.uid, byName: S.me.name || "", at: serverTimestamp()
  });
  await batch.commit();
}
function reasonModal(e, m, response) {
  openModal({
    title: `${RESPONSES[response][0]} · ${fullName(m)}`,
    body: `<div class="small muted">${esc(eventTitle(e))} · ${esc(fmtDay(e.date, { weekday: "short", day: "numeric", month: "short" }))} ${esc(e.startTime)}</div>
      <label class="f">${response === "late" ? "How late? / note" : "Reason"} (optional)<input type="text" name="reason" id="resp-reason" maxlength="140" value="${esc(attOf(e.id, m.id)?.reason || "")}"></label>`,
    submitLabel: "Save",
    onSubmit: async (d) => { await saveResponse(e, m, response, d.reason || ""); toast("Response saved"); }
  });
  setTimeout(() => $("#resp-reason")?.focus(), 50);
}
function respondForModal(e, m) {
  const a = attOf(e.id, m.id);
  openModal({
    title: `Response for ${fullName(m)}`,
    body: `<div class="small muted">Set on behalf of the player. It is saved in the log with your name.</div>
      <label class="f">Response<select name="response">${Object.entries(RESPONSES).map(([k, [l]]) => `<option value="${k}" ${a?.response === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">Note (optional)<input type="text" name="reason" maxlength="140" value="${esc(a?.reason || "")}"></label>`,
    onSubmit: async (d) => { await saveResponse(e, m, d.response, d.reason || ""); toast("Response saved"); }
  });
}
async function saveValidation(e, memberIds, value) {
  const batch = writeBatch(db);
  memberIds.forEach((mid) => {
    batch.set(doc(db, "attendance", attKey(e.id, mid)), {
      eventId: e.id, memberId: mid, teamId: e.teamId,
      validated: value, validatedBy: S.user.uid, validatedByName: S.me.name || "", validatedAt: serverTimestamp()
    }, { merge: true });
    batch.set(doc(collection(db, "attendanceLog")), {
      eventId: e.id, memberId: mid, teamId: e.teamId, action: "validation", value: value || "", reason: "",
      byUid: S.user.uid, byName: S.me.name || "", at: serverTimestamp()
    });
  });
  await batch.commit();
}

function absenceModal() {
  const linked = linkedMembers().filter((m) => roles(m).player);
  const staffMembers = S.members.filter((m) => roles(m).player && m.playerTeamId && canManageTeam(m.playerTeamId));
  const options = sortMembers([...new Map([...linked, ...staffMembers].map((m) => [m.id, m])).values()]);
  if (!options.length) { toast("No players you can report for.", "error"); return; }
  openModal({
    title: "Report unavailability",
    body: `<label class="f">Player<select name="memberId">${options.map((m) => `<option value="${m.id}">${esc(fullName(m))}</option>`).join("")}</select></label>
      <label class="f">Reason<select name="type">${Object.entries(ABSENCE_TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label>
      <div class="grid2"><label class="f">From<input type="date" name="from" value="${todayISO()}" required></label>
        <label class="f">To<input type="date" name="to" value="${todayISO()}" required></label></div>
      <label class="f">Note (optional)<input type="text" name="note" maxlength="140"></label>
      <p class="small muted" style="margin:0">Visible to the club. Don't include medical details.</p>`,
    onSubmit: async (d) => {
      const m = memberById(d.memberId);
      if (!d.from || !d.to || d.to < d.from) throw new Error("“To” must be the same day or after “From”.");
      const batch = writeBatch(db);
      batch.set(doc(collection(db, "absences")), { memberId: m.id, teamId: m.playerTeamId || null, type: d.type, from: d.from, to: d.to,
        note: (d.note || "").trim(), createdBy: S.user.uid, createdByName: S.me.name || "", createdAt: serverTimestamp() });
      log(batch, "Reported unavailability", { label: `${fullName(m)} · ${d.from} → ${d.to}` });
      await batch.commit();
      toast("Unavailability saved");

}

function venueModal(v) {
  openModal({
    title: v ? "Edit venue" : "New venue",
    body: `<label class="f">Name<input type="text" name="name" value="${esc(v?.name || "")}" placeholder="Grindsted Hallen" required></label>
      <label class="f">Address<input type="text" name="address" value="${esc(v?.address || "")}"></label>
      <label class="check"><input type="checkbox" name="isHome" ${v?.isHome ? "checked" : ""}> Home venue (used automatically for new games)</label>`,
    danger: v ? `<button type="button" class="btn danger" data-act="venue-delete" data-id="${v.id}">Delete</button>` : "",
    onSubmit: async (d) => {
      if (!d.name?.trim()) throw new Error("Name is required.");
      const batch = writeBatch(db);
      const ref = v ? doc(db, "venues", v.id) : doc(collection(db, "venues"));
      const data = { name: d.name.trim(), address: (d.address || "").trim(), isHome: !!d.isHome, updatedAt: serverTimestamp() };
      if (v) batch.update(ref, data); else batch.set(ref, { ...data, createdAt: serverTimestamp() });
      // only one home venue
      if (data.isHome) S.venues.filter((x) => x.isHome && x.id !== ref.id).forEach((x) => batch.update(doc(db, "venues", x.id), { isHome: false, updatedAt: serverTimestamp() }));
      log(batch, v ? "Edited venue" : "Created venue", { label: data.name });
      await batch.commit();
      toast("Venue saved");
    }

}

Object.assign(ACTIONS, {
  "cal-view": (el) => { S.calView = el.dataset.view; render(); },
  "cal-type": (el) => { S.calType = el.dataset.type; render(); },
  "week-move": (el) => { S.weekStart = isoAdd(S.weekStart || mondayOf(todayISO()), Number(el.dataset.d)); render(); window.scrollTo(0, 0); },
  "week-today": () => { S.weekStart = mondayOf(todayISO()); render(); },
  "week-goto": (el) => { S.weekStart = mondayOf(el.dataset.date); render(); window.scrollTo(0, 0); },
  "event-new": () => eventModal(null),
  "event-edit": (el) => eventModal(eventById(el.dataset.id)),
  "event-open": (el) => {
    const e = eventById(el.dataset.id);
    if (e) S.weekStart = mondayOf(e.date);
    S.tab = "calendar"; S.eventId = el.dataset.id; render(); window.scrollTo(0, 0);
  },
  "event-back": () => { S.eventId = null; render(); },
  "event-cancel": (el) => {
    const e = eventById(el.dataset.id);
    const cancel = e.status !== "cancelled";
    confirmRun(cancel ? `Cancel ${eventTitle(e)} on ${e.date}?` : "Restore this event?", async () => {
      const batch = writeBatch(db);
      batch.update(doc(db, "events", e.id), { status: cancel ? "cancelled" : "scheduled", updatedAt: serverTimestamp() });
      queuePush(batch, { title: cancel ? "Event cancelled" : "Event is on again",
        body: `${eventTitle(e)} · ${fmtDay(e.date, { weekday: "short", day: "numeric", month: "short" })} ${e.startTime || ""}`,
        teamIds: [e.teamId], memberIds: callUpPublished(e) ? (e.callUpIds || []) : [], tag: `status_${e.id}`, reason: "event-status" });
