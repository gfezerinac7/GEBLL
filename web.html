<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Basketball club</title>
<meta name="description" content="Schedule, results, standings and news from the club.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231d4ed8'/%3E%3Cpath d='M2 32h60M32 2v60M11 11c12 10 12 32 0 42M53 11c-12 10-12 32 0 42' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f8fd; --surface:#fff; --surface-2:#eef3fa; --text:#0f1b2d; --muted:#5b6b80; --line:#dce4ef;
  --accent:#1d4ed8; --accent-dark:#163fae; --accent-soft:#e6eeff; --ok:#1f7a4a; --ok-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe4e2;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --radius:16px; --shadow:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:14px}

/* header */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:var(--text);min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;gap:4px;margin-left:auto}
.menu a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.menu a:hover{background:var(--surface-2);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{border-color:#c4d0e2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.light{background:#fff;color:var(--accent);border-color:#fff}
.btn.ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
@media (max-width:820px){ .menu{display:none} .top .btn.primary{margin-left:auto} }

/* hero */
.hero{position:relative;color:#fff;background:linear-gradient(135deg,#1d4ed8 0%,#163fae 55%,#0f2c7d 100%);overflow:hidden}
.hero.photo{background-size:cover;background-position:center}
.hero.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,44,125,.88),rgba(29,78,216,.55))}
.hero .wrap{position:relative;padding:64px 16px 72px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:800}
.hero p{font-size:18px;color:rgba(255,255,255,.85);margin:14px 0 26px;max-width:34em}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .deco{position:absolute;right:-80px;top:-80px;opacity:.09;pointer-events:none}
.next{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius);padding:20px;backdrop-filter:blur(6px)}
.next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.75);font-weight:700}
.next .vs{font-size:22px;font-weight:800;margin:8px 0 4px}
.next .when{color:rgba(255,255,255,.85)}
@media (max-width:820px){ .hero .wrap{grid-template-columns:1fr;padding:44px 16px 52px} }

/* sections */
section{padding:56px 0}
section.alt{background:var(--surface)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:30px;font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* schedule */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .lbl{font-weight:700;min-width:150px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.seg .n{display:inline-block;min-width:20px;padding:0 5px;margin-left:4px;border-radius:99px;background:rgba(15,27,45,.07);font-size:12px}
select.team{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 34px 0 12px;font:inherit;font-weight:600;max-width:100%}
.days{display:grid;gap:10px}
.day{padding:14px 16px}
.day-h{display:flex;align-items:center;gap:10px;font-weight:700}
.day-h .date{color:var(--muted);font-weight:500}
.day-h .count{margin-left:auto;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 9px;font-size:13px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.pgame{background:#fff1e6;color:#b4480c}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.evs{display:grid;gap:8px;margin-top:10px}
.ev{display:grid;grid-template-columns:4px 110px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--bg)}
.ev .bar{align-self:stretch;border-radius:4px}
.ev .time{font-weight:700;font-variant-numeric:tabular-nums}
.ev .t{font-weight:700}
.ev .where{font-size:14px;color:var(--muted)}
.ev .where a{color:var(--muted)}
.ev.cancelled .t,.ev.cancelled .time{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){ .ev{grid-template-columns:4px 1fr} .ev .time{grid-column:2} .ev .info{grid-column:2} }

/* games */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
.glist{display:grid;gap:10px}
.game{padding:14px 16px;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.game .dt{text-align:center;background:var(--surface-2);border-radius:12px;padding:6px 0;line-height:1.1}
.game .dt b{display:block;font-size:22px}
.game .dt span{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700}
.game .who{font-weight:700}
.game .score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* standings */
.tables{display:grid;gap:20px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th:first-child,td:first-child{text-align:center;width:36px;color:var(--muted)}
tr.us td{background:var(--accent-soft);font-weight:700}
tr:last-child td{border-bottom:none}
.tbl-h{padding:16px 16px 6px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tbl-h h3{font-size:19px}

/* news */
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.post{padding:18px}
.post h3{font-size:19px;margin:8px 0 6px}
.post .body{white-space:pre-wrap;color:#27364a}
.post .more{border:none;background:none;color:var(--accent);font-weight:600;padding:0;margin-top:6px}

/* about */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
@media (max-width:820px){ .about{grid-template-columns:1fr} }
.about .txt{white-space:pre-wrap;font-size:17px}
.contact{padding:20px;display:grid;gap:12px}
.contact .row{display:flex;gap:10px;align-items:flex-start}
.contact .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:16px}
.sponsors{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:10px}
.sponsor{height:110px;display:grid;place-items:center;padding:16px;text-decoration:none;color:var(--text);font-weight:700;text-align:center}
.sponsor img{max-width:100%;max-height:70px;object-fit:contain}

footer{background:#0f1b2d;color:rgba(255,255,255,.75);padding:34px 0 calc(34px + env(safe-area-inset-bottom));font-size:14px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{color:#fff}
.notice{padding:16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);margin:20px 0}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),#f7f9fd,var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* BBapp — public club website (v-0.10). Reads only the public_* collections. */
const firebaseConfig = {
  apiKey: "AIzaSyCHXUL5qlZZ_me6S8oGzMMHqcBs0cV43eY",
  authDomain: "bbapp-6b10e.firebaseapp.com",
  projectId: "bbapp-6b10e",
  storageBucket: "bbapp-6b10e.firebasestorage.app",
  messagingSenderId: "431787724186",
  appId: "1:431787724186:web:450f61927ae01bfc8f7e23"
};
const db = getFirestore(initializeApp(firebaseConfig));

const TEAM_COLORS = ["#1d4ed8", "#e8590c", "#2f9e44", "#ae3ec9", "#0c8599", "#e03131", "#f08c00", "#5f3dc4", "#c2255c", "#495057"];
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^https:\/\//i.test(String(u || "")) ? String(u) : "");
function localISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
const todayISO = () => localISO(new Date());
function isoAdd(iso, n) { const d = new Date(`${iso}T12:00`); d.setDate(d.getDate() + n); return localISO(d); }
function mondayOf(iso) { const d = new Date(`${iso}T12:00`); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localISO(d); }
const fmt = (iso, o) => new Date(`${iso}T12:00`).toLocaleDateString("en-GB", o);
const time = (e) => `${e.startTime || ""}${e.endTime ? ` – ${e.endTime}` : ""}`;
const nowKey = () => `${todayISO()} ${new Date().toTimeString().slice(0, 5)}`;
const evKey = (e) => `${e.date} ${e.startTime || "00:00"}`;
const hasResult = (e) => e.scoreFor !== null && e.scoreFor !== undefined && e.scoreAgainst !== null && e.scoreAgainst !== undefined;
const mapUrl = (e) => { const q = [e.venueName, e.venueAddress].filter(Boolean).join(", "); return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}` : ""; };

const BALL = (size, color = "#1d4ed8", line = "#fff") => `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="${color}"/><path d="M2 32h60M32 2v60M11 11c12 10 12 32 0 42M53 11c-12 10-12 32 0 42" stroke="${line}" stroke-width="3" fill="none"/></svg>`;

const WIN_FROM = isoAdd(mondayOf(todayISO()), -120), WIN_TO = isoAdd(mondayOf(todayISO()), 190);
const S = {
  site: null, teams: [], events: new Map(), extra: new Map(), standings: [], news: [],
  loaded: { site: false, events: false }, error: null,
  week: mondayOf(todayISO()), team: "all", type: "all", openNews: new Set()
};

function fail(err) { console.warn(err); S.error = err; render(); }
onSnapshot(doc(db, "public_site", "main"), (s) => { S.site = s.exists() ? s.data() : {}; S.loaded.site = true; render(); }, fail);
onSnapshot(collection(db, "public_teams"), (s) => { S.teams = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, fail);
onSnapshot(query(collection(db, "public_events"), where("date", ">=", WIN_FROM), where("date", "<=", WIN_TO)), (s) => {
  S.events = new Map(s.docs.map((d) => [d.id, { id: d.id, ...d.data() }])); S.loaded.events = true; render();
}, fail);
onSnapshot(collection(db, "public_standings"), (s) => { S.standings = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, fail);
onSnapshot(query(collection(db, "public_news"), orderBy("createdAt", "desc"), limit(24)), (s) => { S.news = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, fail);

// weeks outside the live window are loaded on demand
const fetched = new Set();
async function ensureWeek(start) {
  const end = isoAdd(start, 6);
  if ((start >= WIN_FROM && end <= WIN_TO) || fetched.has(start)) return;
  fetched.add(start);
  try {
    const s = await getDocs(query(collection(db, "public_events"), where("date", ">=", start), where("date", "<=", end)));
    s.docs.forEach((d) => S.extra.set(d.id, { id: d.id, ...d.data() }));
    render();
  } catch (err) { fail(err); }
}

/* ---------- derived ---------- */
const allEvents = () => [...S.events.values(), ...[...S.extra.values()].filter((e) => !S.events.has(e.id))];
function currentTeams() {
  const cur = S.teams.filter((t) => t.current);
  const withEvents = new Set(allEvents().map((e) => e.teamId));
  const list = cur.length ? cur : S.teams.filter((t) => withEvents.has(t.id));
  return list.sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true }));
}
function teamColor(id) {
  const ids = [...new Set([...S.teams.map((t) => t.id), ...allEvents().map((e) => e.teamId)])].sort();
  return TEAM_COLORS[Math.max(0, ids.indexOf(id)) % TEAM_COLORS.length];
}
const teamOk = (e) => S.team === "all" || e.teamId === S.team;
function evTitle(e) {
  if (e.type === "game") return e.homeAway === "away" ? `${e.opponent} vs ${e.teamName}` : `${e.teamName} vs ${e.opponent}`;
  return e.title ? `${e.teamName} · ${e.title}` : e.teamName;
}
function scoreText(e) {
  return e.homeAway === "away" ? `${e.scoreAgainst} – ${e.scoreFor}` : `${e.scoreFor} – ${e.scoreAgainst}`;
}
function resultPill(e) {
  const f = Number(e.scoreFor), a = Number(e.scoreAgainst);
  return f > a ? `<span class="pill ok">W</span>` : f < a ? `<span class="pill bad">L</span>` : `<span class="pill warn">D</span>`;
}
const games = () => allEvents().filter((e) => e.type === "game" && teamOk(e));
const upcomingGames = () => games().filter((e) => e.status !== "cancelled" && evKey(e) >= nowKey()).sort((a, b) => evKey(a).localeCompare(evKey(b)));
const recentResults = () => games().filter((e) => hasResult(e) && e.status !== "cancelled").sort((a, b) => evKey(b).localeCompare(evKey(a)));

/* ---------- views ---------- */
function clubName() { return S.site?.clubName || "Basketball club"; }
function appUrl() { return safeUrl(S.site?.appUrl) || new URL("./", location.href).href; }

function viewHeader() {
  return `<header class="top"><div class="wrap">
    <a class="brand" href="#top">${BALL(34)}<span>${esc(clubName())}</span></a>
    <nav class="menu"><a href="#schedule">Schedule</a><a href="#games">Games</a>${S.standings.some((x) => x.current) ? `<a href="#standings">Standings</a>` : ""}${S.news.length ? `<a href="#news">News</a>` : ""}<a href="#about">About</a></nav>
    <a class="btn primary sm" href="${esc(appUrl())}">Team app</a>
  </div></header>`;
}
function viewHero() {
  const site = S.site || {};
  const next = upcomingGames()[0];
  const img = safeUrl(site.heroImage);
  return `<div class="hero ${img ? "photo" : ""}" id="top" ${img ? `style="background-image:url('${esc(img)}')"` : ""}>
    <div class="deco">${BALL(420, "#fff", "#1d4ed8")}</div>
    <div class="wrap">
      <div><h1>Welcome to ${esc(clubName())}</h1>
        <p>${esc(site.tagline || "Practices, games, results and news from the club — always up to date.")}</p>
        <div class="ctas"><a class="btn light" href="#schedule">This week's schedule</a><a class="btn ghost-w" href="${esc(appUrl())}">Players &amp; coaches: open the team app</a></div></div>
      ${next ? `<div class="next"><div class="lbl">Next game</div>
        <div class="vs">${esc(evTitle(next))}</div>
        <div class="when">${esc(fmt(next.date, { weekday: "long", day: "numeric", month: "long" }))} · ${esc(next.startTime)}</div>
        <div class="when small" style="margin-top:4px">📍 ${esc(next.venueName || "TBA")} · ${next.homeAway === "away" ? "Away" : "Home"}</div></div>` : ""}
    </div></div>`;
}
function viewSchedule() {
  const days = [...Array(7)].map((_, i) => isoAdd(S.week, i));
  const inWeek = allEvents().filter((e) => e.date >= days[0] && e.date <= days[6] && teamOk(e));
  const count = (t) => inWeek.filter((e) => t === "all" || e.type === t).length;
  const shown = inWeek.filter((e) => S.type === "all" || e.type === S.type).sort((a, b) => evKey(a).localeCompare(evKey(b)));
  const label = `${fmt(days[0], { day: "numeric", month: "short" })} – ${fmt(days[6], { day: "numeric", month: "short", year: "numeric" })}`;
  const teams = currentTeams();
  const today = todayISO();
  const loading = !S.loaded.events;
  return `<section id="schedule"><div class="wrap">
    <div class="sec-head"><div><h2>Schedule</h2><p>Practices and games for all teams.</p></div></div>
    <div class="toolbar">
      <div class="weeknav"><button class="iconbtn" data-act="week" data-d="-7" aria-label="Previous week">‹</button>
        <div class="lbl">${esc(label)}</div>
        <button class="iconbtn" data-act="week" data-d="7" aria-label="Next week">›</button>
        ${S.week !== mondayOf(today) ? `<button class="btn sm" data-act="week" data-d="0">Today</button>` : ""}</div>
      <select class="team" data-change="team" aria-label="Team"><option value="all">All teams</option>${teams.map((t) => `<option value="${esc(t.id)}" ${S.team === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
      <div class="seg">${[["all", "All"], ["practice", "Practices"], ["game", "Games"]].map(([k, l]) => `<button class="${S.type === k ? "on" : ""}" data-act="type" data-t="${k}">${l}<span class="n">${count(k)}</span></button>`).join("")}</div>
    </div>
    <div class="days">${loading ? `<div class="skel"></div><div class="skel"></div><div class="skel"></div>` : days.map((d) => {
      const list = shown.filter((e) => e.date === d);
      return `<div class="card day ${d === today ? "today" : ""}">
        <div class="day-h">${esc(fmt(d, { weekday: "long" }))} <span class="date">${esc(fmt(d, { day: "numeric", month: "long" }))}</span>${d === today ? `<span class="pill accent">Today</span>` : ""}<span class="count">${list.length}</span></div>
        ${list.length ? `<div class="evs">${list.map(eventRow).join("")}</div>` : ""}</div>`;
    }).join("")}</div>
  </div></section>`;
}
function eventRow(e) {
  const map = mapUrl(e);
  const game = e.type === "game";
  return `<div class="ev ${e.status === "cancelled" ? "cancelled" : ""}">
    <div class="bar" style="background:${teamColor(e.teamId)}"></div>
    <div class="time">${esc(time(e))}</div>
    <div class="info"><div class="t">${esc(evTitle(e))} ${game ? `<span class="pill pgame">Game · ${e.homeAway === "away" ? "Away" : "Home"}</span>` : `<span class="pill">Practice</span>`}
      ${e.status === "cancelled" ? `<span class="pill bad">Cancelled</span>` : ""}${game && hasResult(e) ? ` <span class="pill accent">${esc(scoreText(e))}</span>` : ""}</div>
      ${e.venueName ? `<div class="where">📍 ${map ? `<a href="${esc(map)}" target="_blank" rel="noopener">${esc(e.venueName)}</a>` : esc(e.venueName)}</div>` : ""}</div>
  </div>`;
}
function gameCard(e, result) {
  return `<div class="card game">
    <div class="dt"><b>${esc(fmt(e.date, { day: "numeric" }))}</b><span>${esc(fmt(e.date, { month: "short" }))}</span></div>
    <div><div class="who">${esc(evTitle(e))}</div>
      <div class="small muted">${esc(fmt(e.date, { weekday: "short" }))} ${esc(e.startTime)} · ${esc(e.venueName || "TBA")}</div></div>
    ${result ? `<div class="score">${esc(scoreText(e))} ${resultPill(e)}</div>` : `<span class="pill ${e.homeAway === "away" ? "" : "accent"}">${e.homeAway === "away" ? "Away" : "Home"}</span>`}
  </div>`;
}
function viewGames() {
  const up = upcomingGames().slice(0, 6), res = recentResults().slice(0, 6);
  return `<section id="games" class="alt"><div class="wrap">
    <div class="sec-head"><div><h2>Games</h2><p>${S.team === "all" ? "All teams" : esc(S.teams.find((t) => t.id === S.team)?.name || "")}</p></div></div>
    <div class="grid2">
      <div><h3 style="margin-bottom:12px">Upcoming</h3><div class="glist">${up.length ? up.map((e) => gameCard(e, false)).join("") : `<div class="card empty">No games scheduled.</div>`}</div></div>
      <div><h3 style="margin-bottom:12px">Latest results</h3><div class="glist">${res.length ? res.map((e) => gameCard(e, true)).join("") : `<div class="card empty">No results yet.</div>`}</div></div>
    </div></div></section>`;
}
function viewStandings() {
  const list = S.standings.filter((x) => x.current && (x.rows || []).length && (S.team === "all" || x.teamId === S.team))
    .sort((a, b) => (a.teamName || "").localeCompare(b.teamName || "", undefined, { numeric: true }));
  if (!S.standings.some((x) => x.current)) return "";
  return `<section id="standings"><div class="wrap">
    <div class="sec-head"><div><h2>Standings</h2><p>2 points for a win, 1 for a loss.</p></div></div>
    <div class="tables">${list.length ? list.map((x) => `<div class="card">
      <div class="tbl-h"><h3>${esc(x.name)}</h3><span class="pill accent">${esc(x.teamName)}</span></div>
      <div class="tbl"><table><thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>+/-</th><th>PTS</th></tr></thead><tbody>
      ${x.rows.map((r, i) => `<tr class="${r.isUs ? "us" : ""}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf - r.pa > 0 ? "+" : ""}${r.pf - r.pa}</td><td><b>${r.pts}</b></td></tr>`).join("")}
      </tbody></table></div></div>`).join("") : `<div class="card empty">No standings for this team.</div>`}</div>
  </div></section>`;
}
function viewNews() {
  if (!S.news.length) return "";
  const list = [...S.news].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 9);
  return `<section id="news" class="alt"><div class="wrap">
    <div class="sec-head"><div><h2>News</h2><p>From the club and the teams.</p></div></div>
    <div class="news">${list.map((n) => {
      const open = S.openNews.has(n.id), long = (n.body || "").length > 280;
      return `<article class="card post">
        <div class="row">${n.pinned ? `<span class="pill accent">📌 Pinned</span> ` : ""}<span class="small muted">${esc(new Date(n.createdAt || 0).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }))}${(n.teamNames || []).length ? ` · ${esc(n.teamNames.join(", "))}` : ""}</span></div>
        <h3>${esc(n.title)}</h3>
        <div class="body">${esc(open || !long ? n.body : `${n.body.slice(0, 280)}…`)}</div>
        ${long ? `<button class="more" data-act="news" data-id="${esc(n.id)}">${open ? "Show less" : "Read more"}</button>` : ""}
      </article>`;
    }).join("")}</div></div></section>`;
}
function viewAbout() {
  const s = S.site || {};
  const rows = [
    s.address && ["📍", `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}" target="_blank" rel="noopener">${esc(s.address)}</a>`],
    s.email && ["✉️", `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`],
    s.phone && ["📞", `<a href="tel:${esc(s.phone.replace(/\s/g, ""))}">${esc(s.phone)}</a>`],
    safeUrl(s.facebook) && ["f", `<a href="${esc(s.facebook)}" target="_blank" rel="noopener">Facebook</a>`],
    safeUrl(s.instagram) && ["◎", `<a href="${esc(s.instagram)}" target="_blank" rel="noopener">Instagram</a>`]
  ].filter(Boolean);
  const venues = [...new Map(allEvents().filter((e) => e.venueName && e.homeAway !== "away").map((e) => [e.venueName, e])).values()].slice(0, 4);
  const sponsors = (s.sponsors || []).filter((x) => x && x.name);
  return `<section id="about"><div class="wrap">
    <div class="sec-head"><div><h2>About the club</h2></div></div>
    <div class="about">
      <div class="txt">${esc(s.about || `${clubName()} is a basketball club for all ages. New players are always welcome — get in touch!`)}</div>
      <div class="card contact"><h3>Contact</h3>
        ${rows.length ? rows.map(([i, h]) => `<div class="row"><span class="ic">${i}</span><div style="padding-top:5px">${h}</div></div>`).join("") : `<div class="muted small">Contact details coming soon.</div>`}
        ${venues.length ? `<h3 style="margin-top:8px">Where we play</h3>${venues.map((e) => `<div class="row"><span class="ic">🏀</span><div style="padding-top:5px"><a href="${esc(mapUrl(e))}" target="_blank" rel="noopener">${esc(e.venueName)}</a>${e.venueAddress ? `<div class="small muted">${esc(e.venueAddress)}</div>` : ""}</div></div>`).join("")}` : ""}
      </div>
    </div>
    ${sponsors.length ? `<h3 style="margin:40px 0 6px">Our sponsors</h3><div class="sponsors">${sponsors.map((x) => {
      const url = safeUrl(x.url), logo = safeUrl(x.logo);
      const inner = logo ? `<img src="${esc(logo)}" alt="${esc(x.name)}" loading="lazy">` : esc(x.name);
      return url ? `<a class="card sponsor" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="card sponsor">${inner}</div>`;
    }).join("")}</div>` : ""}
  </div></section>`;
}
function viewFooter() {
  return `<footer><div class="wrap">
    <div><b style="color:#fff">${esc(clubName())}</b> · © ${new Date().getFullYear()}</div>
    <div><a href="${esc(appUrl())}">Team app login</a> · Powered by ${esc(S.site?.appName || "BBapp")}</div>
  </div></footer>`;
}

let queued = false;
function render() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; renderNow(); }); } }
function renderNow() {
  document.title = clubName();
  const err = S.error ? `<div class="wrap"><div class="notice"><b>The schedule can't be loaded right now.</b> ${S.error.code === "permission-denied" ? "The club's database settings don't allow public reading yet." : "Check your connection and reload the page."}</div></div>` : "";
  const y = window.scrollY;
  $("#app").innerHTML = viewHeader() + viewHero() + err + viewSchedule() + viewGames() + viewStandings() + viewNews() + viewAbout() + viewFooter();
  window.scrollTo(0, y);
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "week") { const d = Number(el.dataset.d); S.week = d === 0 ? mondayOf(todayISO()) : isoAdd(S.week, d); ensureWeek(S.week); }
  if (act === "type") S.type = el.dataset.t;
  if (act === "news") { S.openNews.has(el.dataset.id) ? S.openNews.delete(el.dataset.id) : S.openNews.add(el.dataset.id); }
  render();
});
document.addEventListener("change", (ev) => { if (ev.target.dataset.change === "team") { S.team = ev.target.value; render(); } });
render();
</script>
</body>
</html>
