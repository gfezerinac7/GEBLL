<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task and Project Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header i {
            font-size: 32px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            background: #f9f9f9;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: #f0f0f0;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn i {
            font-size: 16px;
        }

        .content {
            padding: 30px 20px;
            display: none;
            min-height: 400px;
        }

        .content.active {
            display: block;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 11px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
        }

        .btn-danger {
            background: #ff6b6b;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #51cf66;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .card.completed {
            opacity: 0.6;
            background: #f5f5f5;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card.completed .card-title {
            text-decoration: line-through;
            color: #999;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-high {
            background: #ffe0e0;
            color: #c92a2a;
        }

        .badge-medium {
            background: #fff3bf;
            color: #b08600;
        }

        .badge-low {
            background: #d3f9d8;
            color: #2f7e1f;
        }

        .badge-daily {
            background: #e7f5ff;
            color: #0066cc;
        }

        .badge-weekly {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-monthly {
            background: #fce4ec;
            color: #c2185b;
        }

        .badge-date {
            background: #f0f0f0;
            color: #666;
        }

        .card-meta {
            font-size: 13px;
            color: #666;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item i {
            color: #999;
        }

        .assignee-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .assignee-avatar {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #51cf66 0%, #40c057 100%);
            transition: width 0.3s;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 15px;
            display: block;
        }

        .empty-state p {
            font-size: 16px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .team-member:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .team-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .team-role {
            font-size: 12px;
            color: #999;
        }

        .team-actions {
            display: flex;
            gap: 8px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 12px 15px;
            }

            .card-header {
                flex-direction: column;
            }

            .content {
                padding: 20px 15px;
            }

            .form-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-tasks"></i>
                Task & Project Manager
            </h1>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tasks')">
                <i class="fas fa-list-check"></i>
                Tasks
            </button>
            <button class="tab-btn" onclick="switchTab('projects')">
                <i class="fas fa-folder"></i>
                Projects
            </button>
            <button class="tab-btn" onclick="switchTab('team')">
                <i class="fas fa-users"></i>
                Team
            </button>
        </div>

        <!-- TAB TAREAS -->
        <div id="tasks" class="content active">
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    New Task
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="taskName" placeholder="Ex: Review client proposal">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="taskDesc" placeholder="Additional details..." rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Recurrence Type</label>
                        <select id="taskRecurrence">
                            <option value="once">Once</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="taskDate">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Assign To</label>
                        <select id="taskAssignee">
                            <option value="">Unassigned</option>
                            <option value="juan">John Smith</option>
                            <option value="maria">Maria Garcia</option>
                            <option value="carlos">Carlos Rodriguez</option>
                        </select>
                    </div>
                </div>
                <button class="btn" onclick="addTask()">
                    <i class="fas fa-check"></i>
                    Add Task
                </button>
            </div>

            <div class="section-title">
                <i class="fas fa-tasks"></i>
                Active Tasks
            </div>
            <div id="taskList"></div>
        </div>

        <!-- TAB PROYECTOS -->
        <div id="projects" class="content">
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    New Project
                </div>
                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" id="projectName" placeholder="Ex: Website redesign">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="projectDesc" placeholder="Goals and details..." rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="projectStart">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="projectEnd">
                    </div>
                </div>
                <button class="btn" onclick="addProject()">
                    <i class="fas fa-plus"></i>
                    Create Project
                </button>
            </div>

            <div class="section-title">
                <i class="fas fa-folder-open"></i>
                Projects in Progress
            </div>
            <div id="projectList"></div>
        </div>

        <!-- TAB EQUIPO -->
        <div id="team" class="content">
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    Add Team Member
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="memberName" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="memberEmail" placeholder="email@company.com">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="memberRole">
                        <option value="Member">Member</option>
                        <option value="Lead">Lead</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <button class="btn" onclick="addTeamMember()">
                    <i class="fas fa-user-plus"></i>
                    Add Member
                </button>
            </div>

            <div class="section-title">
                <i class="fas fa-users"></i>
                Team Members
            </div>
            <div id="teamList"></div>
        </div>
    </div>

    <script>
        const state = {
            tasks: JSON.parse(localStorage.getItem('tasks') || '[]'),
            projects: JSON.parse(localStorage.getItem('projects') || '[]'),
            team: JSON.parse(localStorage.getItem('team') || '[]')
        };

        const assigneeMap = {
            juan: { name: 'John Smith', initials: 'JS' },
            maria: { name: 'Maria Garcia', initials: 'MG' },
            carlos: { name: 'Carlos Rodriguez', initials: 'CR' }
        };

        function switchTab(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const recurrence = document.getElementById('taskRecurrence').value;
            const date = document.getElementById('taskDate').value;
            const priority = document.getElementById('taskPriority').value;
            const assignee = document.getElementById('taskAssignee').value;

            if (!name) {
                alert('Please enter a task name');
                return;
            }

            state.tasks.push({
                id: Date.now(),
                name,
                desc,
                recurrence,
                date,
                priority,
                assignee,
                completed: false,
                createdAt: new Date().toLocaleDateString('es-ES')
            });

            save();
            clearTaskForm();
            renderTasks();
        }

        function clearTaskForm() {
            document.getElementById('taskName').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskRecurrence').value = 'once';
            document.getElementById('taskDate').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskAssignee').value = '';
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            if (task) task.completed = !task.completed;
            save();
            renderTasks();
        }

        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                state.tasks = state.tasks.filter(t => t.id !== id);
                save();
                renderTasks();
            }
        }

        function addProject() {
            const name = document.getElementById('projectName').value.trim();
            const desc = document.getElementById('projectDesc').value.trim();
            const start = document.getElementById('projectStart').value;
            const end = document.getElementById('projectEnd').value;

            if (!name) {
                alert('Please enter a project name');
                return;
            }

            state.projects.push({
                id: Date.now(),
                name,
                desc,
                start,
                end,
                progress: 0,
                createdAt: new Date().toLocaleDateString('es-ES')
            });

            save();
            clearProjectForm();
            renderProjects();
        }

        function clearProjectForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('projectDesc').value = '';
            document.getElementById('projectStart').value = '';
            document.getElementById('projectEnd').value = '';
        }

        function deleteProject(id) {
            if (confirm('Delete this project?')) {
                state.projects = state.projects.filter(p => p.id !== id);
                save();
                renderProjects();
            }
        }

        function addTeamMember() {
            const name = document.getElementById('memberName').value.trim();
            const email = document.getElementById('memberEmail').value.trim();
            const role = document.getElementById('memberRole').value;

            if (!name || !email) {
                alert('Please enter name and email');
                return;
            }

            state.team.push({
                id: Date.now(),
                name,
                email,
                role,
                joinDate: new Date().toLocaleDateString('es-ES')
            });

            save();
            clearMemberForm();
            renderTeam();
        }

        function clearMemberForm() {
            document.getElementById('memberName').value = '';
            document.getElementById('memberEmail').value = '';
            document.getElementById('memberRole').value = 'Miembro';
        }

        function deleteTeamMember(id) {
            if (confirm('Delete this member?')) {
                state.team = state.team.filter(m => m.id !== id);
                save();
                renderTeam();
            }
        }

        function save() {
            localStorage.setItem('tasks', JSON.stringify(state.tasks));
            localStorage.setItem('projects', JSON.stringify(state.projects));
            localStorage.setItem('team', JSON.stringify(state.team));
        }

        function getPriorityBadge(priority) {
            const map = { high: 'High', medium: 'Medium', low: 'Low' };
            const className = `badge badge-${priority}`;
            return `<span class="${className}">${map[priority]}</span>`;
        }

        function getRecurrenceBadge(recurrence) {
            const map = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', once: 'Once' };
            const icon = { daily: 'fa-repeat', weekly: 'fa-calendar-week', monthly: 'fa-calendar-days', once: 'fa-calendar' }[recurrence];
            const className = `badge badge-${recurrence === 'once' ? 'date' : recurrence}`;
            return `<span class="${className}"><i class="fas ${icon}"></i> ${map[recurrence]}</span>`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'No date';
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            if (state.tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No tasks yet. Create one to get started!</p>
                    </div>
                `;
            } else {
                taskList.innerHTML = state.tasks
                    .sort((a, b) => !a.completed - !b.completed)
                    .map(task => {
                        const assigneeInfo = task.assignee ? assigneeMap[task.assignee] : null;
                        return `
                            <div class="card ${task.completed ? 'completed' : ''}">
                                <div class="card-header">
                                    <div class="card-title">
                                        <div class="checkbox-wrapper">
                                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                                            <span>${task.name}</span>
                                        </div>
                                    </div>
                                    ${getPriorityBadge(task.priority)}
                                </div>
                                ${task.desc ? `<p style="color: #666; margin-bottom: 10px; font-size: 14px;">${task.desc}</p>` : ''}
                                <div class="card-meta">
                                    <div class="meta-item">
                                        ${getRecurrenceBadge(task.recurrence)}
                                    </div>
                                    <div class="meta-item">
                                        <i class="fas fa-calendar"></i>
                                        ${formatDate(task.date)}
                                    </div>
                                </div>
                                ${assigneeInfo ? `
                                    <div class="assignee-badge">
                                        <div class="assignee-avatar">${assigneeInfo.initials}</div>
                                        ${assigneeInfo.name}
                                    </div>
                                ` : ''}
                                <div class="card-actions">
                                    <button class="btn btn-danger" onclick="deleteTask(${task.id})">
                                        <i class="fas fa-trash"></i>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        `;
                    })
                    .join('');
            }
        }

        function renderProjects() {
            const projectList = document.getElementById('projectList');
            if (state.projects.length === 0) {
                projectList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder"></i>
                        <p>No projects yet. Create one to get started!</p>
                    </div>
                `;
            } else {
                projectList.innerHTML = state.projects.map(project => {
                    const progress = Math.floor(Math.random() * 100);
                    return `
                        <div class="card">
                            <div class="card-header">
                                <div>
                                    <div class="card-title">${project.name}</div>
                                    ${project.desc ? `<p style="color: #666; margin-top: 6px; font-size: 14px;">${project.desc}</p>` : ''}
                                </div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="card-meta">
                                <div class="meta-item">
                                    <i class="fas fa-calendar-check"></i>
                                    ${formatDate(project.start)} → ${formatDate(project.end)}
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-chart-pie"></i>
                                    Progress: ${progress}%
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-danger" onclick="deleteProject(${project.id})">
                                    <i class="fas fa-trash"></i>
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function renderTeam() {
            const teamList = document.getElementById('teamList');
            if (state.team.length === 0) {
                teamList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No team members yet. Add your team!</p>
                    </div>
                `;
            } else {
                teamList.innerHTML = state.team.map(member => {
                    const initials = member.name.split(' ').map(n => n[0]).join('').toUpperCase();
                    return `
                        <div class="team-member">
                            <div class="team-avatar">${initials}</div>
                            <div class="team-info">
                                <div class="team-name">${member.name}</div>
                                <div class="team-role">${member.email} • ${member.role}</div>
                            </div>
                            <div class="team-actions">
                                <button class="btn btn-danger" onclick="deleteTeamMember(${member.id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        renderTasks();
        renderProjects();
        renderTeam();
    </script>
</body>
</html>
